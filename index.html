of 9, in the <b>{band}</b> range. The theme of this level for type {t} is <b>{theme}</b>.","youNow":"You now","extreme":"extreme","bestTitle":"Level 1 · at its very best","worstTitle":"Level 9 · at its very worst","wisdom":"The wisdom that opens it: {w}.","extremesNote":"Levels 1 and 9 are extremes. Few people live there; they show the full range of the type.","careNote":"Some of your answers suggest the last weeks have been heavy. Please be kind to yourself, and consider talking to someone you trust or to a professional. You don't have to work through this alone.","moreLevels":"Read more about the levels","bandRange":"levels {r}","signals":"Signals for type {t}","kWake":"Wake-up call","kWakeNote":"(the slide from 3 to 4: first sign of autopilot)","kFlag":"Red flag","kFlagNote":"(the fear from 6 to 7)","kGrace":"Saving grace","levelsNote":"When you notice your wake-up call: notice, stop, and do the opposite. This is a snapshot of the last 4 weeks, not a fixed state.","instEyebrow":"Instincts","instTitle":"{iname} {t}: {head}","ord":["1st","2nd","3rd"],"moreInst":"What the instinct stack means","instP1":"Everyone has three survival instincts: <b>Self-preservation (SP)</b>, focused on safety, health, comfort and resources; <b>Social (SO)</b>, focused on belonging, role and the group; and <b>One-to-one (SX)</b>, focused on intense connection, chemistry and fascination.","instP2":"We use all three, but in a fixed order. The <b>first</b> is where your attention goes automatically. The <b>second</b> supports it. The <b>third</b> is your blind spot: it gets neglected and often causes trouble you don't see coming. For you that is {blind}.","instP3":"Your type combined with your first instinct gives your <b>subtype</b>, one of 27. The three versions of type {t}:","subYou":"(you)","sureEyebrow":"How sure is this?","confHead":"Your answers gave <b>type {t} {a} points</b> and the runner-up, <b>type {s}, {b} points</b>: a gap of <b>{g}</b>.","confHigh":"That is a big gap. Your answers point consistently to {t}, so you can read this profile with confidence.","confMod":"{t} is ahead, but {s} is not far behind. Read about {s} too: if it describes your inner motives better, trust that over the test.","confLow":"That is too close for the test to separate reliably. Compare the two below: the one that explains <i>why</i> you do things, not just what you do, is usually your type.","moreSure":"Compare {t} and {s}, and see all scores","typeN":"Type {n}","cmpWant":"Deep down I want","cmpFear":"My deepest fear","cmpStress":"Under pressure I…","allScores":"All nine scores","pointsNote":"Points come from how strongly you agreed with each type's statements (0–100), plus bonuses from your self-descriptions and tie-breaker choices.","rootsEyebrow":"Roots","rootsTitle":"Your family pattern","rootsText":"In the Enneagram tradition, type {t} often formed around the <b>{fig}</b>, with a sense of <b>{rel}</b>.","kAbsorbed":"The message absorbed","kNeeded":"The message needed","rootsNote":"The model describes tendencies; your own story may differ, and that difference is worth exploring.","famSkipped":"You skipped the family questions.","famMine":"<b>Your answers:</b> comfort and care came mostly from {f1} ({r1}); structure and protection mostly from {f2} ({r2}). Compare this with the pattern above.","noAnswer":"no answer","practiceEyebrow":"Practice","practiceTitle":"Your first three steps","practiceNote":"Try them for 66 days. What is written by repetition is undone by repetition.","teaserEyebrow":"Coming in the full profile","teaserTitle":"Go deeper","teaserList":["All nine levels of type {t}, with what moves you from one to the next","Your subtype in depth, and how it shows in love, work and money","Your type with every other type: relationships and conflict","A 66-day healing path built on your level and direction","A family session: your pattern alongside your parents' and children's"],"fbEyebrow":"Pilot","fbTitle":"Help improve the test","qGuess":"Before today, which type did you think you were?","optDontKnow":"I didn't know","qRheti":"If you took the RHETI (Riso-Hudson) test, which type did it give?","optNotTaken":"Not taken","qAcc":"How accurate does this profile feel?","accOpts":["1 · Not at all","2","3 · Partly","4","5 · Spot on"],"qComment":"Anything that felt off, or especially true?","restart":"Start again","sharedEyebrow":"Saved profile","sharedTitle":"{name}'s profile","sharedTitleAnon":"A shared profile","sharedMeta":"Own guess: {gs} · RHETI: {rh} · Accuracy: {acc}","takeTest":"Take the test yourself","heroEyebrow":"Enneagram 360 · Pilot","heroTitle":["Know your pattern.","See your depth.","Choose your direction."],"heroSub":"A self-discovery test that shows not only who you are, but where you stand with it today, and where you can go from here.","heroMeta":"About 20 minutes · Free · Private","apEyebrow":"The approach","apTitle":"A map of nine ways of being human","apText":"The Enneagram is an ancient map of human nature. Its symbol, a circle holding a triangle and a six-pointed figure, describes nine patterns of attention and motivation. We are all born with the nine possibilities, but early in life we lean on one of them to feel safe and loved. That pattern becomes our personality: our gifts, and also the habits that keep us stuck.","apPillars":[["Nine patterns","Nine core motivations, each with its own desire, fear and way of seeing the world."],["Three centers","Body, heart and head: three intelligences, and three ways we react to life."],["Old roots, living practice","Rooted in centuries-old wisdom traditions, deepened by modern psychology."]],"dfEyebrow":"Why it's different","dfTitle":"Not a box. A mirror that moves.","dfText":"Most personality tests sort your behavior into categories. The Enneagram goes underneath, to why you do what you do.","dfOthers":"Most personality tests","dfEnn":"The Enneagram","dfRows":[["What you do","Why you do it"],["A fixed label","A pattern that shifts with stress and growth"],["Your strengths","Your gifts and your blind spots"],["A description","A path of growth"]],"tyEyebrow":"Meet the nine","tyTitle":"Which one feels uncomfortably familiar?","tyHint":"Tap a number.","z3Eyebrow":"Why 360","z3Title":"Most Enneagram tests stop at the circle","z3Text":"They tell you your type, maybe your wing. Enneagram 360 reads you in three dimensions, because two people of the same type can live very different lives.","z3Dims":[["Pattern","Your type, wing and instinctual subtype: the shape of your personality."],["Depth","Your current level of health, from free and present to stuck on autopilot."],["Movement","The direction you are moving right now: toward growth or toward stress."]],"z3TblA":"Typical test","z3TblB":"Enneagram 360","z3Partial":"sometimes","z3Rows":["Core type","Wing","Instinctual subtype","Current level of health","Direction right now","Family roots","How sure the result is","First steps to grow"],"hwEyebrow":"How it works","hwTitle":"Three steps, about 20 minutes","hwSteps":[["Answer honestly","About 135 short statements. There are no right answers, only true ones."],["See your 360 profile","Your type, depth and direction, with visuals and clear explanations."],["Start practicing","Three concrete first steps for the next 66 days."]],"ftEyebrow":"Taking it further","ftTitle":"This is only the first layer","ftTiers":[["Discover","Your full 360 profile: type, wing, subtype, current level, direction, family roots and three first steps.","Free · now"],["Deep Profile","Beyond the snapshot: a longer test, all nine levels of your type and what moves you between them, your subtype in love, work and money, and how you relate to every other type.","Coming soon"],["Healing Path","A guided 66-day practice built on your level and direction, with weekly check-ins and a retest that shows how you have moved.","Coming soon"],["Guided","One-to-one and family sessions to work with your pattern in real life.","Coming soon"]],"fqEyebrow":"Frequently asked questions","fqItems":[["Is this a diagnosis?","No. It is a map for self-reflection. It describes tendencies, not disorders."],["Can my type change?","Your core type stays the same through life. What changes is your level and direction, and that is exactly where growth happens."],["What happens to my answers?","Your result is sent only to your email address and kept in Anil's private pilot list. Your individual answers and your family answers never leave your device."]],"endTitle":"Ready to see your pattern?","gateEyebrow":"Almost there","gateTitle":"Where should we send your profile?","gateText":"Your profile opens on the next screen and is emailed to you at the same time, so you can come back to it whenever you like.","emailLabel":"Your email address","consentProfile":"Email me my Enneagram 360 profile. I agree that my result and email address are stored for this pilot as described in the <a href=\"privacy.html\" target=\"_blank\" rel=\"noopener\">privacy notice</a>.","consentNews":"Also keep me updated about Enneagram 360 (optional, unsubscribe any time).","gateBtn":"Show and email my profile","gateInvalid":"Please enter a valid email address.","gateNeedConsent":"Please tick the first box so we can email you your profile.","sending":"Sending…","sentOk":"Your profile is on its way to {email}. If you don't see it, check your spam folder.","sentNews":"Please confirm your newsletter subscription with the link in that email.","sentFail":"We couldn't send the email right now. Your profile is below; please take a screenshot or try again later.","fbBtn":"Send feedback","fbSent":"Thank you, your feedback has been sent.","fbFail":"Feedback could not be sent. Please try again.","privacyLink":"Privacy","subWorking":"One moment…","subConfirmed":"Thank you, your subscription is confirmed.","subConfirmedSub":"You'll receive occasional updates about Enneagram 360. You can unsubscribe any time with the link in every email.","subUnsub":"You have been unsubscribed. You won't receive further emails.","subInvalid":"This link is no longer valid.","subFail":"Something went wrong. Please try the link again in a few minutes."}},"tr":{"T":{"1":{"name":"Islah Edici","tag":"İlkeli, amaç odaklı, öz denetimli","summary":"Sizi derin bir iyi olma ve dürüst yaşama isteği yönlendirir. Her şeyin nasıl daha iyi olabileceğini net görür, kendinize yüksek standartlar koyarsınız. İç eleştirmeniniz sizi yolda tutar ama nadiren dinlenmenize izin verir.","desire":"İyi, doğru ve bütün olmak","fear":"Yanlış, bozuk ya da kötü olmak","passion":"Öfke (içe atılmış, içerleme olarak)","fixation":"İçerleme","virtue":"Dinginlik","idea":"Kutsal Mükemmellik","childMsg":"“Hata yapmak doğru değil.”","lostMsg":"“Sen iyisin.”","figure":"koruyucu figür","rel":"hayal kırıklığı (frustrasyon)","famNote":"Koruyucu figür rehberlikte yetersiz ya da sert kalmıştır; çocuk bu işi görmek için içinde katı bir yargıç inşa etmiştir.","wake":"Her şeyi tek başına düzeltme mecburiyeti hissetmek.","flag":"“İdeallerim yanlış ve hiçbir şey işe yaramıyor.”","grace":"“Benim için imkânsız diye bir şey yok.”","growth":"Sağlıklı 7’ye doğru: gevşer, hayattan keyif alır ve neşenin de hayata meşru bir yanıt olduğunu keşfedersiniz.","stress":"Ortalama 4’e doğru: anlaşılmadığınızı hisseder, karamsarlaşır ve sorumluluklarınızdan kaçmak istersiniz.","levels":{"h":"Bilge, ayırt edici ve kabul eden; ilkelere sıcaklıkla bağlı.","a":"Düzenli, eleştirel, gergin; her şeyi doğru tutmaya çalışan.","u":"Katı, sert, kendini ve başkalarını cezalandıran."},"actions":["İç eleştirmeninizi duyduğunuzda durun ve sorun: bu standart benim mi, yoksa bir yerden mi edindim?","Bu hafta küçük bir şeyi bilerek kusurlu bırakın ve gerçekte ne olduğunu gözlemleyin.","Hiçbir amacı olmayan bir saatlik keyfi, işinizi planladığınız ciddiyetle takviminize koyun."]},"2":{"name":"Yardımsever","tag":"Cömert, sıcak, memnun etmeye çalışan","summary":"Sizi sevilme ve insanların hayatında önemli olma isteği yönlendirir. Başkalarının ihtiyaçlarını büyük bir duyarlılıkla sezer ve cömertçe verirsiniz; kendi ihtiyaçlarınız ise çoğu zaman arka planda kalır.","desire":"Sevilmek ve istenmek","fear":"İstenmemek, sevgiye layık olmamak","passion":"Kibir","fixation":"Pohpohlama","virtue":"Tevazu","idea":"Kutsal İrade","childMsg":"“Kendi ihtiyaçlarının olması doğru değil.”","lostMsg":"“Sen isteniyorsun.”","figure":"koruyucu figür","rel":"reddedilme","famNote":"Koruyucu figürden gelen sevgi koşulsuz hissedilmemiştir; çocuk sevginin faydalı olarak kazanılması gerektiğini öğrenmiştir.","wake":"İnsanları kazanmak için onların ayağına gitmek zorunda hissetmek.","flag":"“Sevdiğim insanları kendimden uzaklaştırıyorum.”","grace":"“İhtiyacım olanı elde etmek için durumu etkileyebilirim.”","growth":"Sağlıklı 4’e doğru: zor olanlar da dahil kendi duygularınızla dürüstçe karşılaşır, kendinizi olduğunuz gibi kabul edersiniz.","stress":"Ortalama 8’e doğru: ilginize karşılık gelmediğinde talepkâr ve kontrolcü olursunuz.","levels":{"h":"Bencil olmayan, empatik; başkalarıyla birlikte kendine de bakan.","a":"Memnun etmeye çalışan, araya giren, sessizce karşılık bekleyen.","u":"Manipülatif, hak iddia eden; suçluluk ya da baskı kullanan."},"actions":["Yardım etmeden önce kendinize sorun: şu an benim neye ihtiyacım var?","Küçük bir konuda birinden yardım isteyin ve onun vermesine izin verin.","Bu hafta bir içerleme anını fark edin ve arkasındaki ihtiyacı adlandırın."]},"3":{"name":"Başaran","tag":"Uyumlu, hırslı, imaj bilinçli","summary":"Sizi değerli olma ve takdir edilme isteği yönlendirir. Hedef koyar, hızla uyum sağlar ve sonuç üretirsiniz. Risk, başardıklarınızın altında kim olduğunuzla bağınızı kaybetmektir.","desire":"Değerli ve kıymetli olmak","fear":"Değersiz ya da başarısız olmak","passion":"Aldatma (kendini kandırma)","fixation":"Kibir (vanity)","virtue":"Hakikilik","idea":"Kutsal Kanun / Umut","childMsg":"“Kendi duygularının ve kimliğinin olması doğru değil.”","lostMsg":"“Sen kendin olduğun için seviliyorsun.”","figure":"besleyici figür","rel":"bağlanma","famNote":"Çocuk besleyici figüre bağlanmış, onun neye değer verdiğini sezmiş ve o olmuştur; övgü varlığa değil yapılana gelmiştir.","wake":"Statü, makam, ilgi ve onay için kendini yırtmak.","flag":"“Başarısız oluyorum; boşum ve sahteyim.”","grace":"“Sonucu etkileyebilirim.”","growth":"Sağlıklı 6’ya doğru: kendi başarınızdan büyük bir şeye bağlanır, insanların gerçek duygularınızı görmesine izin verirsiniz.","stress":"Ortalama 9’a doğru: geri çekilir, motivasyonunuzu kaybeder ve duygusal olarak uyuşursunuz.","levels":{"h":"Sahici, içten yönlendirilen, ilham veren bir rol model.","a":"Performans odaklı, imajını yöneten, rekabetçi.","u":"Aldatıcı, fırsatçı, görüntüyü korumak için çaresiz."},"actions":["Günde bir kez sorun: yapılması gerekenler dışında gerçekte ne hissediyorum?","Güvendiğiniz biriyle bir şüphenizi ya da başarısızlığınızı süslemeden paylaşın.","Bu hafta yalnızca keyif aldığınız için, seyircisiz bir şey yapın."]},"4":{"name":"Bireyselci","tag":"Dışavurumcu, duyarlı, kendine dönük","summary":"Sizi gerçek benliğinizi bulma ve ifade etme isteği yönlendirir. Derin hisseder, sahiciliğe ve güzelliğe değer verir, çoğu zaman özsel bir şeyin eksik olduğunu sezersiniz.","desire":"Kendin olmak ve anlamını bulmak","fear":"Kimliği ya da kişisel önemi olmamak","passion":"Kıskançlık","fixation":"Melankoli","virtue":"Soğukkanlılık (denge)","idea":"Kutsal Köken","childMsg":"“Fazla işlevsel ya da fazla mutlu olmak doğru değil.”","lostMsg":"“Sen olduğun gibi görülüyorsun.”","figure":"her iki ebeveyn figürü","rel":"hayal kırıklığı (frustrasyon)","famNote":"Çocuk iki ebeveyn tarafından da gerçekten görülmediğini hissetmiş ve kendisinde bir şeyin eksik olduğu sonucuna varmıştır.","wake":"Hayallere dalarak duyguları pekiştirmek ve onlara tutunmak.","flag":"“Hayatımı mahvediyor, fırsatlarımı harcıyorum.”","grace":"“Farkındayım.”","growth":"Sağlıklı 1’e doğru: ilkelerinize göre davranır, işi bitirir ve duyguyu disiplinli bir emeğe dönüştürürsünüz.","stress":"Ortalama 2’ye doğru: insanlara tutunur, ihtiyaç duyulmaya ihtiyaç duyarsınız.","levels":{"h":"Yaratıcı, duygularıyla dürüst, şefkatli.","a":"Değişken mizaçlı, özlem dolu, kıyaslayan, hayallere çekilen.","u":"Umutsuz, kendini reddeden, yabancılaşmış."},"actions":["Kendinizi biriyle kıyasladığınızda, sizde olan üç şeyi yazın.","Bu hafta ruh halinizden bağımsız olarak yaratıcı ya da pratik bir işi bitirin.","Her akşam sıradan bir an için şükran duyun."]},"5":{"name":"Araştırmacı","tag":"Gözlemci, bağımsız, mahremiyetine düşkün","summary":"Sizi yetkin olma ve anlama isteği yönlendirir. Gözlemler, analiz eder, zamanınızı ve enerjinizi korursunuz. Risk, kafanızın içinde yaşayıp hayata mesafeli kalmaktır.","desire":"Yetenekli ve yetkin olmak","fear":"İşe yaramaz, çaresiz ya da yetersiz olmak","passion":"Açgözlülük (biriktirme)","fixation":"Cimrilik (tutma)","virtue":"Bağlı olmamak","idea":"Kutsal Her Şeyi Bilme","childMsg":"“Dünyada rahat olmak doğru değil.”","lostMsg":"“İhtiyaçların sorun değil.”","figure":"her iki ebeveyn figürü","rel":"reddedilme","famNote":"Ebeveynler ya müdahaleci ya da ulaşılmaz hissettirmiş; çocuk ihtiyaçlarını küçültmüş ve zihnine çekilmiştir.","wake":"Gerçeklikten kopup kavramlarda ve zihinsel kurgularda kaybolmak.","flag":"“Dünyada ve insanlar arasında asla bir yer bulamayacağım.”","grace":"“Cevapları bulabilirim.”","growth":"Sağlıklı 8’e doğru: kararlı davranır, sorunlarla geldikçe başa çıkabileceğinize güvenirsiniz.","stress":"Ortalama 7’ye doğru: dağınıklığa ve huzursuzluğa kayarsınız.","levels":{"h":"Vizyoner, içgörülü, bilgisini cömertçe paylaşan.","a":"Mesafeli, analitik, zamanı ve enerjiyi biriktiren.","u":"Yalıtılmış, nihilist, ihtiyaçlarından ve insanlardan kopuk."},"actions":["Bu hafta tam hazır hissetmeden bir kez harekete geçin.","Bildiğiniz bir şeyi ondan fayda görecek biriyle paylaşın.","Günde üç kez bedeninizi fark edin: açlık, yorgunluk, gerginlik."]},"6":{"name":"Sadık","tag":"Bağlı, sorumlu, kaygılı","summary":"Sizi güvenlik ve destek isteği yönlendirir. Sadık, risklere karşı uyanık ve sorunları önceden görmekte iyisiniz. Şüphe ve kaygı kendinize güvenmenizi zorlaştırabilir.","desire":"Güvenlik ve desteğe sahip olmak","fear":"Desteksiz ya da rehbersiz kalmak","passion":"Korku (kaygı)","fixation":"Korkaklık / şüphe","virtue":"Cesaret","idea":"Kutsal İnanç","childMsg":"“Kendine güvenmek doğru değil.”","lostMsg":"“Sen güvendesin.”","figure":"koruyucu figür","rel":"bağlanma","famNote":"Çocuk koruyucu figüre bağlanmış ve onun onayını güvenliğin kaynağı yapmıştır.","wake":"Rehberlik için kendinden başka, dışarıdaki bir şeye bağımlı olmak.","flag":"“Davranışlarım güvenliğimi tehlikeye attı.”","grace":"“Ben sorumluyum.”","growth":"Sağlıklı 9’a doğru: gevşer, güvenir, daha açık ve alıcı olursunuz.","stress":"Ortalama 3’e doğru: değerinizi kanıtlamak için rekabetçi ve imaj odaklı olursunuz.","levels":{"h":"Cesur, güvenen, bağlı; dengeleyici bir varlık.","a":"Endişeli, şüpheci; bağımlılık ve meydan okuma arasında gidip gelen.","u":"Kuşkucu, panik halinde; saldıran ya da çöken."},"actions":["Bir “ya şöyle olursa” başladığında yazın ve yanına bir “ya iyi giderse” ekleyin.","Bu hafta kimsenin fikrini sormadan bir karar verin.","Her günü iyi giden bir şeyi adlandırarak bitirin."]},"7":{"name":"Hevesli","tag":"Spontane, çok yönlü, dağınık","summary":"Sizi mutlu, özgür ve tatmin olma isteği yönlendirir. Meraklı, hızlı ve planlarla dolusunuz. Risk, acıdan kaçmak ve derinleşecek kadar uzun kalmamaktır.","desire":"Tatmin ve hoşnut olmak","fear":"Acı ya da yoksunluk içinde sıkışıp kalmak","passion":"Oburluk (deneyime)","fixation":"Planlama","virtue":"Bilinçli farkındalık (itidal)","idea":"Kutsal Plan / Bilgelik","childMsg":"“Hiçbir şey için kimseye bağımlı olmak doğru değil.”","lostMsg":"“Sana bakılacak.”","figure":"besleyici figür","rel":"hayal kırıklığı (frustrasyon)","famNote":"Çocuk besleyici figürden yeterince ilgi göremediğini hissetmiş ve kendini kendisi beslemeye karar vermiştir.","wake":"Her zaman dışarıda, elindekinden daha iyisi olduğunu düşünmek.","flag":"“Yaptığım şeyler bana acı ve mutsuzluktan başka bir şey getirmiyor.”","grace":"“Deneyimim var.”","growth":"Sağlıklı 5’e doğru: derinleşir, odaklanır ve sessizlikten keyif alırsınız.","stress":"Ortalama 1’e doğru: eleştirel, sabırsız ve mükemmeliyetçi olursunuz.","levels":{"h":"Minnettar, neşeli, odaklı, derinden tatmin olmuş.","a":"Meşgul, dikkati dağınık, hep bir sonraki şeyi planlayan.","u":"Dürtüsel, aşırı, ne pahasına olursa olsun acıdan kaçan."},"actions":["Rahatsız edici bir duyguyla beş dakika, düzeltmeye ya da kaçmaya çalışmadan kalın.","Yenisine başlamadan önce yarım kalmış bir projeyi bitirin.","Her akşam bugün için minnettar olduğunuz üç şeyi yazın."]},"8":{"name":"Meydan Okuyan","tag":"Kendinden emin, kararlı, koruyucu","summary":"Sizi kendinizi koruma ve hayatınızın kontrolünü elde tutma isteği yönlendirir. Güçlü, doğrudan ve harekete hazırsınız. Altta ise nadiren gösterdiğiniz yumuşak bir yan vardır.","desire":"Kendini korumak ve kendi yolunu belirlemek","fear":"Zarar görmek, kontrol edilmek ya da ihanete uğramak","passion":"İhtiras (yoğunluk)","fixation":"İntikam","virtue":"Masumiyet","idea":"Kutsal Hakikat","childMsg":"“Kırılgan olmak ya da kimseye güvenmek doğru değil.”","lostMsg":"“Sana ihanet edilmeyecek.”","figure":"besleyici figür","rel":"reddedilme","famNote":"Şefkat ve güven besleyici figürden gelmemiş; çocuk kırılganlığın tehlikeli olduğuna karar verip koruyucu rolü kendisi üstlenmiştir.","wake":"İşlerin halolması için zorlaması ve mücadele etmesi gerektiği hissi.","flag":"“İnsanlar bana karşı dönüyor; misilleme yapacaklar.”","grace":"“Bunu yapacak gücüm var.”","growth":"Sağlıklı 2’ye doğru: gücünüzü başkalarına bakmak için kullanır, kalbinizin yol göstermesine izin verirsiniz.","stress":"Ortalama 5’e doğru: geri çekilir, ketumlaşır ve harekete geçmek yerine plan yaparsınız.","levels":{"h":"Yüce gönüllü, koruyucu, güçlü ve yumuşak kalpli.","a":"Baskın, zorlayan, kontrole ihtiyaç duyan.","u":"Acımasız, yıldıran, kimseye güvenmeyen."},"actions":["Bu hafta bir kez yardım isteyin ve kontrolü ele almadan kabul edin.","Zorlama dürtüsü geldiğinde üç nefes durun ve neyi koruduğunuzu sorun.","Birine daha yumuşak yanınızı gösterin: sizin için ne ifade ettiğini söyleyin."]},"9":{"name":"Barışçı","tag":"Alıcı, güven veren, rehavete eğilimli","summary":"Sizi iç ve dış huzur isteği yönlendirir. Her tarafı görür, başkalarını sakinleştirir ve her şeyi bir arada tutarsınız. Risk, kendinizi ve kendi sesinizi unutmaktır.","desire":"İç denge ve gönül huzuru","fear":"Kayıp, ayrılık ve çatışma","passion":"Miskinlik (kendini unutma)","fixation":"Tembellik","virtue":"Eylem (doğru eylem)","idea":"Kutsal Sevgi","childMsg":"“Kendini ortaya koymak doğru değil.”","lostMsg":"“Senin varlığın önemli.”","figure":"her iki ebeveyn figürü","rel":"bağlanma","famNote":"Çocuk iki ebeveyne de bağlanmış ve huzuru korumak için kendini görünmez kılmıştır.","wake":"Huzuru korumak için diğerleriyle uzlaşma ihtiyacı.","flag":"“Sorunlarımı çözmem için beni gerçekle yüzleşmeye zorlayacaklar.”","grace":"“Uyum sağlayabilirim.”","growth":"Sağlıklı 3’e doğru: enerjinizi kendinize yatırır, hedef koyar ve harekete geçersiniz.","stress":"Ortalama 6’ya doğru: kaygılı, endişeli ve tepkisel olursunuz.","levels":{"h":"Anda, ayakları yere basan; sesini de çıkaran gerçek bir barışçı.","a":"Uyum sağlayan, kaçınan, rutinlerle uyuşan.","u":"Kopmuş, inatla kapanmış, kendini kaybetmiş."},"actions":["Her sabah bugün kendiniz için istediğiniz bir şeyi adlandırın.","Bu hafta bir kez nazik ve net bir şekilde “katılmıyorum” deyin.","Rahat olanlardan önce en önemli işi yapın."]}},"WINGS":{"1w9":"Sakin, idealist ve ölçülü; ilkelerini sessizce taşır.","1w2":"İlkelerini insanlara yardım etmek için kullanan sıcak, ikna edici bir savunucu.","2w1":"Hizmet odaklı ve görev bilinçli; sessizce ve titizlikle yardım eder.","2w3":"Dışa dönük ve çekici; cömert, görünür bir ev sahibi.","3w2":"Sıcak ve çekici; başarıya ilişkiler üzerinden ulaşır.","3w4":"Profesyonel, odaklı ve daha içe dönük; başarıya mükemmel işle ulaşır.","4w3":"Dışavurumcu, hırslı ve imajının farkında.","4w5":"İçe dönük, sıra dışı ve kendine çekilen.","5w4":"Hayal gücü kuvvetli, bağımsız, sanatçı ruhlu bir düşünür.","5w6":"Analitik ve pratik; sistemlere değer veren bir problem çözücü.","6w5":"Temkinli, çalışkan ve bağımsız.","6w7":"Arkadaş canlısı ve oyuncu; güvenceyi insanların arasında bulur.","7w6":"Sosyal, sadık ve eğlenceyi seven.","7w8":"Cesur, pratik ve iddialı.","8w7":"Bağımsız bir asi ruh: hızlı, geniş, maceracı.","8w9":"Sakin güç: dingin, koruyucu, geç öfkelenen.","9w8":"Ayakları yere basan ve rahat, ama gerektiğinde kararlı.","9w1":"Nazik, düzenli ve idealist."},"INST_NAME":{"sp":"Kendini koruma","so":"Sosyal","sx":"Yakın ilişki"},"ITEMS":{"1":["Bir şeyin doğru yapılmadığını hemen fark ederim.","Kendime yüksek standartlar koyarım ve onlara ulaşamadığımda huzursuz olurum.","Bir şeyi yapmanın genellikle doğru bir yolu vardır ve ben onu bulmak isterim.","Yaptıklarım hakkında yorum yapan güçlü bir iç eleştirmenim var.","Sorumluluklarım bitmeden rahatlamakta zorlanırım.","İnsanlar işi baştan savma yaptığında ya da kuralları çiğnediğinde sinirlenirim.","Öfkemi kontrol altında tutarım ama gerginlik ya da içerleme olarak dışarı sızar.","Adil ve ahlaklı olmak benim için sevilmekten daha önemlidir.","Zamanımla daha faydalı bir şey yapmam gerektiğini sık sık hissederim.","Hata yapmak beni, başkalarını rahatsız ettiğinden daha fazla rahatsız eder."],"2":["Başkalarının neye ihtiyacı olduğunu çoğu zaman onlar söylemeden hızla sezerim.","İhtiyaç duyulduğumda ve takdir edildiğimde kendimi iyi hissederim.","Yardım etmek benim için yardım istemekten daha kolaydır.","İnsanların kendilerini değerli hissetmesi için çok enerji harcarım.","Başkaları için gösterdiğim çaba fark edilmediğinde kırılırım.","Biri bana ihtiyaç duyduğunda hayır demekte zorlanırım.","Kendim için neye ihtiyacım olduğundan her zaman emin değilimdir.","Sıcaklık, yakınlık ve sevgi yaşam biçimimin merkezindedir.","Bazen gerçekten istediğimden fazlasını verir, sonra içerlerim.","İnsanların başvurduğu kişi olmayı severim."],"3":["Başarılı olmak ve yetkin görünmek için güçlü bir dürtüm var.","İyi bir izlenim bırakmak için kendimi sunuş biçimimi doğal olarak ayarlarım.","Hedefler koyarım ve onlara ulaşana kadar içim rahat etmez.","Üretken ve verimli olmak, kendime verdiğim değerin büyük bir parçasıdır.","Yapılacak bir iş olduğunda duygularımı bir kenara koyarım.","Başkalarının neye hayran olduğunu fark eder ve o olabilirim.","Başarısızlığı kabul etmek benim için çok zordur.","Başarılarımın tanınması beni güçlü biçimde motive eder.","Hiçbir şey başarmadığımda kim olduğumu merak ettiğim olur.","Yaptığım işte en iyi ya da en iyilerden biri olmak isterim."],"4":["Sık sık diğer insanlardan farklı olduğumu, sanki bir yanımın anlaşılmadığını hissederim.","Duygularım yoğundur ve onlarla çok zaman geçiririm.","Hayatımda eksik gibi görünen bir şeyin özlemini çekerim.","Sahicilik ve kendini ifade etmek benim için son derece önemlidir.","Kendimi başkalarıyla kıyaslar, onlarda olanın bende eksik olduğunu hissederim.","Güzelliğe, sanata, anlama ve derinliğe çekilirim.","Sıradan, rutin hayat bana yavan ve tatminsiz gelebilir.","Ruh halim değişir ve o gün neler yapabileceğimi belirler.","Reddedilmeye karşı hassasım; anlaşılmadığımı hissettiğimde geri çekilirim.","Melankoli bana tanıdık, hatta bazen rahatlatıcı gelir."],"5":["Enerji toplamak ve düşünmek için bolca yalnız zamana ihtiyacım var.","Harekete geçmeden önce bir şeyin nasıl işlediğini anlamak isterim.","Zamanımı, enerjimi ve mahremiyetimi özenle korurum.","Çok fazla talep ya da sosyal beklenti beni çabuk tüketir.","Katılmaktan çok gözlemlemek bana daha rahat gelir.","Bilgi ve yetkinlik bana güven duygusu verir.","Duygularımı kendime saklar, sonra kendi başıma işlerim.","Bağımsızlığımı koruduğum sürece çok azla yaşayabilirim.","Söz almadan önce iyi bilgilenmiş olmayı tercih ederim.","Bir konuya saatlerce dalıp her şeyi unutabilirim."],"6":["Neyin ters gidebileceğini ve buna nasıl hazırlanacağımı sık sık düşünürüm.","Sadakat ve güven benim için çok önemlidir.","Bir şeyleri sorgular, gizli niyetler ararım.","Net kurallar, güvenilir bir grup ya da güvendiğim biri olduğunda kendimi daha güvende hissederim.","Bazen kendi yargımdan şüphe eder, başkalarının fikrini alırım.","Aynı kişiye ya da otoriteye güvenmekle şüphe etmek arasında gidip gelebilirim.","Birinin bunu hak ettiğine karar verdiğimde derinden bağlı ve sorumlu olurum.","Kaygı günlük hayatımda sık sık yanımdadır.","Korktuğumda, başa çıkabildiğimi kanıtlamak için bazen korkunun üstüne giderim.","Başkalarının gözden kaçırdığı risklere karşı uyanığımdır."],"7":["Yeni deneyimleri, fikirleri ve olasılıkları severim.","Seçeneklerimi açık tutarım ve bağlanmaktan hoşlanmam.","İşler acı verici ya da sıkıcı olduğunda dikkatimi daha olumlu bir şeye kaydırırım.","Aynı anda yürüttüğüm pek çok plan ve projem vardır.","Zihnim bir fikirden diğerine hızla atlar.","İyimserim ve neredeyse her şeyin iyi tarafını bulabilirim.","Sınırlar ve kısıtlamalar beni bunaltır.","Çabuk heveslenirim ama yenilik geçince ilgim söner.","Şu anki eğlenceli şeyin tadını çıkarırken bir sonrakini planlarım.","Hüzün ya da ağır duygular üzerinde durmamayı tercih ederim."],"8":["Doğrudanım ve düşündüğümü, sürtüşme yaratsa bile söylerim.","Bir durum liderlik gerektirdiğinde doğal olarak kontrolü alırım.","Kontrol edilmekten ya da birinin insafına kalmaktan nefret ederim.","Değer verdiğim insanları canla başla korurum.","Kırılganlığımı ya da zayıflığımı nadiren gösteririm.","Duruşunu koruyan ve karşı çıkabilen insanlara saygı duyarım.","Çok enerjim var; beklemek yerine harekete geçmeyi tercih ederim.","Adaletsizlik beni öfkelendirir ve onunla yüzleşmek isterim.","Başkalarına bağımlı olmak yerine kendime güvenmeyi tercih ederim.","Yoğunluğum bazı insanlara fazla gelebilir."],"9":["Çevremde huzuru ve uyumu korumak çok önemlidir.","Herkesin bakış açısını görebilirim, bazen kendiminkinden daha kolay.","Çatışmadan kaçınmak için başkalarına uyma eğilimindeyim.","Önemli işleri erteler, onların yerine daha kolay ve rahat şeyler yaparım.","Gerçekte ne istediğimi bilmek benim için zor olabilir.","Başkaları üzüldüğünde sakin ve dengeli kalırım.","Baskı altında açıkça tartışmak yerine sessizce direnirim.","Rutinleri ve tanıdık konforları severim.","Bazen varlığımın ya da fikrimin pek önemli olmadığını hissederim.","Yakınımdaki insanların planlarını ve ruh hallerini kolayca üstlenirim."]},"MOT":{"1":["İçimin derinliklerinde iyi, doğru ve dürüst olmak isterim.","En derin endişem yanlış, bozuk ya da kötü olmaktır.","Dikkatim önce düzeltilmesi ya da iyileştirilmesi gerekene gider."],"2":["İçimin derinliklerinde sevilmek ve istenmek isterim.","En derin endişem istenmemek ya da sevgiye layık olmamaktır.","Dikkatim önce başkalarının ihtiyaçlarına ve duygularına gider."],"3":["İçimin derinliklerinde değerli olmak ve takdir edilmek isterim.","En derin endişem değersiz ya da başarısız olmaktır.","Dikkatim önce hedeflere, sonuçlara ve nasıl göründüğüme gider."],"4":["İçimin derinliklerinde gerçek benliğimi bulmak ve ifade etmek isterim.","En derin endişem gerçek bir kimliğimin ya da anlamımın olmamasıdır.","Dikkatim önce eksik olana ve iç duygularıma gider."],"5":["İçimin derinliklerinde yetkin olmak ve anlamak isterim.","En derin endişem işe yaramaz, çaresiz ya da bunalmış olmaktır.","Dikkatim önce bir şeyleri anlamaya ve kaynaklarımı korumaya gider."],"6":["İçimin derinliklerinde güvenebileceğim bir güvenlik ve destek isterim.","En derin endişem desteksiz ya da rehbersiz kalmaktır.","Dikkatim önce risklere, şüphelere ve kime güvenilebileceğine gider."],"7":["İçimin derinliklerinde mutlu, özgür ve tatmin olmak isterim.","En derin endişem acı ya da yoksunluk içinde sıkışıp kalmaktır.","Dikkatim önce heyecan verici seçeneklere ve sırada ne olduğuna gider."],"8":["İçimin derinliklerinde kendimi korumak ve kendi hayatıma hâkim olmak isterim.","En derin endişem zarar görmek, kontrol edilmek ya da ihanete uğramaktır.","Dikkatim önce güce gider: kim güçlü, kontrol kimde."],"9":["İçimin derinliklerinde iç ve dış huzur isterim.","En derin endişem çatışma, kayıp ve ayrılıktır.","Dikkatim önce her şeyi sakin tutmaya ve herkesi bir arada tutmaya gider."]},"INST":{"sp":["Sağlığıma, enerjime, beslenmeme ve uykuma çok dikkat ederim.","Maddi ve finansal güvenlik benim için en önemli önceliklerden biridir.","Her şeyden önce evimi rahat ve güvenli hale getiririm.","Pratik ihtiyaçlara çok önceden hazırlanırım.","Stresli olduğumda önce temel ihtiyaçlarımın karşılanıp karşılanmadığına bakarım.","Sürekli sosyal etkinlik yerine birkaç istikrarlı rutini tercih ederim."],"so":["Bir grupta nerede durduğumun çok farkındayımdır.","Bir topluluğa ya da davaya rolüm ve katkım benim için önemlidir.","İnsanlar arasındaki ilişkileri ve dinamikleri doğal olarak takip ederim.","Gruplara ve ağlara ait olmak benim için önemlidir.","Davranışlarımın yakın çevrem dışındaki insanları nasıl etkilediğini düşünürüm.","Bir ortamın sosyal kurallarını bilmediğimde huzursuz olurum."],"sx":["İnsanlarla aramdaki kimyayı ya da kimyasızlığı çok hızlı hissederim.","Derin, yoğun, bire bir bağlar ararım.","Beni büyüleyen şeye ya da kişiye, riskli olsa bile çekilirim.","Kıvılcımı olmayan ilişkiler beni tatmin etmez.","Odaklandığım kişiye ya da tutkuya büyük enerji akıtırım.","Sevdiğim şeyle tamamen bütünleşmek isterim."]},"HORN":{"A":"Bağımsız ve iddialıyım. İstediğimin peşinden gider, inisiyatif alır ve işlerin olmasını sağlamayı beklerim.","B":"Sessiz ve ölçülüyüm. Kendi başıma rahatım, ilgi odağından geri çekilir ve çoğunlukla iç dünyamda yaşarım.","C":"Sorumlu ve görev bilinçliyim. Beklenen ve doğru olanı yapmaya çalışır, çoğu zaman yükümlülükleri kendi isteklerimin önüne koyarım."},"HARM":{"X":"Sorunlar çıktığında iyi tarafından bakar, olumlu kalır ve çevremdeki havayı iyi tutmaya çalışırım.","Y":"Sorunlar çıktığında güçlü tepki veririm. Başkalarının nasıl hissettiğimi görmesine ihtiyaç duyar, dürüst ve duygusal karşılık isterim.","Z":"Sorunlar çıktığında duygularımı bir kenara koyar, mantıklı kalır ve sorunu yetkin biçimde çözmeye odaklanırım."},"LEVEL":{"1":{"h":["Kusurları, kendiminkileri ve başkalarınınkileri, sakinlikle kabul ettim.","Dengeli hissettim ve bazı şeyleri oldukları gibi bırakabildim."],"a":["Her şeyi doğru ve kontrol altında tutmaya çalışırken gergin hissettim.","İşleri farklı yapan insanlara karşı eleştirel ya da sabırsızdım."],"u":["Kapatamadığım bir içerleme ve sert yargılama hissettim.","İç eleştirmenim acımasızdı; içimde katı ve öfkeli hissettim."]},"2":{"h":["Karşılığında bir şey beklemeden özgürce verdim.","Kendi ihtiyaçlarıma da iyi baktım."],"a":["İnsanları memnun etmek ya da vazgeçilmez olmak için çok uğraştım.","Başkaları için yaptıklarım yüzünden takdir edilmediğimi hissettim."],"u":["Başkalarının bana borçlu olduğunu hissettim ve ilgi görmek için suçluluk ya da baskı kullandım.","Kullanılmış ve tükenmiş hissettim ama fazla vermeyi bırakamadım."]},"3":{"h":["Kimseyi etkilemeye ihtiyaç duymadan gerçekten kendim gibi hissettim.","İşimden kendisi için keyif aldım ve övgüyü cömertçe paylaştım."],"a":["Başkalarına nasıl göründüğüm ya da statüm hakkında çok endişelendim.","Performans için kendimi zorladım ve bir şey başarmadığımda huzursuz oldum."],"u":["İmajımın arkasında boşluk hissettim ve bununla yüzleşmekten kaçındım.","Görüntüyü korumak için gerçeği eğip büktüm ya da kestirmeden gittim."]},"4":{"h":["Duygularım yaratıcı ya da anlamlı bir eyleme dönüştü.","Kim olduğumla barışık ve sıradan hayata bağlı hissettim."],"a":["Ruh hallerinde, hayallerde ya da özlem içinde çok zaman geçirdim.","Kendimi farklı, anlaşılmamış ya da başkalarını kıskanır hissettim."],"u":["Değersiz hissettim ve insanlardan tamamen uzaklaştım.","Ağır umutsuzluk ya da kendinden nefret duyguları günlerime hâkim oldu."]},"5":{"h":["Dünyayla merak ve özgüvenle ilişki kurdum.","Bildiklerimi paylaştım ve kendimi işin içinde hissettim."],"a":["Kendi alanıma çekildim ve insanları uzakta tuttum.","Harekete geçmekten çok düşünmeye ve planlamaya zaman ayırdım."],"u":["Kendimi dışarıya kapattım; dünya bana müdahaleci ya da düşmanca geldi.","Kafamın içine dalmışken uykuyu, yemeği ya da insanlarla teması ihmal ettim."]},"6":{"h":["Kendime güvendim ve cesaretle davrandım.","Dengeli hissettim ve insanlarla rahatlayabildim."],"a":["Endişelendim ve kafamda “ya şöyle olursa” senaryoları kurdum.","Güvence aramakla otoriteye direnmek arasında gidip geldim."],"u":["Kaygılı ve kuşkucu hissettim, sanki insanlar bana karşıydı.","Korku beni saldırgan yaptı ya da dondurdu ve sakinleşemedim."]},"7":{"h":["Sahip olduklarım için derinden tatmin ve minnettar hissettim.","Tek bir şeyle ve zor duygularla kalabildim."],"a":["Kendimi meşgul tuttum, etkinlikler ve planlar arasında atladım.","Rahatsız edici duygulardan bir sonraki şeyi planlayarak kaçtım."],"u":["Dürtüsel ve dağınık hissettim; işler kontrolden çıktı.","Acıdan aşırılık yoluyla kaçmaya çalıştım (harcama, eğlence, madde)."]},"8":{"h":["Gücümü başkalarını korumak ve desteklemek için, yumuşak bir kalple kullandım.","Kırılganlığımı gösterebildim ve başkalarının bana yardım etmesine izin verdim."],"a":["İşleri halletmek için insanları zorladım ve baskı yaptım.","Kimse benden faydalanmasın diye kontrolü elde tutmam gerektiğini hissettim."],"u":["Başkalarının bana karşı olduğunu hissettim ve misilleme yapmak istedim.","Gözdağı ya da tehdit kullandım, kimseye güvenemeyeceğimi hissettim."]},"9":{"h":["Anda ve işin içinde hissettim, istediğim şey için sesimi çıkardım.","Benim için gerçekten önemli olan konularda harekete geçtim."],"a":["Başkalarına uydum ve çatışmadan kaçındım.","Önemli işleri erteledim; rutinlerle ya da oyalanmalarla uyuştum."],"u":["Kopuk hissettim, sanki hayat yanımdan geçip gidiyordu.","İnatla kapandım ve sorunlarla uğraşmayı reddettim."]}},"LEVEL_GEN":{"h":["Genel olarak sakin ve anda hissettim."],"a":["Otomatik pilotta gibi, otomatik tepkiler verdim."],"u":["Bunalmış ya da kırılma noktasına yakın hissettim."]},"DIR":{"1":{"g":["Hayattan kendiliğinden keyif almaya ve eğlenmeye izin verdim.","Daha hafif ve “meli-malı”lardan daha az yüklü hissettim."],"s":["Karamsar, anlaşılmamış hissettim ve kendime acıdım.","Sorumluluklarımdan kaçmak istedim."]},"2":{"g":["Kendi duygularıma ve ihtiyaçlarıma dürüstçe temas ettim.","Kendi yaratıcı ya da kişisel ilgi alanlarıma zaman ayırdım."],"s":["İnsanlar karşılık vermediğinde talepkâr ya da saldırgan oldum.","Hak ettiğimi düşündüğüm şeyi almak için başkalarını kontrol etmeye çalıştım."]},"3":{"g":["Kendi başarımın ötesinde bir ekibe ya da davaya bağlandım.","İnsanların gerçek duygularımı ve şüphelerimi görmesine izin verdim."],"s":["Uyuşmuş, motivasyonsuz ve ilgisiz hissettim.","Sürüklendim, erteledim ve her zamanki hırsımı kaybettim."]},"4":{"g":["İlkelerime göre disiplinli ve nesnel biçimde davrandım.","Havamda olmasam da pratik işleri sonuna kadar götürdüm."],"s":["İnsanlara tutundum ve ihtiyaç duyulmaya ihtiyaç duydum.","Yakın hissetmek için başkalarının hayatına fazlasıyla karıştım."]},"5":{"g":["Kararlı davrandım ve kendi kapasiteme güvendim.","Bedenimde köklenmiş ve dünyada özgüvenli hissettim."],"s":["Dikkatimi pek çok oyalanmaya dağıttım.","Huzursuz ve hiperaktif hissettim, şeyler arasında atladım."]},"6":{"g":["Rahat, güvenen ve huzurlu hissettim.","Fazla düşünmeden şeyleri oldukları gibi kabul ettim."],"s":["İnsanları etkilemeye ya da değerimi performansla kanıtlamaya çalıştım.","Rekabetçi oldum ve imajıma odaklandım."]},"7":{"g":["Tek bir konuya sessiz bir odakla derinlemesine daldım.","Sükûnetten ve düşünmek için yalnız kalmaktan keyif aldım."],"s":["Eleştirel, sabırsız ve mükemmeliyetçi oldum.","Başkalarına işlerin doğru nasıl yapılacağı hakkında nutuk çektim."]},"8":{"g":["Şefkat gösterdim ve başkalarını açıkça önemsedim.","Kontrol ihtiyacım yerine kalbimin yol göstermesine izin verdim."],"s":["Geri çekildim, ketumlaştım ve kartlarımı sakladım.","Harekete geçmek yerine düşünmeye ve planlamaya çekildim."]},"9":{"g":["Hedefler koydum ve enerjimi kendime yatırdım.","İnisiyatif aldım; enerjik ve üretken hissettim."],"s":["Kaygılı, endişeli ve kuşkucu hissettim.","Güvence aradım ve kararlar konusunda kararsız kaldım."]}},"FIG_OPTS":["Annem","Babam","Her iki ebeveynim","Başka biri (büyükanne/büyükbaba, kardeş, bakıcı)","Aslında kimse"],"REL_OPTS":[["Bağlanma","Yakın hissettim ve onun istediği gibi olmaya çalıştım."],["Hayal kırıklığı","Oradaydı ama ihtiyacım olanı yeterince alamadım."],["Reddedilme","Olduğum gibi istenmediğimi hissettim; mesafemi korudum ya da sevgisini kazanmaya çalıştım."]],"CONF_LABEL":{"High":"Net önde","Moderate":"Muhtemel","Low":"Başa baş"},"DEEP":{"1":{"world":"Hayatı iyileştirilmesi gereken bir şey olarak deneyimlersiniz. Dikkatiniz otomatik olarak işlerin olduğu hal ile olması gereken hal arasındaki boşluğa gider ve bu boşluğu kapatmayı kişisel sorumluluk bilirsiniz. Altta, iyi ve eleştirilemez olma isteği yatar.","gifts":"Dürüstlük, ayırt etme gücü ve güvenilirlik. Sözünüzü tutar, başkalarının kaçırdığını fark eder ve işleri düzeltmek için çok çalışırsınız. En iyi halinizde bilge ve adilsiniz; insanların güvendiği bir ahlaki pusula.","blind":"İç eleştirmeniniz nadiren susar. “Hoş olmayan” saydığınız öfke içte tutulur ve içerleme, katılık ya da düzeltici bir ton olarak dışa sızar. Kendi standartlarınızı nesnel doğru sanabilirsiniz.","rel":"İlişkilerde sadık ve güvenilirsiniz ama yakınlarınız yargılandığını hissedebilir. İşte kaliteyi ve adaleti yükseltirsiniz; risk, “doğru yapılmaz” diye her şeye karışmaktır."},"2":{"world":"Hayatı ilişkiler üzerinden deneyimlersiniz. Başkalarının ne hissettiğini ve neye ihtiyaç duyduğunu neredeyse anında sezer ve onlara yönelirsiniz. Altta, sevilme isteği ve sevginin yardımcı olarak kazanılması gerektiği inancı yatar.","gifts":"Sıcaklık, cömertlik ve duygusal zekâ. İnsanlara görüldüklerini ve önemsendiklerini hissettirir, aralarında köprüler kurarsınız. En iyi halinizde hesap tutmadan, özgürce seversiniz.","blind":"Kendi ihtiyaçlarınız gözden kaybolur, sonra ilginize karşılık gelmediğinde kırgınlık ya da içerleme olarak geri döner. Kibir “hiçbir şeye ihtiyacım yok” olarak görünür. Yardım etmek sessiz bir kontrole dönüşebilir.","rel":"İlişkilerde kendini adamış ve ilgilisiniz ama almak için verebilirsiniz. İşte ekibin kalbisiniz; risk, her şeye evet deyip tükenmektir."},"3":{"world":"Hayatı bir dizi hedef olarak deneyimlersiniz. Çevrenizde neyin değer gördüğünü okur ve onda hızla iyileşirsiniz. Altta, değerli olma isteği ve başarı olmadan hiçbir değeriniz olmayacağı korkusu yatar.","gifts":"Enerji, uyum yeteneği ve işi bitirme becerisi. Başkalarını motive eder, fikirleri parlak biçimde sunar, planları sonuca dönüştürürsünüz. En iyi halinizde sahicisiniz ve başarınız başkalarına büyümeleri için ilham verir.","blind":"Oynadığınız rolün arkasında kendi duygularınızla teması kaybedebilirsiniz. Verimlilik derinliği dışarı iter ve imaj kişiden daha gerçek hissettirmeye başlayabilir.","rel":"İlişkilerde ilgili ve eğlencelisiniz ama yakınlık yerine meşgul kalabilirsiniz. İşte doğal bir performansçı ve lidersiniz; risk, aşırı çalışmak ve değerinizi yalnızca sonuçlarla ölçmektir."},"4":{"world":"Hayatı duygu ve anlam üzerinden deneyimlersiniz. Eksik olana, güzel olana ve gerçek olana ayarlısınız. Altta, gerçek benliğinizi bulma isteği ve içinizde özsel bir şeyin eksik olduğu hissi yatar.","gifts":"Derinlik, yaratıcılık ve duygusal dürüstlük. Acıyla, gözünüzü kaçırmadan kalabilir ve başkalarının anlaşıldığını hissetmesine yardım edersiniz. En iyi halinizde deneyimi sanata ve şefkate dönüştürürsünüz.","blind":"Kıskançlık ve kıyaslama başkalarının hayatını daha dolu gösterir. Ruh hallerine tutunabilir, anlaşılmadığınızda geri çekilip uzanmak yerine bulunmayı bekleyebilirsiniz.","rel":"İlişkilerde derin bir bağ özlersiniz; idealize etmekle uzaklaşmak arasında gidip gelebilirsiniz. İşte özgünlük ve anlam getirirsiniz; risk, harekete geçmek için doğru ruh halini beklemektir."},"5":{"world":"Hayatı gözlemci koltuğundan deneyimlersiniz. Dahil olmadan önce anlamaya ihtiyaç duyar, zamanınızı ve enerjinizi müdahaleye karşı korursunuz. Altta, yetkin olma isteği ve bunalmış ya da işe yaramaz olma korkusu yatar.","gifts":"İçgörü, nesnellik ve bağımsız düşünme. Başkalarının kaçırdığı örüntüleri görür, krizde sakin kalırsınız. En iyi halinizde bilgisini cömertçe paylaşan bir vizyonersiniz.","blind":"Bedeninize, duygularınıza ve insanlara mesafeli, kafanızın içinde yaşayabilirsiniz. Zamanı, enerjiyi ve duyguyu geri tutmak sizi tam olarak girmediğiniz bir hayata hazırlanır halde bırakabilir.","rel":"İlişkilerde sadıksınız ve sınırlara saygı duyarsınız ama mesafeli görünebilirsiniz. İşte uzman ve stratejistsiniz; risk, harekete geçmek yerine geri çekilmek ve aşırı hazırlanmaktır."},"6":{"world":"Hayatı hazırlanılması gereken bir şey olarak deneyimlersiniz. Riskleri tarar, kime ve neye güvenilebileceğini sınar, sağlam zemin ararsınız. Altta, güvenlik ve destek isteği ve bunlardan yoksun kalma korkusu yatar.","gifts":"Sadakat, sorumluluk ve öngörü. Bağlı bir dost ve ekip üyesisiniz; sorunları olmadan önce görürsünüz. En iyi halinizde cesur ve dengelisiniz; başkaları için bir güven kaynağı.","blind":"Şüphe ve endişe düşüncenizi yönetebilir. Güvence aramakla otoriteye isyan etmek arasında gidip gelebilirsiniz. Bazı Altılar korkunun üstüne gider; bu kaygıdan çok cesaret gibi görünebilir.","rel":"İlişkilerde derinden bağlı ve koruyucusunuz ama güveni tekrar tekrar sınayabilirsiniz. İşte güvenilir ve harika bir sorun çözücüsünüz; risk, fazla düşünmek ve en kötüsünü beklemektir."},"7":{"world":"Hayatı olasılıklarla dolu olarak deneyimlersiniz. Zihniniz hızlı çalışır, fikirleri birleştirir ve bir sonraki güzel deneyimi planlar. Altta, tatmin olma isteği ve acı ya da yoksunlukta sıkışıp kalma korkusu yatar.","gifts":"İyimserlik, merak ve çok yönlülük. Enerji, mizah ve yeni fikirler getirir, insanların moralini yükseltirsiniz. En iyi halinizde ayaklarınız yere basar ve minnettarsınız; neşeniz huzursuz değil, derindir.","blind":"Rahatsızlıktan meşgul kalarak, her şeyi olumluya çevirerek ya da bir sonraki plana atlayarak kaçabilirsiniz. Bağlılık ve derinlik zarar görür, zor duygular işlenmeden kalır.","rel":"İlişkilerde eğlenceli ve cömertsiniz ama ağır konuşmalardan kaçınabilirsiniz. İşte vizyoner ve bağlantı kurucusunuz; risk, çok şeye başlayıp az şey bitirmektir."},"8":{"world":"Hayatı bir güç sınavı olarak deneyimlersiniz. Gücün kimde olduğunu okur, alanınızı korur ve doğrudan hareket edersiniz. Altta, kendinizi koruma ve kontrolü elde tutma isteği ve zarar görme ya da kontrol edilme korkusu yatar.","gifts":"Cesaret, kararlılık ve koruyuculuk. Zayıfın yanında durur, krizde kontrolü alır ve başkalarının söyleyemediğini söylersiniz. En iyi halinizde büyük yüreklisiniz ve gücünüzü başkalarını güçlendirmek için kullanırsınız.","blind":"Kırılganlığı sertliğin arkasına saklayabilir, fazla zorlayabilir ve yumuşaklığı zayıflık sayabilirsiniz. Yoğunluğunuz insanları bunaltabilir; kontrolü güvenlikle karıştırabilirsiniz.","rel":"İlişkilerde sadık ve koruyucusunuz ama baskın olabilir, şefkati göstermekte zorlanabilirsiniz. İşte işleri harekete geçiren doğal bir lidersiniz; risk, ezip geçmek ve kimseye güvenmemektir."},"9":{"world":"Hayatı uyum isteği üzerinden deneyimlersiniz. Her tarafı görür, çevrenizdeki insanlara ve rutinlere karışır, çatışmayı yumuşatırsınız. Altta, huzur isteği ve kayıp ile ayrılık korkusu yatar.","gifts":"Kabul, sabır ve sakinleştirici bir varlık. Arabuluculuk yapar, herkesi dahil eder ve insanları rahatlatırsınız. En iyi halinizde tamamen anda olur ve önemli olan için güçlü biçimde harekete geçersiniz.","blind":"Kendinizi unutabilirsiniz: önceliklerinizi, fikirlerinizi, öfkenizi. Erteleme ve rahat rutinler her şeyi sakin tutar; direnç sessiz bir inatla dışa vurur.","rel":"İlişkilerde rahat ve destekleyicisiniz ama ortaya çıkmak yerine akışa uyabilirsiniz. İşte harika bir ekip kurucususunuz; risk, sorunlar büyüyene kadar kararlardan kaçınmaktır."}},"WING_LONG":{"1w9":"Dokuz kanadı yoğunluğunuzu yumuşatır ve mesafe katar. İlkelerinizi sessizce taşır, yüzleşme yerine aklı tercih eder, serin ya da felsefi görünebilirsiniz. Öfke daha da içte tutulur. İnsanlardan çok idealler için mücadele eder, hüsrana uğradığınızda düzene ve yalnızlığa çekilebilirsiniz.","1w2":"İki kanadı sıcaklık ve insan enerjisi katar. İlkelerinizi insanlara yardım etmek için kullanır, hayatlarını doğrudan iyileştirmek istersiniz. 1w9’dan daha dışavurumcu, ikna edici ve eylem odaklısınız; eleştiriyi dile getirme olasılığınız daha yüksek. Risk, ahlak dersi vermek ve takdir edilmediğini hissetmektir.","2w1":"Bir kanadı vicdan ve ölçülülük katar. Görev duygusuyla ve doğru olanı yapmak için, çoğu zaman sessizce ve perde arkasında yardım edersiniz. 2w3’ten daha ciddi ve özeleştirelsiniz; kendi ihtiyaçlarınızı bencilce hissettirdiği için kabul etmekte zorlanabilirsiniz.","2w3":"Üç kanadı hırs ve sosyal parlaklık katar. Kolay bağ kurar, sevilmekten hoşlanır ve insanlara özel hissettirirsiniz. 2w1’den daha imaj bilinçli ve enerjiksiniz. Risk, onayı çekicilikle aramak ve gözde olmadığınızda kırılmaktır.","3w2":"İki kanadı sıcaklık katar. Başarıya ilişkiler üzerinden ulaşır, insanlara ilham verir ve etkili olduğu kadar sevilmek de istersiniz. Bir ortamı zahmetsizce okursunuz. Risk, memnun etmek için kendinizi şekillendirmek ve hayranlığı sevgiyle karıştırmaktır.","3w4":"Dört kanadı derinlik ve sahicilik isteği katar. Başarınızın bir anlamı olmasını ve gerçekte kim olduğunuzu yansıtmasını istersiniz. 3w2’den daha içe dönük ve ciddisiniz; imajınız ile iç duygularınız örtüşmediğinde kendinizi eleştirebilirsiniz.","4w3":"Üç kanadı dürtü ve sosyal farkındalık katar. Özgünlüğünüzün görülmesini ve takdir edilmesini ister, duyguyu cilalı, kamusal bir işe dönüştürebilirsiniz. Risk, kendinizi başkalarının başarısıyla kıyaslamak ve gurur ile utanç arasında gidip gelmektir.","4w5":"Beş kanadı zekâ ve mahremiyet katar. İç dünyanızı fikirler, sanat ya da maneviyat yoluyla keşfeder ve çok yalnızlığa ihtiyaç duyarsınız. 4w3’ten daha sessiz ve sıra dışısınız; incindiğinizde içinize çekilebilirsiniz.","5w4":"Dört kanadı duygu ve hayal gücü katar. Keskin gözlemi sanatsal, bazen alışılmadık bir iç dünyayla birleştirirsiniz. 5w6’dan daha duygusal ve bireyselsiniz. Risk, başkalarının ulaşamayacağı özel dünyalarda yaşamaktır.","5w6":"Altı kanadı pratiklik ve sadakat katar. Sistemleri ve kanıtları sever, bilgiyi çoğu zaman güvendiğiniz bir ekip içinde gerçek sorunlara uygularsınız. 5w4’ten daha şüpheci ve düzenlisiniz. Risk, kaygı ve harekete geçmeden önce aşırı hazırlanmaktır.","6w5":"Beş kanadı bağımsızlık ve ciddiyet katar. Güvende hissetmek için bilgiye ve analize dayanır, davalara ve ilkelere sadık kalırsınız. 6w7’den daha ölçülü ve kendine yetensiniz; stres altında kuşkucu ya da katı olabilirsiniz.","6w7":"Yedi kanadı sosyallik ve mizah katar. Güvenceyi insanlarda ve etkinlikte bulur, sıcak, ilgi çekici ve destekleyici olursunuz. 6w5’ten daha dışa dönüksünüz. Risk, sürekli güvence aramak ve kaygıdan meşgul kalarak kaçmaktır.","7w6":"Altı kanadı sıcaklık ve bağlılık katar. Oyuncu ve komiksiniz, insanları bir araya getirmeyi seversiniz; altta hafif bir kaygı vardır. 7w8’den daha ilişki odaklısınız. Risk, sadakatinize rağmen enerjinizin dağılmasıdır.","7w8":"Sekiz kanadı güç ve pratiklik katar. İstediğinizin peşinden gider, işleri gerçekleştirir, güçten ve maddi başarıdan keyif alırsınız. 7w6’dan daha hırslı ve doğrudansınız. Risk, sabırsızlık, aşırılık ve bir sonraki şeye giderken insanları ezmektir.","8w7":"Yedi kanadı hız, iştah ve coşku katar. Geniş, maceracı ve girişimcisiniz; büyük hedeflerin peşinden yüksek enerjiyle koşar ve yolculuğun tadını çıkarırsınız. 8w9’dan daha dışa dönük, dürtüsel ve risk alansınız. Risk, aşırılık, sabırsızlık ve başkalarının sınırlarını çiğnemektir.","8w9":"Dokuz kanadı istikrar ve sabır katar. Koruyucu, ayakları yere basan ve geç öfkelenen birisiniz; insanların güvendiği sessiz bir otoriteniz var. 8w7’den daha alıcı ve aile odaklısınız; ama öfkeniz geldiğinde yerinden oynatılamaz olabilir.","9w8":"Sekiz kanadı iddia ve topraklılık katar. Pratik, sosyal ve zorlandığınızda kararlı olabilirsiniz. 9w1’den daha doğrudansınız. Risk, uyum sağlamakla inatçı patlamalar arasında gidip gelmektir.","9w1":"Bir kanadı ilke ve yapı katar. Nazik, vicdanlı ve anlama ile sakin rutinlere çekilen birisiniz. 9w8’den daha ölçülü ve öz denetimlisiniz. Risk, öfkeyi yutmak ve idealize edilmiş bir iç sükûnete çekilmektir."},"SUB_LONG":{"1":{"sp":"Pratik mükemmeliyetçi. Doğru yapma dürtünüz güvenliğe, sağlığa, paraya ve düzene yönelir. Altta sıcaksınız ama ayrıntılar için endişelenip kontrolcü olabilirsiniz.","so":"Haçlı savaşçısı. Standartlarınızı gruba yöneltirsiniz: kurallar, kurumlar ve davalar. Doğal bir öğretmen ve rol modelsiniz; risk, katılık ve üstünlük hissidir.","sx":"Sevdiğini ıslah eden. İdealleriniz en yakın ilişkilerinize odaklanır; sevdiklerinizin en iyi hallerine ulaşmasını istersiniz ve bu konuda hararetli olabilirsiniz."},"2":{"sp":"İlgi de bekleyen besleyici. Pratik yollarla yardım eder, diğer İkilerden daha utangaç ve sevimli olabilirsiniz; karşılığında size de bakılmasını sessizce umarsınız.","so":"Elçi. Gruplara ve etkili insanlara verir, ağın merkezinde olmaktan hoşlanırsınız. Risk, konum ve hayranlık kazanmak için vermektir.","sx":"Kendini adamış âşık. Özel insanlarla yoğun yakınlık arar, onları kazanmak ve tutmak için kendinizi ortaya koyarsınız. Risk, sahiplenicilik ve kendinizi kaybetmektir."},"3":{"sp":"İşkolik. Güvenliği sıkı çalışma ve yetkinlikle ararsınız; diğer Üçlerden daha gösterişsizsiniz: iyi görünmek değil, iyi olmak istersiniz. Risk, hiç durmamaktır.","so":"Statü arayan. Grubunuzda tanınma ve prestij istersiniz ve orada başarının neye benzediğini tam olarak bilirsiniz. Risk, unvanlara özden fazla değer vermektir.","sx":"Karizmatik olan. Enerjinizi çekici olmaya ve özel bir kişiyi ya da ekibi desteklemeye verirsiniz. Risk, arzulanmanın içinde kendinizi kaybetmektir."},"4":{"sp":"Dayanıklı olan. Acıya sessizce katlanır, dramatize etmeden onu güce ve yaratıcılığa dönüştürürsünüz. Risk, kendinizi fazla zorlamaktır.","so":"Dışarıdaki. Kendinizi başkalarıyla kıyaslar ve tam ait olmadığınızı hissedersiniz; bu utanç ve hassasiyet getirir. Derinden empatiksiniz; risk, acı içinde takılıp kalmaktır.","sx":"Yoğun rakip. Kıskançlık dışa döner: görülmek istersiniz ve yakın ilişkilerde tutkulu, talepkâr ve rekabetçi olabilirsiniz."},"5":{"sp":"Kale kuran. Mahremiyetinizi ve sınırlarınızı korur, ihtiyaçlarınızı asgaride tutar ve güvenli bir sığınak edinirsiniz. Risk, yalnızlaşmaktır.","so":"Uzman. Aidiyeti bilgi ve idealler yoluyla bulur, alanınızı paylaşan insanlarla bağ kurarsınız. Risk, deneyim yerine fikirler üzerinden yaşamaktır.","sx":"Sırdaş. Mesafenizin ardında iç dünyanızı tamamen emanet edebileceğiniz tek kişiyi ararsınız. Risk, ya hep ya hiç yakınlıktır."},"6":{"sp":"Sıcak olan. Güvenliği ev, aile ve güvenilir müttefikler yoluyla ararsınız; arkadaş canlısı, dikkatli ve koruyucusunuz. Risk, kaygı ve bağımlılıktır.","so":"Görev bilinçli olan. Güvenliği kurallarda, rollerde ve grubun yönergelerinde bulursunuz; sadık ve sorumlusunuz. Risk, otoriteye fazla dayanmaktır.","sx":"Güçlü olan. Korkuyla cesur, hatta göz korkutucu olarak yüzleşirsiniz (karşı-fobik). Risk, korkmadığınızı kanıtlamak için tehlikeyi kışkırtmaktır."},"7":{"sp":"Gurme. Keyifleri, konforları ve fırsatları ağlar ve akıllı planlama yoluyla güvenceye alırsınız. Risk, çıkarcılık ve aşırılıktır.","so":"Fedakâr. Bir grup ya da ideal için kendi keyfinizin bir kısmından vazgeçersiniz. İdealist ve şefkatlisiniz; risk, gizli içerlemedir.","sx":"Maceraperest. Yeni insanlar, fikirler ve romantizm sizi büyüler; dünyaya pembe gözlüklerle bakarsınız. Risk, huzursuzluktur."},"8":{"sp":"Hayatta kalan. Kendinizin ve sizinkilerin ihtiyaçlarını doğrudan ve lafı uzatmadan güvenceye alırsınız. Risk, hayatı bir toprak kavgası gibi görmektir.","so":"Grup lideri. Ekibinizi ya da topluluğunuzu korur, savunur ve adaletsizlikle savaşırsınız. Risk, koruduğunuz grubu kontrol etmektir.","sx":"Komutan. Tam bir bağ ve sadakat ister, ilişkilere yoğun bir tutku getirirsiniz. Risk, baskınlıktır."},"9":{"sp":"Konfor arayan. Huzuru rutinlerde, yemekte, hobilerde ve küçük keyiflerde bulursunuz. Risk, uyuşmaktır.","so":"Katılımcı. Gruplara karışır, onlar için çok çalışır ve herkesi bir arada tutarsınız. Risk, kendi gündeminizi kaybetmektir.","sx":"Birleşen. Kimliğinizi tek bir kişiyle birlik içinde bulur, onun ilgi alanlarını ve ruh hallerini üstlenirsiniz. Risk, ötekinin içinde kaybolmaktır."}},"LVL":{"1":[["Bilge gerçekçi","erdemlilik"],["Makul kişi","vicdan ve dürüstlük"],["İlkeli öğretmen","sorumluluk"],["İdealist reformcu","idealistlik"],["Düzenli kişi","katılık"],["Kusursuzluk arayan yargıç","kusursuzluk"],["Hoşgörüsüz, insanları sevmeyen","hoşgörüsüzlük"],["Takıntılı riyakâr","takıntı"],["Cezalandırıcı intikamcı","cezalandırma"]],"2":[["Çıkar gözetmeyen fedakâr","koşulsuz sevgi"],["Önem veren, insancıl","empati"],["Bakan, besleyen","yardımcı cömertlik"],["Taşkın arkadaş","insanları memnun etme"],["Tahakküm edici arkadaş","izinsiz karışmak"],["Kendini beğenmiş evliya","kendini feda etme"],["Çıkarı için kurnazca yönlendiren","kurnaz manipülasyon"],["Zorlayıcı, hükmedici","zorlama"],["Psikosomatik kurban","kendini kurban görmek"]],"3":[["Sahici, otantik","içten güdülenme"],["Kendinden emin","adaptasyon"],["Mükemmellik örneği","azim"],["İtibar meraklısı","performans tutkusu"],["Pragmatist imaj meraklısı","imaj merakı"],["Kendini öne süren narsist","rekabet"],["Dürüst olmayan fırsatçı","aldatma"],["Kötü niyetli hilekâr","fırsatçılık"],["Kinci yıkıcı","intikam"]],"4":[["İlham dolu yaratıcı","yaşamı kucaklamak"],["Öz farkındalıklı sezgisel","duyarlılık"],["İç dünyasını ifade eden","yaratıcılık"],["Hayal gücü kuvvetli","düş ve fantezi dünyası"],["Nefs odaklı romantik","değişken mizaç"],["Kendi isteklerine düşkün özel kişi","kendi isteklerine düşkünlük"],["Yabancılaşmış, bunalmış","yabancılaşma"],["Duygusal ıstırap çeken","kendinden nefret"],["Kendine zarar veren","kendini yıkım"]],"5":[["Öncü vizyoner","anlama"],["Kavrayışı güçlü gözlemci","merak"],["Odaklı yenilikçi","yenilik"],["Çalışkan uzman","kavram oluşturma"],["Kavram odaklı kişi","fikirlerle uğraşma"],["Kışkırtıcı alaycı","kışkırtma"],["İzole olmuş nihilist","hiçlik"],["Dehşete düşmüş yabancı","hezeyan"],["İçe kapanık","kendini yok etme"]],"6":[["Cesur kahraman","kendine güven (iman)"],["Hoş tavırlı","hoş ve çekici tavırlar"],["Kendini adamış çalışkan","işbirliği"],["Sorumlu sadık","kendinden kuşku"],["Çelişkili pesimist","savunmacılık"],["Otoriter asi","suçlama"],["Aşırı tepkisel bağımlı","aşağılık duygusu"],["Kuşkucu isterik","aşırı kuşku, paranoya"],["Kendini sabote eden","kendini yenilgiye uğratma"]],"7":[["Mest olmuş hayran","minnet"],["Özgür ruhlu hevesli","heves"],["Genel kültürlü başarılı","üretkenlik"],["Deneyimli hayat insanı","sahip olma hırsı"],["Hiperaktif dışa dönük","dürtüsellik"],["Hedonist","ölçüsüzlük"],["Düşüncesizce hareket eden kaçışçı","dağılma"],["Manik kompulsif","zorlantı"],["Panik içinde","panik"]],"8":[["Yüce ruhlu","şefkat"],["Kendinden emin","güç"],["Yapıcı lider","koruyuculuk"],["Girişimci maceraperest","pragmatizm"],["Egemen yönlendirici","zorlama ve manipülasyon"],["Meydan okuyan hasım","kavgacılık"],["Acımasız asi","acımasızlık"],["Sınırsız güç sanan megaloman","öfke"],["Yıkıcı","yıkıcılık"]],"9":[["İtidalli kılavuz","kişisel özgürlük"],["Anlayış sahibi alıcı","bütüne yönelim"],["Destekleyici barışsever","kabul"],["Çevreye uyumcu rol kesen","kendini geri atma"],["Boşta kalan katılımcı","edilgenlik"],["Teslim olmuş kaderci","kadercilik"],["İnkârcı paspas","ihmal"],["Kopuk otomat","kopma"],["Kendini bırakmış hayalet","kendini bırakma"]]},"L1TXT":{"1":"Bilge, kabul eden ve dingin. Kimseyi mahkûm etmeden doğruyu yanlıştan ayırır, ilkelerinizi sıcaklık ve tevazuyla taşırsınız.","2":"Koşulsuz seven ve alçakgönüllü. Özgürce verir, başkalarının iyiliğine sevinir ve kendinize de bakarsınız.","3":"Sahici ve kendini kabul eden. Artık hayranlığa ihtiyacınız yok; değeriniz zaten oradadır ve başarılarınız daha büyük bir şeye hizmet eder.","4":"İlham dolu ve hayatla barışık. Duygular dürüsttür ama artık sizi tanımlamaz; deneyimi başkalarına dokunan bir şeye dönüştürürsünüz.","5":"Berrak görüşlü bir vizyoner. Dünyayla tamamen ilişki içinde, şeylerin gerçekte nasıl olduğunu görür ve özgürce paylaşırsınız.","6":"Cesur ve kendine güvenen. İç imanınıza dayanarak, dışarıdan garanti gerekmeden sadık ve dengeli kalırsınız.","7":"Derinden minnettar ve neşeli. Tamamen anda, bir sonrakinin peşinden koşmak yerine burada olanın tadını çıkarırsınız.","8":"Yüce gönüllü ve büyük yürekli. Gücünüz başkalarına hizmet eder; nazik ve kırılgan olabilir, kontrolü bırakabilirsiniz.","9":"Tamamen anda ve kendine sahip. Huzurlu ama işin içinde, önemli olan için güçlü biçimde harekete geçer ve kendinizi hatırlarsınız."},"L1WIS":{"1":"kabul","2":"kendini sevmek","3":"kendin olmak","4":"affedicilik","5":"anlayış (idrak)","6":"cesaret (şecaat)","7":"minnettarlık","8":"teslimiyet","9":"kendini hatırlamak"},"L9TXT":{"1":"Kendini haklı gören ve cezalandıran: başkalarının yanlışlarıyla tükenmiş, başkalarına ya da kendine karşı sert cezalar verebilen.","2":"Kendini kurban gibi hisseden, sıkıntısı bedeninde beliren; sevgi başkalarından bir alacağa dönüşmüş.","3":"İmajın arkasındaki boşluğu açığa çıkaran herkese karşı kindar; görüntü her ne pahasına olursa olsun korunur.","4":"Kendinden nefret ve umutsuzlukla boğulmuş, tamamen kendine dönmüş.","5":"Gerçeklikten ve insanlardan kopmuş, içe doğru boşluğa çöken.","6":"Paranoyak ve kendini yenilgiye uğratan; korku kendini sabotaja dönüşmüş.","7":"Kaçış artık işe yaramıyor; panik ve çöküş hâkim.","8":"Yıkıcı öfke: kontrol edilmektense her şeyi yıkmaya hazır.","9":"Kopmuş ve  tarafından ({r2}). Bunu yukarıdaki örüntüyle karşılaştırın.","noAnswer":"yanıt yok","practiceEyebrow":"Pratik","practiceTitle":"İlk üç adımınız","practiceNote":"Bunları 66 gün deneyin. Tekrarla yazılan, tekrarla silinir.","teaserEyebrow":"Tam profilde gelecek","teaserTitle":"Daha derine inin","teaserList":["Tip {t} için dokuz seviyenin tamamı ve sizi birinden diğerine taşıyan şeyler","Alt tipiniz derinlemesine; aşkta, işte ve parada nasıl görünür","Tipiniz diğer tüm tiplerle: ilişkiler ve çatışma","Seviyenize ve yönünüze göre kurulmuş 66 günlük bir iyileşme yolu","Bir aile seansı: örüntünüz, ebeveynlerinizin ve çocuklarınızın örüntüleriyle yan yana"],"fbEyebrow":"Pilot","fbTitle":"Testi geliştirmeye yardım edin","qGuess":"Bugünden önce hangi tip olduğunuzu düşünüyordunuz?","optDontKnow":"Bilmiyordum","qRheti":"RHETI (Riso-Hudson) testini yaptıysanız hangi tipi verdi?","optNotTaken":"Yapmadım","qAcc":"Bu profil ne kadar isabetli geliyor?","accOpts":["1 · Hiç","2","3 · Kısmen","4","5 · Tam isabet"],"qComment":"Yanlış gelen ya da özellikle doğru gelen bir şey var mı?","restart":"Baştan başla","sharedEyebrow":"Kayıtlı profil","sharedTitle":"{name} · profil","sharedTitleAnon":"Paylaşılan bir profil","sharedMeta":"Kendi tahmini: {gs} · RHETI: {rh} · İsabet: {acc}","takeTest":"Testi kendiniz yapın","heroEyebrow":"Enneagram 360 · Pilot","heroTitle":["Örüntünüzü tanıyın.","Derinliğinizi görün.","Yönünüzü seçin."],"heroSub":"Yalnızca kim olduğunuzu değil, bugün bununla nerede durduğunuzu ve buradan nereye gidebileceğinizi gösteren bir kendini keşif testi.","heroMeta":"Yaklaşık 20 dakika · Ücretsiz · Gizli","apEyebrow":"Yaklaşım","apTitle":"İnsan olmanın dokuz hali için bir harita","apText":"Enneagram, insan doğasının kadim bir haritasıdır. Bir çember, bir üçgen ve altı köşeli bir şekilden oluşan sembolü, dokuz dikkat ve motivasyon örüntüsünü anlatır. Hepimiz bu dokuz olasılıkla doğarız; ancak hayatın erken döneminde güvende ve sevilmiş hissetmek için birine yaslanırız. Bu örüntü kişiliğimiz olur: hem armağanlarımız, hem de bizi sıkışık tutan alışkanlıklarımız.","apPillars":[["Dokuz örüntü","Her birinin kendi arzusu, korkusu ve dünyaya bakışı olan dokuz temel motivasyon."],["Üç merkez","Beden, kalp ve zihin: üç zekâ ve hayata verdiğimiz üç farklı tepki."],["Kadim kökler, yaşayan pratik","Yüzyıllık bilgelik geleneklerinden gelir, modern psikolojiyle derinleşmiştir."]],"dfEyebrow":"Neden farklı","dfTitle":"Bir kutu değil. Hareket eden bir ayna.","dfText":"Çoğu kişilik testi davranışlarınızı kategorilere ayırır. Enneagram bunun altına, bir şeyi neden yaptığınıza iner.","dfOthers":"Çoğu kişilik testi","dfEnn":"Enneagram","dfRows":[["Ne yaptığınız","Neden yaptığınız"],["Sabit bir etiket","Stres ve gelişimle değişen bir örüntü"],["Güçlü yönleriniz","Armağanlarınız ve kör noktalarınız"],["Bir tanım","Bir gelişim yolu"]],"tyEyebrow":"Dokuzla tanışın","tyTitle":"Hangisi rahatsız edici derecede tanıdık geliyor?","tyHint":"Bir sayıya dokunun.","z3Eyebrow":"Neden 360","z3Title":"Çoğu Enneagram testi çemberde durur","z3Text":"Size tipinizi, belki kanadınızı söylerler. Enneagram 360 sizi üç boyutta okur; çünkü aynı tipten iki kişi çok farklı hayatlar yaşayabilir.","z3Dims":[["Örüntü","Tipiniz, kanadınız ve içgüdüsel alt tipiniz: kişiliğinizin şekli."],["Derinlik","Şu anki sağlık seviyeniz: özgür ve anda olmaktan otomatik pilotta sıkışmaya kadar."],["Hareket","Şu an ilerlediğiniz yön: gelişime mi, strese mi."]],"z3TblA":"Tipik test","z3TblB":"Enneagram 360","z3Partial":"bazen","z3Rows":["Ana tip","Kanat","İçgüdüsel alt tip","Şu anki sağlık seviyesi","Şu anki yön","Aile kökleri","Sonucun ne kadar kesin olduğu","Gelişim için ilk adımlar"],"hwEyebrow":"Nasıl işler","hwTitle":"Üç adım, yaklaşık 20 dakika","hwSteps":[["Dürüstçe yanıtlayın","Yaklaşık 135 kısa ifade. Doğru cevap yok, yalnızca gerçek cevaplar var."],["360 profilinizi görün","Tipiniz, derinliğiniz ve yönünüz; görseller ve açık anlatımlarla."],["Pratiğe başlayın","Önümüzdeki 66 gün için üç somut ilk adım."]],"ftEyebrow":"Daha ileri","ftTitle":"Bu sadece ilk katman","ftTiers":[["Keşfet","Tam 360 profiliniz: tip, kanat, alt tip, şu anki seviye, yön, aile kökleri ve üç ilk adım.","Ücretsiz · şimdi"],["Derin Profil","Anlık fotoğrafın ötesi: daha uzun bir test, tipinizin dokuz seviyesinin tamamı ve sizi birinden diğerine taşıyanlar, alt tipinizin aşkta, işte ve parada görünümü, diğer tüm tiplerle ilişkiniz.","Yakında"],["İyileşme Yolu","Seviyenize ve yönünüze göre kurulmuş, haftalık değerlendirmeler ve ne kadar ilerlediğinizi gösteren bir tekrar testiyle rehberli 66 günlük pratik.","Yakında"],["Rehberli","Örüntünüzle gerçek hayatta çalışmak için bire bir ve aile seansları.","Yakında"]],"fqEyebrow":"Sıkça sorulan sorular","fqItems":[["Bu bir tanı mı?","Hayır. Öz-farkındalık için bir haritadır; bozuklukları değil, eğilimleri anlatır."],["Tipim değişebilir mi?","Ana tipiniz hayat boyu aynı kalır. Değişen seviyeniz ve yönünüzdür; gelişim de tam orada olur."],["Yanıtlarıma ne olur?","Sonucunuz yalnızca e-posta adresinize gönderilir ve Anıl’ın gizli pilot listesinde saklanır. Tek tek yanıtlarınız ve aile hakkındaki yanıtlarınız cihazınızdan asla çıkmaz."]],"endTitle":"Örüntünüzü görmeye hazır mısınız?","gateEyebrow":"Neredeyse bitti","gateTitle":"Profilinizi nereye gönderelim?","gateText":"Profiliniz bir sonraki ekranda açılır ve aynı anda e-postanıza gönderilir; böylece ona istediğiniz zaman geri dönebilirsiniz.","emailLabel":"E-posta adresiniz","consentProfile":"Enneagram 360 profilimi e-postayla gönderin. Sonucumun ve e-posta adresimin bu pilot çalışma için <a href=\"privacy.html\" target=\"_blank\" rel=\"noopener\">gizlilik bildiriminde</a> açıklandığı şekilde saklanmasını kabul ediyorum.","consentNews":"Enneagram 360 hakkındaki gelişmelerden de haberdar olmak istiyorum (isteğe bağlı, istediğiniz zaman abonelikten çıkabilirsiniz).","gateBtn":"Profilimi göster ve gönder","gateInvalid":"Lütfen geçerli bir e-posta adresi girin.","gateNeedConsent":"Profilinizi gönderebilmemiz için lütfen ilk kutuyu işaretleyin.","sending":"Gönderiliyor…","sentOk":"Profiliniz {email} adresine gönderildi. Göremezseniz spam klasörünüze bakın.","sentNews":"Bülten aboneliğinizi lütfen o e-postadaki bağlantıyla onaylayın.","sentFail":"E-postayı şu anda gönderemedik. Profiliniz aşağıda; lütfen bir ekran görüntüsü alın ya da daha sonra tekrar deneyin.","fbBtn":"Geri bildirimi gönder","fbSent":"Teşekkürler, geri bildiriminiz gönderildi.","fbFail":"Geri bildirim gönderilemedi. Lütfen tekrar deneyin.","privacyLink":"Gizlilik","subWorking":"Bir saniye…","subConfirmed":"Teşekkürler, aboneliğiniz onaylandı.","subConfirmedSub":"Enneagram 360 hakkında ara sıra haber alacaksınız. Her e-postadaki bağlantıyla istediğiniz zaman abonelikten çıkabilirsiniz.","subUnsub":"Abonelikten çıktınız. Artık e-posta almayacaksınız.","subInvalid":"Bu bağlantı artık geçerli değil.","subFail":"Bir sorun oluştu. Lütfen birkaç dakika sonra bağlantıyı tekrar deneyin."}},"de":{"T":{"1":{"name":"Der Reformer","tag":"Prinzipientreu, zielstrebig, beherrscht","summary":"Dich treibt ein tiefer Wunsch an, gut zu sein und integer zu leben. Du siehst klar, wie Dinge besser sein könnten, und setzt dir hohe Maßstäbe. Dein innerer Kritiker hält dich auf Kurs, lässt dich aber selten ruhen.","desire":"Gut, richtig und ganz zu sein","fear":"Falsch, verdorben oder schlecht zu sein","passion":"Zorn (zurückgehalten, als Groll)","fixation":"Groll","virtue":"Gelassenheit","idea":"Heilige Vollkommenheit","childMsg":"„Es ist nicht in Ordnung, Fehler zu machen.“","lostMsg":"„Du bist gut.“","figure":"der schützenden Bezugsperson","rel":"Frustration","famNote":"Die schützende Bezugsperson hat in der Führung versagt oder war streng; das Kind hat einen strengen inneren Richter aufgebaut, der diese Aufgabe übernimmt.","wake":"Das Gefühl, alles persönlich in Ordnung bringen zu müssen.","flag":"„Meine Ideale sind falsch, und nichts, was ich tue, funktioniert.“","grace":"„Für mich ist nichts unmöglich.“","growth":"Richtung gesunde Sieben: Du entspannst dich, genießt das Leben und entdeckst, dass Freude eine berechtigte Antwort auf das Lebendigsein ist.","stress":"Richtung durchschnittliche Vier: Du fühlst dich unverstanden, launisch und möchtest deinen Pflichten entfliehen.","levels":{"h":"Weise, unterscheidungsfähig, annehmend; Prinzipien mit Wärme.","a":"Ordentlich, kritisch, angespannt; bemüht, alles korrekt zu halten.","u":"Starr, hart, strafend gegenüber sich selbst und anderen."},"actions":["Wenn du deinen inneren Kritiker hörst, halte inne und frage: Ist dieser Maßstab meiner, oder habe ich ihn übernommen?","Lass diese Woche bewusst eine kleine Sache unperfekt und beobachte, was tatsächlich passiert.","Plane eine Stunde reines Vergnügen ohne Zweck ein, so ernsthaft wie deine Arbeit."]},"2":{"name":"Der Helfer","tag":"Großzügig, warmherzig, gefallen wollend","summary":"Dich treibt der Wunsch an, geliebt zu werden und im Leben anderer wichtig zu sein. Du spürst mit großer Feinfühligkeit, was andere brauchen, und gibst großzügig, während deine eigenen Bedürfnisse oft im Hintergrund bleiben.","desire":"Geliebt und gewollt zu sein","fear":"Ungewollt oder der Liebe unwürdig zu sein","passion":"Stolz","fixation":"Schmeichelei","virtue":"Demut","idea":"Heiliger Wille","childMsg":"„Es ist nicht in Ordnung, eigene Bedürfnisse zu haben.“","lostMsg":"„Du bist gewollt.“","figure":"der schützenden Bezugsperson","rel":"Ablehnung","famNote":"Die Liebe der schützenden Bezugsperson fühlte sich nicht frei geschenkt an; das Kind lernte, dass man Liebe verdienen muss, indem man nützlich ist.","wake":"Das Gefühl, Menschen für sich gewinnen zu müssen, indem man auf sie zugeht.","flag":"„Ich vertreibe die Menschen, die ich liebe.“","grace":"„Ich kann Dinge beeinflussen, um zu bekommen, was ich brauche.“","growth":"Richtung gesunde Vier: Du begegnest deinen eigenen Gefühlen ehrlich, auch den schwierigen, und nimmst dich an, wie du bist.","stress":"Richtung durchschnittliche Acht: Du wirst fordernd und kontrollierend, wenn deine Fürsorge nicht erwidert wird.","levels":{"h":"Selbstlos, einfühlsam, sorgt für sich wie für andere.","a":"Gefällig, aufdringlich, erwartet still eine Gegenleistung.","u":"Manipulativ, anspruchsvoll, arbeitet mit Schuld oder Druck."},"actions":["Frage dich, bevor du hilfst: Was brauche ich gerade?","Bitte jemanden um Hilfe bei einer Kleinigkeit und lass ihn geben.","Bemerke diese Woche einen Moment von Groll und benenne das Bedürfnis dahinter."]},"3":{"name":"Der Erfolgsmensch","tag":"Anpassungsfähig, ehrgeizig, imagebewusst","summary":"Dich treibt der Wunsch an, wertvoll zu sein und bewundert zu werden. Du setzt Ziele, passt dich schnell an und lieferst Ergebnisse. Die Gefahr ist, den Kontakt dazu zu verlieren, wer du jenseits deiner Leistungen bist.","desire":"Wertvoll und lohnenswert zu sein","fear":"Wertlos oder ein Versager zu sein","passion":"Täuschung (Selbsttäuschung)","fixation":"Eitelkeit","virtue":"Wahrhaftigkeit","idea":"Heiliges Gesetz / Hoffnung","childMsg":"„Es ist nicht in Ordnung, eigene Gefühle und eine eigene Identität zu haben.“","lostMsg":"„Du wirst um deiner selbst willen geliebt.“","figure":"der nährenden Bezugsperson","rel":"Bindung","famNote":"Das Kind war an die nährende Bezugsperson gebunden, spürte, was sie schätzte, und wurde genau das; Lob gab es für das Tun, nicht für das Sein.","wake":"Sich für Status, Position und Aufmerksamkeit verausgaben.","flag":"„Ich versage; ich bin leer und unecht.“","grace":"„Ich kann das Ergebnis beeinflussen.“","growth":"Richtung gesunde Sechs: Du setzt dich für etwas ein, das größer ist als dein eigener Erfolg, und lässt andere deine echten Gefühle sehen.","stress":"Richtung durchschnittliche Neun: Du ziehst dich zurück, verlierst deinen Antrieb und stumpfst ab.","levels":{"h":"Authentisch, innengeleitet, ein inspirierendes Vorbild.","a":"Leistungsorientiert, imagepflegend, wettbewerbsorientiert.","u":"Täuschend, opportunistisch, verzweifelt um den Schein bemüht."},"actions":["Frage dich einmal am Tag: Was fühle ich gerade, abgesehen von dem, was erledigt werden muss?","Teile einen Zweifel oder ein Scheitern mit einer Vertrauensperson, ohne Beschönigung.","Tu diese Woche etwas nur, weil es dir Freude macht, ganz ohne Publikum."]},"4":{"name":"Der Individualist","tag":"Ausdrucksstark, sensibel, selbstbezogen","summary":"Dich treibt der Wunsch an, dein wahres Selbst zu finden und auszudrücken. Du fühlst tief, schätzt Echtheit und Schönheit und spürst oft, dass etwas Wesentliches fehlt.","desire":"Du selbst zu sein und deine Bedeutung zu finden","fear":"Keine Identität oder persönliche Bedeutung zu haben","passion":"Neid","fixation":"Melancholie","virtue":"Gleichmut","idea":"Heiliger Ursprung","childMsg":"„Es ist nicht in Ordnung, zu gut zu funktionieren oder zu glücklich zu sein.“","lostMsg":"„Du wirst gesehen, wie du bist.“","figure":"beiden Elternteilen","rel":"Frustration","famNote":"Das Kind fühlte sich von keinem Elternteil wirklich gesehen und schloss daraus, dass ihm etwas fehlen müsse.","wake":"An Gefühlen festhalten und sie durch Fantasien verstärken.","flag":"„Ich ruiniere mein Leben und vergeude meine Chancen.“","grace":"„Ich bin mir bewusst.“","growth":"Richtung gesunde Eins: Du handelst nach Prinzipien, bringst Dinge zu Ende und verwandelst Gefühl in disziplinierte Arbeit.","stress":"Richtung durchschnittliche Zwei: Du klammerst dich an Menschen und brauchst es, gebraucht zu werden.","levels":{"h":"Kreativ, ehrlich mit Gefühlen, mitfühlend.","a":"Launisch, sehnsüchtig, vergleichend, in Fantasien zurückgezogen.","u":"Verzweifelt, selbstablehnend, entfremdet."},"actions":["Wenn du dich mit jemandem vergleichst, schreib drei Dinge auf, die du hast.","Beende diese Woche eine kreative oder praktische Aufgabe, unabhängig von deiner Stimmung.","Übe jeden Abend Dankbarkeit für einen gewöhnlichen Moment."]},"5":{"name":"Der Beobachter","tag":"Scharfsinnig, unabhängig, zurückhaltend","summary":"Dich treibt der Wunsch an, fähig zu sein und zu verstehen. Du beobachtest, analysierst und schützt deine Zeit und Energie. Die Gefahr ist, im Kopf zu leben und auf Abstand zum Leben zu bleiben.","desire":"Fähig und kompetent zu sein","fear":"Nutzlos, hilflos oder unfähig zu sein","passion":"Geiz (Zurückhalten)","fixation":"Knauserigkeit","virtue":"Nicht-Anhaften","idea":"Heilige Allwissenheit","childMsg":"„Es ist nicht in Ordnung, sich in der Welt wohlzufühlen.“","lostMsg":"„Deine Bedürfnisse sind kein Problem.“","figure":"beiden Elternteilen","rel":"Ablehnung","famNote":"Die Eltern wirkten entweder übergriffig oder nicht verfügbar; das Kind hielt seine Bedürfnisse klein und zog sich in den Kopf zurück.","wake":"Sich aus der Wirklichkeit in Konzepte und Gedankenwelten zurückziehen.","flag":"„Ich werde nie einen Platz in der Welt oder unter Menschen finden.“","grace":"„Ich kann die Antworten finden.“","growth":"Richtung gesunde Acht: Du handelst entschlossen und vertraust darauf, Probleme zu bewältigen, wenn sie kommen.","stress":"Richtung durchschnittliche Sieben: Du verzettelst dich in Ablenkungen und Unruhe.","levels":{"h":"Visionär, einsichtig, engagiert und großzügig mit Wissen.","a":"Distanziert, analytisch, hortet Zeit und Energie.","u":"Isoliert, nihilistisch, abgeschnitten von Bedürfnissen und Menschen."},"actions":["Handle diese Woche einmal, bevor du dich ganz vorbereitet fühlst.","Teile etwas, das du weißt, mit jemandem, dem es nützt.","Nimm dreimal am Tag deinen Körper wahr: Hunger, Müdigkeit, Anspannung."]},"6":{"name":"Der Loyale","tag":"Engagiert, verantwortungsvoll, ängstlich","summary":"Dich treibt der Wunsch nach Sicherheit und Halt an. Du bist loyal, achtsam gegenüber Risiken und gut darin, Probleme vorauszusehen. Zweifel und Angst können es schwer machen, dir selbst zu vertrauen.","desire":"Sicherheit und Halt zu haben","fear":"Ohne Halt oder Orientierung zu sein","passion":"Angst","fixation":"Feigheit / Zweifel","virtue":"Mut","idea":"Heiliger Glaube","childMsg":"„Es ist nicht in Ordnung, dir selbst zu vertrauen.“","lostMsg":"„Du bist sicher.“","figure":"der schützenden Bezugsperson","rel":"Bindung","famNote":"Das Kind band sich an die schützende Bezugsperson und machte deren Anerkennung zur Quelle von Sicherheit.","wake":"Sich für Orientierung von etwas außerhalb seiner selbst abhängig machen.","flag":"„Mein Handeln hat meine Sicherheit gefährdet.“","grace":"„Ich bin verantwortungsvoll.“","growth":"Richtung gesunde Neun: Du entspannst dich, vertraust und wirst offener und empfänglicher.","stress":"Richtung durchschnittliche Drei: Du wirst wettbewerbsorientiert und imagefixiert, um deinen Wert zu beweisen.","levels":{"h":"Mutig, vertrauensvoll, engagiert, ein stabilisierender Mensch.","a":"Besorgt, zweifelnd, schwankend zwischen Abhängigkeit und Trotz.","u":"Misstrauisch, panisch, schlägt um sich oder bricht ein."},"actions":["Wenn ein „Was wäre, wenn“ beginnt, schreib es auf und ergänze ein „Was, wenn es gut geht“.","Triff diese Woche eine Entscheidung, ohne jemanden nach seiner Meinung zu fragen.","Beende jeden Tag, indem du eine Sache benennst, die gut gelaufen ist."]},"7":{"name":"Der Enthusiast","tag":"Spontan, vielseitig, zerstreut","summary":"Dich treibt der Wunsch an, glücklich, frei und erfüllt zu sein. Du bist neugierig, schnell und voller Pläne. Die Gefahr ist, vor Schmerz davonzulaufen und nie lange genug zu bleiben, um in die Tiefe zu gehen.","desire":"Zufrieden und erfüllt zu sein","fear":"In Schmerz oder Mangel gefangen zu sein","passion":"Völlerei (nach Erlebnissen)","fixation":"Planen","virtue":"Nüchternheit","idea":"Heiliger Plan / Weisheit","childMsg":"„Es ist nicht in Ordnung, für irgendetwas von jemandem abhängig zu sein.“","lostMsg":"„Für dich wird gesorgt.“","figure":"der nährenden Bezugsperson","rel":"Frustration","famNote":"Das Kind hatte das Gefühl, von der nährenden Bezugsperson nicht genug Fürsorge zu bekommen, und beschloss, sich selbst zu versorgen.","wake":"Zu glauben, dass woanders immer etwas Besseres warte
