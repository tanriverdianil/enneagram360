<style>
/* Layout: one calm reading column, a quiet step rail on top, answers as tactile scales. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1d2523; --muted:#5d6b67; --line:#d9dfdc;
  --accent:#1f5f5b; --accent-soft:#e1eeec; --gold:#9a6b1f; --gold-soft:#f5ecd9; --warn:#8a3b2e; --warn-soft:#f6e4df;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --ink:#e6ece9; --muted:#9aaaa5; --line:#2c3633;
  --accent:#6fc2b9; --accent-soft:#1e3532; --gold:#d9ad5f; --gold-soft:#33291a; --warn:#e59a8a; --warn-soft:#3a221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --ink:#e6ece9; --muted:#9aaaa5; --line:#2c3633;
  --accent:#6fc2b9; --accent-soft:#1e3532; --gold:#d9ad5f; --gold-soft:#33291a; --warn:#e59a8a; --warn-soft:#3a221d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.25rem;font-weight:600;letter-spacing:.01em}
.brand small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-left:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.rail{display:flex;gap:4px}
.rail span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.rail span.on{background:var(--accent)}
.rail span.now{background:var(--gold)}
.steplabel{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-child{border-top:none;padding-top:0}
.q p.stmt{font-size:1.02rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button,.choice,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.scale button{padding:9px 2px;font-size:.78rem;line-height:1.2;min-height:44px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.scale-ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;line-height:1.45}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.choices{display:flex;flex-direction:column;gap:8px}
.btn{padding:12px 20px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.small{padding:7px 12px;font-size:.85rem}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:500}
input[type=text],select,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.note{border-radius:10px;padding:12px 14px;background:var(--gold-soft);font-size:.92rem}
.note.warn{background:var(--warn-soft)}
/* result */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.typenum{font-family:var(--f-display);font-size:4.4rem;line-height:1;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact b{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fact span{font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:28px 1fr 40px;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:.85rem}
.bar .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--muted);border-radius:5px}
.bar.top .fill{background:var(--accent)}
.bar .n{font-family:var(--f-mono)}
.levelscale{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.levelscale div{height:28px;border-radius:4px;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.levelscale div.band-h{background:var(--accent-soft)}
.levelscale div.band-u{background:var(--warn-soft)}
.levelscale div.here{background:var(--gold);color:var(--surface);font-weight:600}
.levelkey{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.typenum{font-size:3.4rem}.scale button{font-size:.7rem}}
.kv{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.actions{counter-reset:a;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.actions li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.actions li::before{counter-increment:a;content:counter(a);font-family:var(--f-mono);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500}
.code{font-family:var(--f-mono);font-size:.75rem;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;max-height:120px;overflow:auto;user-select:all}
table.log{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
table.log th,table.log td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.log th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.no{background:var(--warn-soft);color:var(--warn)} .pill.na{background:var(--line);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
/* v2: growth/stress palette that runs through the whole model */
:root{--grow:#1f9e6a;--grow2:#d9a926;--stress:#d9472b;--stress2:#8f1f1f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grow:#3fd08f;--grow2:#f0c94a;--stress:#ff6a4d;--stress2:#c23b2b}}
:root[data-theme="dark"]{--grow:#3fd08f;--grow2:#f0c94a;--stress:#ff6a4d;--stress2:#c23b2b}
.gcol{color:var(--grow)} .scol{color:var(--stress)}
.hero-card{border-top:5px solid var(--tc)}
.hero-card .typenum{color:var(--tc)}
/* 3D tower */
.tower-wrap{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.scene{width:236px;height:320px;perspective:900px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.tower{position:relative;width:220px;height:220px;transform-style:preserve-3d;transform:rotateX(62deg) rotateZ(-25deg);margin-bottom:20px}
@media (prefers-reduced-motion:no-preference){.tower:not(.still){animation:spin 36s linear infinite}}
@keyframes spin{from{transform:rotateX(62deg) rotateZ(0deg)}to{transform:rotateX(62deg) rotateZ(360deg)}}
.layer{position:absolute;inset:0;transform:translateZ(var(--z));transform-style:preserve-3d}
.layer svg{width:100%;height:100%;display:block;overflow:visible}
.pillar{position:absolute;width:6px;height:124px;transform-origin:50% 0;transform:rotateX(90deg);background:linear-gradient(to bottom,var(--tc),transparent);border-radius:3px;box-shadow:0 0 14px var(--tc);opacity:.9}
.pillar.x{transform:rotateZ(90deg) rotateX(90deg)}
.legend{display:flex;flex-direction:column;gap:3px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.lg{display:flex;align-items:center;gap:6px}
.lg i{width:22px;height:12px;border-radius:3px;background:var(--lc);display:block}
.lg.on{color:var(--ink)} .lg.on i{outline:2px solid var(--ink);outline-offset:1px}
/* wing + movement */
.venn{width:100%;max-width:340px;margin:0 auto;display:block}
.move{width:100%;max-width:300px;margin:0 auto;display:block}
@media (prefers-reduced-motion:no-preference){.flow{stroke-dasharray:10 7;animation:flow 1.2s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-17}}
.movekey{display:flex;justify-content:center;gap:18px;font-size:.85rem;font-weight:600}
.movekey i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.arrowbox{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.arrowbox.g{background:color-mix(in srgb,var(--grow) 14%,transparent);border-left:4px solid var(--grow)}
.arrowbox.s{background:color-mix(in srgb,var(--stress) 14%,transparent);border-left:4px solid var(--stress)}
/* ladder */
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ladder li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.ladder .ln{width:30px;height:30px;border-radius:7px;background:var(--lc);color:#fff;font-family:var(--f-mono);font-weight:600;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ladder .lt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.ladder .lt b{font-weight:500;font-size:.92rem} .ladder .lt small{color:var(--muted);font-size:.78rem}
.ladder li.here{border-color:var(--ink);background:color-mix(in srgb,var(--lc) 18%,transparent)}
.ladder li.here .lt b{font-weight:700}
.pill.you{background:var(--ink);color:var(--surface)}
.extreme{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.extreme.best{background:color-mix(in srgb,var(--grow2) 18%,transparent);border-left:4px solid var(--grow2)}
.extreme.worst{background:color-mix(in srgb,var(--stress2) 14%,transparent);border-left:4px solid var(--stress2)}
.extreme small{color:var(--muted)}
.band{border-radius:10px;padding:10px 12px;margin-bottom:8px}
.band.b0{background:color-mix(in srgb,var(--grow) 12%,transparent)} .band.b1{background:color-mix(in srgb,var(--muted) 10%,transparent)} .band.b2{background:color-mix(in srgb,var(--stress) 12%,transparent)}
/* bars, read more, misc */
.hbar{display:grid;grid-template-columns:minmax(70px,auto) 1fr 40px;gap:10px;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.hbar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:6px}
.hbar .n{font-family:var(--f-mono);text-align:right}
.hbar.top .hl{font-weight:600}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;list-style:none;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";font-family:var(--f-mono);width:22px;height:22px;border-radius:50%;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:.9rem}
details.more[open] summary::before{content:"\2212"}
.more-body{display:flex;flex-direction:column;gap:12px;padding-top:12px}
table.cmp{width:100%;border-collapse:collapse;font-size:.88rem}
table.cmp th,table.cmp td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp thead th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.teaser{background:linear-gradient(135deg,color-mix(in srgb,var(--grow2) 14%,var(--surface)),color-mix(in srgb,var(--accent) 12%,var(--surface)))}
ul.locked{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.locked li{display:grid;grid-template-columns:22px 1fr;gap:8px}
ul.locked li::before{content:"\25C7";color:var(--accent)}
pre.msg{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.78rem;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;margin:0;max-height:220px;overflow:auto}
.shared{border-top:5px solid var(--gold)}

/* ---------- landing page ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:30px 22px 34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.aurora{position:absolute;inset:-25%;z-index:-1;filter:blur(46px);opacity:.6;pointer-events:none}
.aurora i{position:absolute;width:58%;height:58%;border-radius:50%}
.aurora i:nth-child(1){left:-4%;top:2%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%)}
.aurora i:nth-child(2){right:-6%;top:10%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 50%,transparent),transparent 70%)}
.aurora i:nth-child(3){left:22%;bottom:-6%;background:radial-gradient(circle,color-mix(in srgb,#9b3f9e 40%,transparent),transparent 70%)}
.hsym{width:min(270px,72vw);height:auto;overflow:visible;margin-bottom:4px}
.hring{fill:none;stroke:var(--ink);stroke-opacity:.25;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:0}
.hlines{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:0}
.hn .halo{opacity:.22}
.htitle{font-size:clamp(1.9rem,7vw,2.7rem);line-height:1.12;max-width:16ch}
.htitle span{display:block}
.htitle .hl1{color:var(--accent);font-style:italic}
.htitle .hl2{color:var(--gold)}
.hsub{max-width:46ch;font-size:1.06rem;color:var(--muted)}
.btn.big{padding:15px 28px;font-size:1.05rem;border-radius:999px;box-shadow:0 8px 24px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.hmeta{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
 .aurora i{animation:drift 16s ease-in-out infinite alternate}
 .aurora i:nth-child(2){animation-duration:21s;animation-direction:alternate-reverse}
 .aurora i:nth-child(3){animation-duration:25s}
 @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(12%,8%) scale(1.15)}}
 .hring{stroke-dashoffset:1;animation:draw 1.6s ease-out forwards}
 .hlines{stroke-dashoffset:1;animation:draw 2.6s .5s ease-in-out forwards}
 @keyframes draw{to{stroke-dashoffset:0}}
 .hn{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s var(--d) cubic-bezier(.3,1.6,.5,1) forwards}
 @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
 .hn .halo{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s var(--b) ease-in-out infinite}
 @keyframes breathe{0%,100%{opacity:.12;transform:scale(.85)}50%{opacity:.35;transform:scale(1.25)}}
 .rv-on .rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
 .rv-on .rv.in{opacity:1;transform:none}
 .tycard{animation:fadein .45s ease}
 @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pillar-card{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,var(--accent-soft),transparent 70%)}
.pillar-card .pi{font-family:var(--f-display);font-size:1.9rem;line-height:1;color:var(--accent)}
.pillar-card p{font-size:.9rem}
.contrast{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.contrast>div{padding:11px 13px;border-top:1px solid var(--line);font-size:.93rem;min-width:0}
.contrast .ch{border-top:none;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.contrast .ch.enn{color:var(--accent);background:var(--accent-soft)}
.contrast .ca{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 45%,transparent)}
.contrast .cb{background:var(--accent-soft);font-weight:600}
.wheelwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center}
.wheel{width:min(300px,82vw);height:auto;overflow:visible}
.wn{cursor:pointer;outline:none}
.wn circle,.wn text{transition:transform .3s ease}
.wn .wh{transition:fill-opacity .3s ease}
.wn.on .wh,.wn:hover .wh,.wn:focus-visible .wh{fill-opacity:.3}
.wn:focus-visible .wh{stroke:var(--gold);stroke-width:3}
#tycard{width:100%;min-height:220px}
.tycard{border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--tc);padding:16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 12%,var(--surface)),var(--surface) 65%)}
.tyhead{display:flex;gap:14px;align-items:center}
.tynum{font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--tc);font-weight:600}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dim{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dim .msym{width:96px;height:96px}
.dim p{font-size:.88rem}
table.z3t{width:100%;border-collapse:collapse;font-size:.9rem}
table.z3t th,table.z3t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.z3t td{text-align:center;width:28%}
table.z3t thead th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
table.z3t thead th:first-child{text-align:left}
table.z3t tbody th{font-weight:500}
table.z3t .us{background:color-mix(in srgb,var(--gold) 12%,transparent)}
table.z3t thead .us{color:var(--gold)}
.ck{display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.ck.full{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);font-size:.8rem}
.us .ck.full{background:var(--gold)}
.ck.part{font-size:.72rem;color:var(--muted);font-style:italic}
.ck.none{color:var(--muted)}
.steps3{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:0}
.steps3 li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;column-gap:12px;position:relative;padding-bottom:18px}
.steps3 li::before{content:counter(s);grid-row:span 2;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--surface);font-family:var(--f-display);font-size:1.2rem;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:1}
.steps3 li:not(:last-child)::after{content:"";position:absolute;left:18px;top:40px;bottom:0;width:2px;background:var(--line)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tier{border:1px solid var(--line);border-top:4px solid var(--lv);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tier p{font-size:.86rem}
.tier.now{background:var(--accent-soft);border-color:var(--accent);border-top-color:var(--lv)}
.tiertag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tier.now .tiertag{color:var(--accent);font-weight:600}
.endcta{align-items:center;text-align:center;background:linear-gradient(150deg,var(--accent-soft),var(--surface) 60%,var(--gold-soft))}
@media (max-width:560px){.dims{grid-template-columns:1fr}.dim{display:grid;grid-template-columns:76px 1fr;column-gap:14px;align-items:center}.dim .msym{width:76px;height:76px;grid-row:span 2}}

.langsel{font:inherit;font-size:.85rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:auto}
.langfield{font-size:.85rem;color:var(--muted)}.langfield .langsel{font-size:1rem;padding:10px 12px;width:100%;color:var(--ink)}
input[type=email]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note.okn{background:var(--accent-soft)}
.gate form{display:flex;flex-direction:column;gap:14px}
.check a,#foot a{color:var(--accent)}
</style>
</head>

<script>
const LANGS={"en":{"T":{"1":{"name":"The Reformer","tag":"Principled, purposeful, self-controlled","summary":"You are driven by a deep wish to be good and to live with integrity. You see clearly how things could be better, and you hold yourself to high standards. Your inner critic keeps you on track but rarely lets you rest.","desire":"To be good, right and whole","fear":"Being wrong, corrupt or bad","passion":"Anger (held in as resentment)","fixation":"Resentment","virtue":"Serenity","idea":"Holy Perfection","childMsg":"“It’s not OK to make mistakes.”","lostMsg":"“You are good.”","figure":"protective figure","rel":"frustration","famNote":"The protective figure often fell short in guidance or was harsh, so the child built a strict inner judge to do the job.","wake":"Feeling a personal obligation to fix everything yourself.","flag":"“My ideals are wrong and nothing I do works.”","grace":"“Nothing is impossible for me.”","to":7,"from":4,"growth":"Toward healthy Seven: you relax, enjoy life and discover that joy is a legitimate response to being alive.","stress":"Toward average Four: you feel misunderstood, moody and want to escape your responsibilities.","levels":{"h":"Wise, discerning, accepting; principles held with warmth.","a":"Orderly, critical, tense; trying to keep everything correct.","u":"Rigid, harsh, punishing toward self and others."},"actions":["When you hear your inner critic, pause and ask: is this standard mine, or one I absorbed?","Leave one small thing imperfect on purpose this week and notice what actually happens.","Schedule one hour of pure enjoyment with no purpose, as seriously as you schedule work."]},"2":{"name":"The Helper","tag":"Generous, warm, people-pleasing","summary":"You are driven by a wish to be loved and to matter in people’s lives. You tune in to others’ needs with great sensitivity and give generously, while your own needs often stay in the background.","desire":"To be loved and wanted","fear":"Being unwanted or unworthy of love","passion":"Pride","fixation":"Flattery","virtue":"Humility","idea":"Holy Will","childMsg":"“It’s not OK to have your own needs.”","lostMsg":"“You are wanted.”","figure":"protective figure","rel":"rejection","famNote":"Love from the protective figure did not feel freely given, so the child learned that love must be earned by being useful.","wake":"Feeling you must win people over by going to them.","flag":"“I am driving away the people I love.”","grace":"“I can influence things to get what I need.”","to":4,"from":8,"growth":"Toward healthy Four: you meet your own feelings honestly, including the difficult ones, and accept yourself as you are.","stress":"Toward average Eight: you become demanding and controlling when your care is not returned.","levels":{"h":"Unselfish, empathic, caring for yourself as well as others.","a":"Pleasing, intrusive, quietly expecting something back.","u":"Manipulative, entitled, using guilt or pressure."},"actions":["Before helping, ask yourself: what do I need right now?","Ask one person for help with something small, and let them give.","Notice one moment of resentment this week and name the need behind it."]},"3":{"name":"The Achiever","tag":"Adaptable, driven, image-conscious","summary":"You are driven by a wish to be valuable and admired. You set goals, adapt quickly and deliver results. The risk is losing touch with who you are beneath what you achieve.","desire":"To be valuable and worthwhile","fear":"Being worthless or a failure","passion":"Vanity (self-deceit)","fixation":"Vanity","virtue":"Truthfulness","idea":"Holy Law / Hope","childMsg":"“It’s not OK to have your own feelings and identity.”","lostMsg":"“You are loved for yourself.”","figure":"nurturing figure","rel":"attachment","famNote":"The child was attached to the nurturing figure, sensed what she valued and became it; praise came for doing, not for being.","wake":"Driving yourself for status and attention.","flag":"“I am failing; I am empty and fake.”","grace":"“I can influence the outcome.”","to":6,"from":9,"growth":"Toward healthy Six: you commit to something larger than your own success and let people see your real feelings.","stress":"Toward average Nine: you disengage, lose drive and go numb.","levels":{"h":"Authentic, inner-directed, an inspiring role model.","a":"Performance-focused, image-managing, competitive.","u":"Deceptive, opportunistic, desperate to keep up appearances."},"actions":["Once a day, ask: what am I actually feeling, apart from what needs doing?","Share one doubt or failure with someone you trust, without spin.","Do one thing this week only because you enjoy it, with no audience."]},"4":{"name":"The Individualist","tag":"Expressive, sensitive, self-absorbed","summary":"You are driven by a wish to find and express your true self. You feel deeply, value authenticity and beauty, and often sense that something essential is missing.","desire":"To be yourself and find your significance","fear":"Having no identity or personal significance","passion":"Envy","fixation":"Melancholy","virtue":"Equanimity","idea":"Holy Origin","childMsg":"“It’s not OK to be too functional or too happy.”","lostMsg":"“You are seen for who you are.”","figure":"both figures","rel":"frustration","famNote":"The child did not feel truly seen by either parent and concluded that something in them must be missing.","wake":"Holding on to feelings and intensifying them with fantasy.","flag":"“I am ruining my life and wasting my chances.”","grace":"“I am aware.”","to":1,"from":2,"growth":"Toward healthy One: you act on principles, follow through and turn feeling into disciplined work.","stress":"Toward average Two: you cling to people and need to feel needed.","levels":{"h":"Creative, honest with feelings, compassionate.","a":"Moody, longing, comparing, withdrawn into fantasy.","u":"Despairing, self-rejecting, alienated."},"actions":["When you compare yourself with someone, list three things you do have.","Finish one creative or practical task this week regardless of mood.","Practice gratitude for one ordinary moment each evening."]},"5":{"name":"The Investigator","tag":"Perceptive, independent, private","summary":"You are driven by a wish to be capable and to understand. You observe, analyze and protect your time and energy. The risk is living in your head and staying at a distance from life.","desire":"To be capable and competent","fear":"Being useless, helpless or incapable","passion":"Avarice","fixation":"Stinginess (retention)","virtue":"Non-attachment","idea":"Holy Omniscience","childMsg":"“It’s not OK to be comfortable in the world.”","lostMsg":"“Your needs are not a problem.”","figure":"both figures","rel":"rejection","famNote":"The parents felt either intrusive or unavailable, so the child kept its needs small and retreated into the mind.","wake":"Withdrawing from reality into concepts and mental worlds.","flag":"“I will never find a place in the world or among people.”","grace":"“I can find the answers.”","to":8,"from":7,"growth":"Toward healthy Eight: you act decisively and trust that you can handle problems as they come.","stress":"Toward average Seven: you scatter into distractions and restlessness.","levels":{"h":"Visionary, insightful, engaged and generous with knowledge.","a":"Detached, analytical, hoarding time and energy.","u":"Isolated, nihilistic, cut off from needs and people."},"actions":["Act once this week before you feel fully prepared.","Share one thing you know with someone who would benefit.","Notice your body three times a day: hunger, tiredness, tension."]},"6":{"name":"The Loyalist","tag":"Committed, responsible, anxious","summary":"You are driven by a wish for security and support. You are loyal, alert to risks and good at anticipating problems. Doubt and anxiety can make it hard to trust yourself.","desire":"To have security and support","fear":"Being without support or guidance","passion":"Fear (anxiety)","fixation":"Cowardice / doubt","virtue":"Courage","idea":"Holy Faith","childMsg":"“It’s not OK to trust yourself.”","lostMsg":"“You are safe.”","figure":"protective figure","rel":"attachment","famNote":"The child bonded to the protective figure and made that approval the source of safety.","wake":"Depending on something outside yourself for guidance.","flag":"“My actions have put my security at risk.”","grace":"“I am responsible.”","to":9,"from":3,"growth":"Toward healthy Nine: you relax, trust and become more open and receptive.","stress":"Toward average Three: you become competitive and image-focused to prove your worth.","levels":{"h":"Courageous, trusting, committed, a stabilizing presence.","a":"Worrying, doubtful, swinging between dependence and defiance.","u":"Suspicious, panicky, lashing out or collapsing."},"actions":["When a ‘what if’ starts, write it down and add one ‘what if it goes well’.","Make one decision this week without asking anyone’s opinion.","End each day by naming one thing that went right."]},"7":{"name":"The Enthusiast","tag":"Spontaneous, versatile, scattered","summary":"You are driven by a wish to be happy, free and satisfied. You are curious, quick and full of plans. The risk is running from pain and never staying long enough to go deep.","desire":"To be satisfied and content","fear":"Being trapped in pain or deprivation","passion":"Gluttony (for experience)","fixation":"Planning","virtue":"Sobriety","idea":"Holy Plan / Wisdom","childMsg":"“It’s not OK to depend on anyone for anything.”","lostMsg":"“You will be taken care of.”","figure":"nurturing figure","rel":"frustration","famNote":"The child felt it did not get enough care from the nurturing figure and decided to nurture itself.","wake":"Believing something better is always available elsewhere.","flag":"“My activities bring me nothing but pain and unhappiness.”","grace":"“I have experience.”","to":5,"from":1,"growth":"Toward healthy Five: you go deep, focus and enjoy stillness.","stress":"Toward average One: you become critical, impatient and perfectionistic.","levels":{"h":"Grateful, joyful, focused, deeply satisfied.","a":"Busy, distractible, always planning the next thing.","u":"Impulsive, excessive, escaping pain at any cost."},"actions":["Stay with one uncomfortable feeling for five minutes without fixing or escaping it.","Finish one started project before beginning a new one.","Each evening write down three things you are grateful for today."]},"8":{"name":"The Challenger","tag":"Self-confident, decisive, protective","summary":"You are driven by a wish to protect yourself and stay in control of your life. You are strong, direct and ready to act. Underneath, there is a tender side you rarely show.","desire":"To protect yourself and determine your own course","fear":"Being harmed, controlled or betrayed","passion":"Lust (intensity)","fixation":"Vengeance","virtue":"Innocence","idea":"Holy Truth","childMsg":"“It’s not OK to be vulnerable or to trust anyone.”","lostMsg":"“You will not be betrayed.”","figure":"nurturing figure","rel":"rejection","famNote":"Tenderness and trust did not come from the nurturing figure, so the child concluded that vulnerability is dangerous and took the protector role itself.","wake":"Feeling you must push and struggle to make things happen.","flag":"“People are turning against me; they will retaliate.”","grace":"“I have the strength to do it.”","to":2,"from":5,"growth":"Toward healthy Two: you use your strength to care for others and let your heart lead.","stress":"Toward average Five: you withdraw, become secretive and plan instead of acting.","levels":{"h":"Magnanimous, protective, strong and soft-hearted.","a":"Dominating, pushing, needing control.","u":"Ruthless, intimidating, trusting no one."},"actions":["Ask for help once this week and accept it without taking over.","When you feel the urge to push, pause for three breaths and ask what you are protecting.","Show one person a softer side: say what they mean to you."]},"9":{"name":"The Peacemaker","tag":"Receptive, reassuring, complacent","summary":"You are driven by a wish for inner and outer peace. You see every side, calm others and keep things together. The risk is forgetting yourself and your own voice.","desire":"To have inner stability and peace of mind","fear":"Loss, separation and conflict","passion":"Sloth (self-forgetting)","fixation":"Indolence","virtue":"Right action","idea":"Holy Love","childMsg":"“It’s not OK to assert yourself.”","lostMsg":"“Your presence matters.”","figure":"both figures","rel":"attachment","famNote":"The child was attached to both parents and made itself invisible to keep the peace.","wake":"Accommodating others to keep the peace.","flag":"“They will force me to face reality to solve my problems.”","grace":"“I can adapt.”","to":3,"from":6,"growth":"Toward healthy Three: you invest energy in yourself, set goals and take action.","stress":"Toward average Six: you become anxious, worried and reactive.","levels":{"h":"Present, grounded, a true peacemaker who also speaks up.","a":"Accommodating, avoiding, numbing out with routines.","u":"Disengaged, stubbornly shut down, lost to yourself."},"actions":["Each morning, name one thing you want for yourself today.","Say ‘I disagree’ once this week, kindly and clearly.","Do the most important task first, before the comfortable ones."]}},"WINGS":{"1w9":"Calm, idealistic and reserved; principles held quietly.","1w2":"A warm, persuasive advocate who applies principles to helping people.","2w1":"Service-minded and dutiful; helps quietly and conscientiously.","2w3":"Outgoing and charming; a generous, visible host.","3w2":"Personable and charming; success through relationships.","3w4":"Professional, focused and more private; success through excellent work.","4w3":"Expressive, ambitious and image-aware.","4w5":"Introspective, unconventional and withdrawn.","5w4":"Imaginative, independent, an artistic thinker.","5w6":"Analytical and practical; a problem solver who values systems.","6w5":"Cautious, studious and independent.","6w7":"Friendly and playful; finds reassurance in company.","7w6":"Sociable, loyal and fun-loving.","7w8":"Bold, practical and assertive.","8w7":"An independent maverick: fast, expansive, adventurous.","8w9":"Steady strength: calm, protective, slower to anger.","9w8":"Grounded and easygoing, but able to be firm.","9w1":"Gentle, orderly and idealistic."},"INST_NAME":{"sp":"Self-preservation","so":"Social","sx":"One-to-one"},"ITEMS":{"1":["I notice right away when something is not done properly.","I hold myself to high standards and feel uneasy when I fall short of them.","There is usually a right way to do things, and I want to find it.","I have a strong inner critic that comments on what I do.","I find it hard to relax until my responsibilities are done.","I get irritated when people cut corners or ignore the rules.","I keep my anger in check, but it shows up as tension or resentment.","Being fair and ethical matters more to me than being liked.","I often feel I should be doing something more useful with my time.","Making mistakes bothers me more than it seems to bother others."],"2":["I quickly sense what other people need, often before they say it.","I feel good about myself when I am needed and appreciated.","It is easier for me to give help than to ask for it.","I put a lot of energy into making people feel cared for.","I feel hurt when my efforts for others go unnoticed.","I find it hard to say no when someone needs me.","I am not always sure what I need for myself.","Warmth, closeness and affection are central to how I live.","I sometimes give more than I really want to, then feel resentful.","I like being the person others turn to."],"3":["I am driven to succeed and to be seen as capable.","I naturally adjust how I present myself to make a good impression.","I set goals and feel restless until I reach them.","Being productive and efficient is a big part of how I value myself.","I put my feelings aside when there is a job to be done.","I notice what others admire and can become that.","Failure is very hard for me to accept.","Recognition for my achievements motivates me strongly.","I sometimes wonder who I am when I am not achieving anything.","I want to be the best, or among the best, at what I do."],"4":["I often feel different from other people, as if something about me is not understood.","My emotions are intense and I spend a lot of time with them.","I long for something that seems to be missing from my life.","Authenticity and self-expression matter enormously to me.","I compare myself with others and feel I lack what they have.","I am drawn to beauty, art, meaning and depth.","Ordinary, routine life can feel flat and unsatisfying.","My moods change, and they shape what I can do on a given day.","I am sensitive to rejection and withdraw when I feel misunderstood.","Melancholy feels familiar to me, sometimes even comforting."],"5":["I need plenty of time alone to recharge and think.","I want to understand how something works before I act.","I protect my time, energy and privacy carefully.","Too many demands or social expectations quickly drain me.","I am more comfortable observing than participating.","Knowledge and competence give me a sense of security.","I keep my feelings to myself and process them later, on my own.","I can live with very little as long as I keep my independence.","I prefer to be well informed before I speak up.","I can become absorbed in a subject for hours and forget everything else."],"6":["I often think about what could go wrong and how to prepare for it.","Loyalty and trust are very important to me.","I question things and look for hidden motives.","I feel more secure with clear guidelines, a reliable group or a trusted person.","I sometimes doubt my own judgment and seek others' opinions.","I can swing between trusting and doubting the same person or authority.","Once I decide someone deserves it, I am deeply committed and responsible.","Anxiety is a frequent companion in my daily life.","When I feel afraid, I sometimes push straight into the fear to prove I can handle it.","I am alert to risks that others seem to overlook."],"7":["I love new experiences, ideas and possibilities.","I keep my options open and dislike being tied down.","When things get painful or boring, I move my attention to something more positive.","I have many plans and projects going at once.","My mind jumps quickly from one idea to the next.","I am optimistic and can find the bright side of almost anything.","Limits and restrictions frustrate me.","I get excited quickly, but my interest fades when the novelty wears off.","I plan the next fun thing while I am still enjoying the current one.","I would rather not dwell on sadness or heavy feelings."],"8":["I am direct and say what I think, even if it causes friction.","I take charge naturally when a situation needs leadership.","I hate feeling controlled or being at someone else's mercy.","I protect the people I care about fiercely.","I rarely show vulnerability or weakness.","I respect people who stand their ground and push back.","I have a lot of energy and prefer acting to waiting.","Injustice makes me angry, and I want to confront it.","I prefer to rely on myself rather than depend on others.","My intensity can be too much for some people."],"9":["Keeping peace and harmony around me is very important.","I can see everyone's point of view, sometimes more easily than my own.","I tend to go along with others to avoid conflict.","I put off important things and do easier, more comfortable things instead.","It can be hard for me to know what I really want.","I stay calm and steady when others get upset.","When pressured, I resist quietly rather than argue openly.","I like routines and familiar comforts.","I sometimes feel my presence or opinion does not matter much.","I easily take on the plans and moods of the people close to me."]},"MOT":{"1":["Deep down, I want to be good, right and act with integrity.","My deepest worry is being wrong, corrupt or bad.","My attention goes first to what needs correcting or improving."],"2":["Deep down, I want to be loved and wanted.","My deepest worry is being unwanted or unworthy of love.","My attention goes first to other people's needs and feelings."],"3":["Deep down, I want to be valuable and admired.","My deepest worry is being worthless or a failure.","My attention goes first to goals, results and how I come across."],"4":["Deep down, I want to find and express my true self.","My deepest worry is having no real identity or significance.","My attention goes first to what is missing and to my inner feelings."],"5":["Deep down, I want to be capable and to understand.","My deepest worry is being useless, helpless or overwhelmed.","My attention goes first to understanding things and protecting my resources."],"6":["Deep down, I want security and support I can rely on.","My deepest worry is being left without support or guidance.","My attention goes first to risks, doubts and who can be trusted."],"7":["Deep down, I want to be happy, free and satisfied.","My deepest worry is being trapped in pain or deprivation.","My attention goes first to exciting options and what comes next."],"8":["Deep down, I want to protect myself and be in charge of my own life.","My deepest worry is being harmed, controlled or betrayed.","My attention goes first to power: who is strong and who is in control."],"9":["Deep down, I want inner and outer peace.","My deepest worry is conflict, loss and separation.","My attention goes first to keeping things calm and everyone together."]},"INST":{"sp":["I pay close attention to my health, energy, food and sleep.","Financial and material security is a top priority for me.","I make my home comfortable and safe before anything else.","I prepare for practical needs well in advance.","When stressed, I first check whether my basic needs are covered.","I prefer a few stable routines over constant social activity."],"so":["I am very aware of where I stand in a group.","I care about my role and contribution to a community or cause.","I naturally keep track of relationships and dynamics between people.","Belonging to groups and networks is important to me.","I think about how my actions affect people beyond my close circle.","I feel uneasy when I don't know the social rules of a situation."],"sx":["I feel strong chemistry, or the lack of it, with people very quickly.","I seek deep, intense one-to-one connection.","I am drawn to whatever or whoever fascinates me, even if it is risky.","Relationships without a spark leave me unsatisfied.","I pour a lot of energy into the person or passion I am focused on.","I want to merge completely with what I love."]},"HORN":{"A":"I'm independent and assertive. I go after what I want, take the initiative and expect to make things happen.","B":"I'm quiet and reserved. I'm comfortable on my own, step back from the spotlight and live a lot in my inner world.","C":"I'm responsible and dutiful. I try to do what is expected and right, and I often put obligations before my own wishes."},"HARM":{"X":"When problems come up, I look on the bright side, stay positive and try to keep a good mood around me.","Y":"When problems come up, I react strongly. I need others to see how I feel, and I want honest, emotional responses.","Z":"When problems come up, I set feelings aside, stay logical and focus on solving the problem competently."},"LEVEL":{"1":{"h":["I accepted imperfection, my own and others', with calm.","I felt balanced and could let things be."],"a":["I felt tense trying to keep everything correct and under control.","I was critical or impatient with people who did things differently."],"u":["I felt resentment and harsh judgment that I could not switch off.","My inner critic was relentless and I felt rigid and angry inside."]},"2":{"h":["I gave freely, without expecting anything back.","I took good care of my own needs as well."],"a":["I tried hard to please people or to be indispensable to them.","I felt unappreciated for all I do for others."],"u":["I felt others owed me, and I used guilt or pressure to get care.","I felt used and drained, yet couldn't stop over-giving."]},"3":{"h":["I felt genuinely myself, without needing to impress anyone.","I enjoyed my work for its own sake and shared credit generously."],"a":["I worried a lot about how I looked to others or about my status.","I pushed myself to perform and felt restless when I wasn't achieving."],"u":["I felt empty behind my image and avoided facing it.","I bent the truth or cut corners to keep up appearances."]},"4":{"h":["My feelings flowed into creative or meaningful action.","I felt at ease with who I am and connected to ordinary life."],"a":["I spent a lot of time in moods, fantasies or longing.","I felt different, misunderstood or envious of others."],"u":["I felt worthless and pulled away from people completely.","Heavy feelings of despair or self-contempt dominated my days."]},"5":{"h":["I engaged with the world with curiosity and confidence.","I shared what I know and felt part of things."],"a":["I withdrew to my own space and kept people at a distance.","I spent more time thinking and planning than acting."],"u":["I cut myself off and felt the world was intrusive or hostile.","I neglected sleep, food or contact while absorbed in my head."]},"6":{"h":["I trusted myself and acted with courage.","I felt steady and could relax with people."],"a":["I worried and ran through 'what if' scenarios.","I swung between seeking reassurance and resisting authority."],"u":["I felt anxious and suspicious, as if people were against me.","Fear made me lash out or freeze, and I couldn't calm down."]},"7":{"h":["I felt deeply satisfied and grateful for what I have.","I could stay with one thing, and with difficult feelings."],"a":["I kept myself busy and jumped between activities and plans.","I avoided uncomfortable feelings by planning the next thing."],"u":["I felt impulsive and scattered, and things got out of hand.","I tried to escape pain through excess (spending, partying, substances)."]},"8":{"h":["I used my strength to protect and support others, with a soft heart.","I could show vulnerability and let others help me."],"a":["I pushed and pressured people to get things done.","I felt I had to stay in control so no one could take advantage of me."],"u":["I felt others were against me and I wanted to retaliate.","I used intimidation or threats, and felt I could trust no one."]},"9":{"h":["I felt present and engaged, and spoke up for what I want.","I took action on what really matters to me."],"a":["I went along with others and avoided conflict.","I put off important things and numbed out with routines or distractions."],"u":["I felt disconnected, as if life was passing me by.","I stubbornly shut down and refused to deal with problems."]}},"LEVEL_GEN":{"h":["Overall I felt calm and present."],"a":["I reacted automatically, as if on autopilot."],"u":["I felt overwhelmed or close to breaking point."]},"DIR":{"1":{"g":["I let myself enjoy life spontaneously and have fun.","I felt lighter and less weighed down by 'shoulds'."],"s":["I felt moody, misunderstood and sorry for myself.","I wanted to escape my responsibilities."]},"2":{"g":["I got in touch with my own feelings and needs honestly.","I spent time on my own creative or personal interests."],"s":["I became demanding or aggressive when people didn't respond.","I tried to control others to get what I felt I deserved."]},"3":{"g":["I committed to a team or cause beyond my own success.","I let people see my real feelings and doubts."],"s":["I felt numb, unmotivated and disengaged.","I drifted, procrastinated and lost my usual drive."]},"4":{"g":["I acted on my principles in a disciplined, objective way.","I followed through on practical work even when I wasn't in the mood."],"s":["I clung to people and needed to feel needed.","I got over-involved in others' lives to feel close."]},"5":{"g":["I acted decisively and trusted my own capacity.","I felt grounded in my body and confident in the world."],"s":["I scattered my attention across many distractions.","I felt restless and hyper, jumping between things."]},"6":{"g":["I felt relaxed, trusting and at peace.","I accepted things as they are without overthinking."],"s":["I tried to impress people or prove my worth through performance.","I became competitive and focused on my image."]},"7":{"g":["I went deep into one subject with quiet focus.","I enjoyed stillness and time alone to reflect."],"s":["I became critical, impatient and perfectionistic.","I lectured others about the right way to do things."]},"8":{"g":["I showed tenderness and cared for others openly.","I let my heart guide me rather than my need for control."],"s":["I withdrew, became secretive and kept my cards close.","I retreated into thinking and planning instead of acting."]},"9":{"g":["I set goals and invested energy in myself.","I took initiative and felt energized and productive."],"s":["I felt anxious, worried and suspicious.","I sought reassurance and felt unsure about decisions."]}},"FIG_OPTS":["My mother","My father","Both parents","Another person (grandparent, sibling, carer)","No one really"],"REL_OPTS":[["Attachment","I felt close and tried to be what they wanted."],["Frustration","They were there, but I didn't get enough of what I needed."],["Rejection","I didn't feel wanted for who I was, so I kept my distance or tried to earn their love."]],"CONF_LABEL":{"High":"Clear lead","Moderate":"Likely","Low":"Close call"},"DEEP":{"1":{"world":"You experience life as something to be improved. Your attention goes automatically to the gap between how things are and how they should be, and you feel personally responsible for closing it. Underneath is a wish to be good and beyond criticism.","gifts":"Integrity, discernment and reliability. You keep your word, notice what others miss and work hard to make things right. At your best you are wise and fair, a moral compass people trust.","blind":"Your inner critic rarely switches off. Anger you consider “not nice” gets held in and leaks out as resentment, rigidity or a correcting tone. You may confuse your own standards with objective truth.","rel":"In relationships you are loyal and dependable, but people close to you can feel judged. At work you raise quality and fairness; the risk is micromanaging because “it won’t be done right”."},"2":{"world":"You experience life through relationships. You sense what others feel and need almost instantly and move toward them. Underneath is a wish to be loved, and a belief that love has to be earned by being helpful.","gifts":"Warmth, generosity and emotional intelligence. You make people feel seen and cared for, and you build bridges between them. At your best you love freely, without keeping score.","blind":"Your own needs disappear from view, then come back as hurt or resentment when your care isn’t returned. Pride shows up as “I don’t need anything”. Helping can turn into quiet control.","rel":"In relationships you are devoted and attentive, but may give in order to receive. At work you are the heart of the team; the risk is saying yes to everything and burning out."},"3":{"world":"You experience life as a series of goals. You read what is valued around you and become good at it, fast. Underneath is a wish to be valuable, and a fear that without achievements you would be worth nothing.","gifts":"Energy, adaptability and the ability to get things done. You motivate others, present ideas brilliantly and turn plans into results. At your best you are authentic, and your success inspires others to grow.","blind":"You can lose contact with your own feelings behind the role you perform. Efficiency crowds out depth, and the image can start to feel more real than the person.","rel":"In relationships you are attentive and fun, but may stay busy instead of being intimate. At work you are a natural performer and leader; the risk is overwork and measuring your worth only by results."},"4":{"world":"You experience life through feeling and meaning. You are tuned to what is missing, what is beautiful and what is real. Underneath is a wish to find your true self, and a sense that something essential in you is absent.","gifts":"Depth, creativity and emotional honesty. You can stay with pain without looking away, and you help others feel understood. At your best you turn experience into art and compassion.","blind":"Envy and comparison make other lives look fuller. You may hold on to moods and withdraw when misunderstood, waiting to be found rather than reaching out.","rel":"In relationships you long for deep connection and can swing between idealizing and pulling away. At work you bring originality and meaning; the risk is waiting for the right mood before acting."},"5":{"world":"You experience life from the observer’s seat. You need to understand before you engage, and you guard your time and energy against intrusion. Underneath is a wish to be capable, and a fear of being overwhelmed or useless.","gifts":"Insight, objectivity and independent thinking. You see patterns others miss and stay calm in a crisis. At your best you are a visionary who shares knowledge generously.","blind":"You can live in your head, at a distance from your body, feelings and people. Holding back time, energy and emotion can leave you preparing for a life you don’t quite enter.","rel":"In relationships you are loyal and respect boundaries, but can seem detached. At work you are the expert and strategist; the risk is withdrawing and over-preparing instead of acting."},"6":{"world":"You experience life as something to prepare for. You scan for risks, test who and what can be trusted, and look for solid ground. Underneath is a wish for security and support, and a fear of being left without it.","gifts":"Loyalty, responsibility and foresight. You are a committed friend and team member and spot problems before they happen. At your best you are courageous and steady, a source of trust for others.","blind":"Doubt and worry can run your thinking. You may swing between seeking reassurance and rebelling against authority. Some Sixes face fear head-on, which can look like boldness rather than anxiety.","rel":"In relationships you are deeply committed and protective, but may test trust again and again. At work you are reliable and a great troubleshooter; the risk is overthinking and expecting the worst."},"7":{"world":"You experience life as full of possibilities. Your mind moves fast, connecting ideas and planning the next good experience. Underneath is a wish to be satisfied, and a fear of being trapped in pain or deprivation.","gifts":"Optimism, curiosity and versatility. You bring energy, humour and new ideas, and you lift people’s spirits. At your best you are grounded and grateful, and your joy is deep rather than restless.","blind":"You may escape discomfort by staying busy, reframing everything positively or jumping to the next plan. Commitment and depth suffer, and difficult feelings stay unprocessed.","rel":"In relationships you are fun and generous, but may avoid heavy conversations. At work you are a visionary and networker; the risk is starting many things and finishing few."},"8":{"world":"You experience life as a test of strength. You read who holds power, protect your territory and act directly. Underneath is a wish to protect yourself and stay in control, and a fear of being harmed or controlled.","gifts":"Courage, decisiveness and protectiveness. You stand up for the vulnerable, take charge in a crisis and say what others won’t. At your best you are big-hearted and use your strength to empower others.","blind":"You may hide vulnerability behind toughness, push too hard and treat softness as weakness. Your intensity can overwhelm people, and you can confuse control with safety.","rel":"In relationships you are loyal and protective, but may dominate and find tenderness hard to show. At work you are a natural leader who gets things moving; the risk is steamrolling and trusting no one."},"9":{"world":"You experience life through a wish for harmony. You see every side, blend with the people and routines around you, and smooth out conflict. Underneath is a wish for peace, and a fear of loss and separation.","gifts":"Acceptance, patience and a calming presence. You mediate, include everyone and put people at ease. At your best you are fully present and act strongly on what matters.","blind":"You may forget yourself: your priorities, your opinions, your anger. Procrastination and comfortable routines keep things calm, and resistance comes out as quiet stubbornness.","rel":"In relationships you are easygoing and supportive, but may go along rather than show up. At work you are a great team builder; the risk is avoiding decisions until problems grow."}},"WING_LONG":{"1w9":"The Nine wing softens your intensity and adds detachment. You hold principles quietly, prefer reason to confrontation and can seem cool or philosophical. Anger is held in even more. You fight for ideals more than for people, and may retreat into order and solitude when frustrated.","1w2":"The Two wing adds warmth and people-energy. You apply your principles to helping others and want to improve their lives directly. You are more expressive, persuasive and action-oriented than a 1w9, and more likely to voice criticism. The risk is moralizing and feeling unappreciated.","2w1":"The One wing adds conscience and restraint. You help out of duty and a sense of what is right, often quietly and behind the scenes. You are more serious and self-critical than a 2w3, and may find it hard to admit your own needs because they feel selfish.","2w3":"The Three wing adds ambition and social polish. You connect easily, enjoy being liked and make people feel special. You are more image-aware and energetic than a 2w1. The risk is seeking approval through charm and feeling hurt when you’re not the favorite.","3w2":"The Two wing adds warmth. You succeed through relationships, inspire people and want to be liked as well as effective. You read a room effortlessly. The risk is shaping yourself to please and confusing being admired with being loved.","3w4":"The Four wing adds depth and a wish for authenticity. You want your success to mean something and to reflect who you really are. You are more private and serious than a 3w2, and can be self-critical when your image and inner feelings don’t match.","4w3":"The Three wing adds drive and social awareness. You want your uniqueness to be seen and appreciated, and you can turn feeling into polished, public work. The risk is comparing yourself with others’ success and swinging between pride and shame.","4w5":"The Five wing adds intellect and privacy. You explore your inner world through ideas, art or spirituality and need a lot of solitude. You are quieter and more unconventional than a 4w3, and can become withdrawn when hurt.","5w4":"The Four wing adds feeling and imagination. You combine sharp observation with an artistic, sometimes unusual inner world. You are more emotional and individualistic than a 5w6. The risk is living in private worlds others can’t reach.","5w6":"The Six wing adds practicality and loyalty. You like systems and evidence and apply knowledge to real problems, often within a team you trust. You are more sceptical and organized than a 5w4. The risk is anxiety and over-preparing before you act.","6w5":"The Five wing adds independence and seriousness. You rely on knowledge and analysis to feel secure and are loyal to causes and principles. You are more reserved and self-reliant than a 6w7, and can become suspicious or rigid under stress.","6w7":"The Seven wing adds sociability and humour. You find reassurance in people and activity, and you are warm, engaging and supportive. You are more outgoing than a 6w5. The risk is seeking constant reassurance and avoiding anxiety by staying busy.","7w6":"The Six wing adds warmth and commitment. You are playful and funny and love bringing people together, with a slightly anxious undertone. You are more relationship-focused than a 7w8. The risk is scattered energy despite your loyalty.","7w8":"The Eight wing adds force and practicality. You go after what you want, make things happen and enjoy power and material success. You are more driven and direct than a 7w6. The risk is impatience, excess and running over people on the way to the next thing.","8w7":"The Seven wing adds speed, appetite and enthusiasm. You are expansive, adventurous and entrepreneurial, chasing big goals with high energy and enjoying the ride. You are more outgoing, impulsive and risk-taking than an 8w9. The risk is excess, impatience and blowing past other people’s limits.","8w9":"The Nine wing adds steadiness and patience. You are protective, grounded and slower to anger, with a quiet authority people trust. You are more receptive and family-oriented than an 8w7, but when your anger does come, it can be immovable.","9w8":"The Eight wing adds assertiveness and earthiness. You are practical, sociable and able to be firm when pushed. You are more direct than a 9w1. The risk is swinging between going along and stubborn outbursts.","9w1":"The One wing adds principles and structure. You are kind, conscientious and drawn to meaning and calm routines. You are more reserved and self-controlled than a 9w8. The risk is swallowing anger and retreating into an idealized inner calm."},"SUB_LONG":{"1":{"sp":"The practical perfectionist. Your drive to get things right goes into security, health, money and order. Warm underneath, but you can worry and control the details.","so":"The crusader. You channel your standards into the group: rules, institutions and causes. A natural teacher and role model; the risk is rigidity and feeling superior.","sx":"The reformer of the one you love. Your ideals focus on your closest relationships; you want the people you love to live up to their best, and can be zealous about it."},"2":{"sp":"The nurturer who also needs care. You help in practical ways and can be more shy and charming than other Twos; you quietly hope to be looked after in return.","so":"The ambassador. You give to groups and influential people and enjoy being at the center of the network. The risk is giving to gain position and admiration.","sx":"The devoted lover. You seek intense closeness with special people and pour yourself into winning and keeping them. The risk is possessiveness and losing yourself."},"3":{"sp":"The workaholic. You seek security through hard work and competence and are less flashy than other Threes: you want to be good, not just look good. The risk is never stopping.","so":"The status seeker. You want recognition and prestige in your group and know exactly what success looks like there. The risk is valuing titles over substance.","sx":"The charismatic one. You put your energy into being attractive and supporting a special person or team. The risk is losing yourself in being desired."},"4":{"sp":"The resilient one. You endure pain quietly and turn it into strength and creativity without dramatizing it. The risk is pushing yourself too hard.","so":"The outsider. You compare yourself with others and feel you don’t quite belong, which brings shame and sensitivity. Deeply empathic; the risk is getting stuck in suffering.","sx":"The intense competitor. Envy turns outward: you want to be seen and can be passionate, demanding and competitive in close relationships."},"5":{"sp":"The castle builder. You guard privacy and boundaries, keep needs minimal and secure a safe retreat. The risk is isolation.","so":"The specialist. You find belonging through knowledge and ideals and connect with people who share your field. The risk is living through ideas instead of experience.","sx":"The confidant. Behind your reserve is a search for one person you can fully trust with your inner world. The risk is all-or-nothing intimacy."},"6":{"sp":"The warm one. You seek safety through home, family and trusted allies; friendly, careful and protective. The risk is anxiety and dependency.","so":"The dutiful one. You find security in rules, roles and the group’s guidelines; loyal and responsible. The risk is over-relying on authority.","sx":"The strong one. You meet fear head-on by being bold and even intimidating (counterphobic). The risk is provoking danger to prove you’re not afraid."},"7":{"sp":"The gourmet. You secure pleasures, comforts and opportunities through networks and smart planning. The risk is self-interest and excess.","so":"The sacrificer. You give up some of your own pleasure to serve a group or ideal. Idealistic and caring; the risk is hidden resentment.","sx":"The adventurer. You are fascinated by new people, ideas and romance and see the world through rose-colored glasses. The risk is restlessness."},"8":{"sp":"The survivor. You secure what you and yours need, directly and without fuss. The risk is treating life as a fight for territory.","so":"The group leader. You protect and champion your team or community and fight injustice. The risk is controlling the group you protect.","sx":"The commander. You want total connection and loyalty and bring intense passion to relationships. The risk is dominance."},"9":{"sp":"The comfort seeker. You find peace in routines, food, hobbies and small pleasures. The risk is numbing out.","so":"The participant. You blend into groups, work hard for them and keep everyone together. The risk is losing your own agenda.","sx":"The merger. You find identity through union with one person and take on their interests and moods. The risk is disappearing into the other."}},"LVL":{"1":[["The Wise Realist","acceptance"],["The Reasonable Person","conscience and honesty"],["The Principled Teacher","responsibility"],["The Idealistic Reformer","idealism"],["The Orderly Person","rigidity"],["The Judgmental Perfectionist","perfectionism"],["The Intolerant Misanthrope","intolerance"],["The Obsessive Hypocrite","obsession"],["The Punitive Avenger","punishment"]],"2":[["The Disinterested Altruist","unconditional love"],["The Caring Person","empathy"],["The Nurturing Helper","generosity"],["The Effusive Friend","people-pleasing"],["The Possessive Intimate","intrusiveness"],["The Self-Important Saint","self-sacrifice"],["The Self-Serving Manipulator","manipulation"],["The Coercive Dominator","coercion"],["The Psychosomatic Victim","victimhood"]],"3":[["The Authentic Person","inner direction"],["The Self-Assured Person","adaptability"],["The Outstanding Paragon","excellence"],["The Competitive Status-Seeker","drive to perform"],["The Image-Conscious Pragmatist","image"],["The Self-Promoting Narcissist","competition"],["The Dishonest Opportunist","deception"],["The Malicious Deceiver","exploitation"],["The Vindictive Saboteur","vindictiveness"]],"4":[["The Inspired Creator","embracing life"],["The Self-Aware Intuitive","sensitivity"],["The Self-Revealing Individual","creativity"],["The Imaginative Aesthete","fantasy"],["The Self-Absorbed Romantic","moodiness"],["The Self-Indulgent Exception","self-indulgence"],["The Alienated Depressive","alienation"],["The Emotionally Tormented","self-hatred"],["The Self-Destructive","self-destruction"]],"5":[["The Pioneering Visionary","understanding"],["The Perceptive Observer","curiosity"],["The Focused Innovator","innovation"],["The Studious Expert","conceptualizing"],["The Intense Conceptualizer","preoccupation with ideas"],["The Provocative Cynic","provocation"],["The Isolated Nihilist","emptiness"],["The Terrified Alien","delusion"],["The Imploding Recluse","self-erasure"]],"6":[["The Valiant Hero","faith in oneself"],["The Engaging Friend","warmth and charm"],["The Committed Worker","cooperation"],["The Dutiful Loyalist","self-doubt"],["The Ambivalent Pessimist","defensiveness"],["The Authoritarian Rebel","blaming"],["The Overreacting Dependent","inferiority"],["The Paranoid Hysteric","paranoia"],["The Self-Defeating Masochist","self-defeat"]],"7":[["The Ecstatic Appreciator","gratitude"],["The Free-Spirited Optimist","enthusiasm"],["The Accomplished Generalist","productivity"],["The Experienced Sophisticate","acquisitiveness"],["The Hyperactive Extrovert","impulsiveness"],["The Excessive Hedonist","excess"],["The Impulsive Escapist","dissipation"],["The Manic Compulsive","compulsion"],["The Panic-Stricken","panic"]],"8":[["The Magnanimous Heart","compassion"],["The Self-Confident Person","strength"],["The Constructive Leader","protection"],["The Enterprising Adventurer","pragmatism"],["The Dominating Power Broker","pressure and control"],["The Confrontational Adversary","combativeness"],["The Ruthless Outlaw","ruthlessness"],["The Omnipotent Megalomaniac","rage"],["The Violent Destroyer","destructiveness"]],"9":[["The Self-Possessed Guide","personal freedom"],["The Receptive Person","wholeness"],["The Supportive Peacemaker","acceptance"],["The Accommodating Role-Player","self-effacement"],["The Disengaged Participant","passivity"],["The Resigned Fatalist","fatalism"],["The Denying Doormat","neglect"],["The Dissociating Automaton","dissociation"],["The Self-Abandoning Ghost","self-abandonment"]]},"L1TXT":{"1":"Wise, accepting and serene. You know right from wrong without condemning anyone, and hold your principles with warmth and humility.","2":"Unconditionally loving and humble. You give freely, delight in others’ good and take care of yourself as well.","3":"Authentic and self-accepting. You no longer need admiration; your worth is simply there, and your achievements serve something larger.","4":"Inspired and at peace with life. Feelings are honest but no longer define you; you turn experience into something that touches others.","5":"A clear-sighted visionary. Fully engaged with the world, you see how things truly are and share it freely.","6":"Courageous and self-trusting. Grounded in inner faith, you are loyal and steady without needing outside guarantees.","7":"Deeply grateful and joyful. Fully present, you savor what is here instead of chasing what comes next.","8":"Magnanimous and big-hearted. Your strength serves others; you can be gentle, vulnerable and let go of control.","9":"Fully present and self-possessed. Peaceful yet engaged, you act strongly on what matters and remember yourself."},"L1WIS":{"1":"acceptance","2":"self-love","3":"being yourself","4":"forgiveness","5":"understanding","6":"courage","7":"gratitude","8":"surrender","9":"self-remembering"},"L9TXT":{"1":"Self-righteous and punishing: consumed by others’ wrongs and capable of harsh punishment, of others or of oneself.","2":"Feeling like a victim, with distress showing up in the body; love has become a claim on others.","3":"Vindictive toward anyone who exposes the gap behind the image; appearances protected at any cost.","4":"Overwhelmed by self-hatred and despair, turned completely against oneself.","5":"Cut off from reality and people, collapsing inward into emptiness.","6":"Paranoid and self-defeating; fear has turned into self-sabotage.","7":"Escape no longer works; panic and collapse take over.","8":"Destructive rage: ready to tear everything down rather than be controlled.","9":"Dissociated and self-abandoned, absent from one’s own life."},"BANDS":[["Healthy","1–3","Free and present. The type’s gifts flow: liberation (1), deep inner capacity (2), real contribution to others (3)."],["Average","4–6","Where most of us live most of the time. The ego takes over: fixation and imbalance (4), managing and controlling others (5), overcompensation and exaggeration (6)."],["Unhealthy","7–9","Acute or chronic stress: survival mode (7), obsession and delusion (8), destructive collapse (9). Usually needs outside support."]],"S":{"langName":"English","langLabel":"Language","footer":"A map for self-reflection, not a psychological diagnosis.","steps":["Start","Core type","Self-description","Tie-breakers","Wing","Instincts","Right now","Direction","Family (optional)","Your result"],"stepOf":"Step {n} of {m}","next":"Continue","back":"Back","start":"Start the test","seeResult":"See my result","choose":"Choose…","introEyebrow":"Pilot version","introTitle":"Discover your type, and where you are with it today","introText":"This test looks at more than your type. It also estimates your wing, your instinctual focus, how you are doing right now, the direction you are moving in, and how your early family life may have shaped you. At the end you get a personal profile with first steps.","introList":["About 20 minutes. Answer honestly and quickly; there are no right answers.","The first parts ask how you have been <b>for most of your adult life</b>. Later parts ask about <b>the last 4 weeks</b>.","At the end you enter your email address and your profile is sent to you. Your answers about your family never leave your device.","This is a tool for self-reflection, not a diagnosis."],"nameLabel":"Your first name or a nickname (optional)","consent":"I understand this is a pilot for self-reflection, not a psychological assessment.","p1Prompt":"How true has this been of you for most of your adult life?","lik":["Not at all","A little","Somewhat","Mostly","Very much"],"freq":["Never","Rarely","Sometimes","Often","Very often"],"groupTitle":"Which description fits you best?","groupSub":"Pick the one that is most true over your life, even if none fits perfectly.","groupTitle2":"And how do you usually handle problems?","tieTitle":"Which is closer to you?","tieSub":"These pairs help separate your strongest candidates. Choose the statement that is more true deep down, even if both apply.","wingTitle":"One more nuance","wingSub":"People with your leading pattern usually lean toward one of two flavors. Which sounds more like you?","instPrompt":"Where does your energy naturally go first?","nowTitle":"How have you been in the last 4 weeks?","nowSub":"This part looks at your current state, which changes over time.","dirTitle":"In the last 4 weeks, how often…","famTitle":"Your early family (optional)","famSub":"These questions help connect your pattern to your childhood. Your answers stay on this screen only; they are never sent to anyone. Skip anything you prefer not to answer.","famQ1":"Growing up, who mostly gave you comfort, warmth and care?","famQ2":"Who mostly gave you structure, protection and guidance?","famRel":"With that person, which feels closest?","famNote":"If these questions bring up something painful, it's fine to stop here and skip. Talking to someone you trust, or a professional, can help.","readMore":"Read more","profYour":"Your Enneagram 360 profile","profNamed":"{name}'s Enneagram 360 profile","fTypeWing":"Type + wing","fInst":"Instincts","fNow":"Right now","fSure":"How sure","levelBand":"Level {l} · {band}","bandNames":{"Healthy":"Healthy","Average":"Average","Unhealthy":"Unhealthy"},"bandLower":{"Healthy":"healthy","Average":"average","Unhealthy":"unhealthy"},"gridNote":"Your two self-descriptions pointed to type {g}, while your detailed answers point to {t}. Worth reading both.","moreType":"Read more about type {t}","hWorld":"How you see the world","hGifts":"Your gifts","hBlind":"Your blind spots","hRel":"In relationships and at work","kDesire":"Basic desire","kFear":"Basic fear","kPassion":"Passion","kVirtue":"Virtue to grow into","m360Eyebrow":"The 360 model","m360Title":"Your position in three dimensions","m360Text":"Most tests stop at the circle. Enneagram 360 reads you in three dimensions: <b>which pattern</b> (your type on the symbol), <b>how deep</b> (your level, the layers from free at the top to stuck at the bottom), and <b>where you are moving</b> (growth or stress). Your pillar stands on point {t}; the glowing ring marks level {l}.","more3d":"Why levels make it 3D","m3dP1":"The symbol alone is flat: it tells you which of nine patterns you live in. The levels add depth. Two people of the same type can look completely different depending on their level: a healthy Eight is a big-hearted protector, an unhealthy Eight is a bully. Same type, different floor.","m3dP2":"Levels measure how present and free we are. The lower we go, the more we identify with the ego's automatic habits and the less choice we have. Levels move during a day and over the years, and conscious practice moves you up. That is why your result is a <b>position</b>, not a label.","legFree":"freest","legStuck":"most stuck","legYou":"you","wingEyebrow":"Your wing","wingStrength":"wing strength {s}","wingStr":{"strong":"strong","moderate":"moderate","light":"light"},"moreWing":"Read more about {wt}","wingP1":"Your core type is {t}. The wing is one of its two neighbors on the circle, {a} or {b}, and it colors how your type shows up. It doesn't change your core motive; it changes the style.","wingOther":"The other wing would be {ow}: {txt}","moveEyebrow":"Movement","moveTitle":"Where you go in growth and under stress","keyGrowth":"Growth → {g}","keyStress":"Stress → {s}","dirGrowth":"Right now you lean toward <b class=\"gcol\">growth</b>: you are borrowing the healthy qualities of {g}.","dirStress":"Right now you lean toward <b class=\"scol\">stress</b>: you are sliding into the average habits of {s}.","dirMixed":"Right now you show signs of <b>both</b> directions.","moreMove":"Read more about your arrows","moveP1":"Every type has two arrows. When you feel secure and growing, you naturally take on the <b class=\"gcol\">healthy</b> qualities of one type; under pressure you act out the <b class=\"scol\">average</b> habits of another. You don't become that type; you borrow from it.","boxGrowth":"Growth: {t} → {g}","boxStress":"Stress: {t} → {s}","moveKenan":"Kenan Kolday's rule of thumb: moving toward stress is a way of letting off pressure, like a pressure cooker. It gives temporary relief but doesn't solve anything. Growth is a choice you make again and again.","lvEyebrow":"Right now","lvTitle":"Level {l}: {role}","lvText":"Your answers for the last 4 weeks place you at level {l}
