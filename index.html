t.","flag":"„Meine Aktivitäten bringen mir nur Schmerz und Unglück.“","grace":"„Ich habe Erfahrung.“","growth":"Richtung gesunde Fünf: Du gehst in die Tiefe, konzentrierst dich und genießt die Stille.","stress":"Richtung durchschnittliche Eins: Du wirst kritisch, ungeduldig und perfektionistisch.","levels":{"h":"Dankbar, freudig, fokussiert, tief erfüllt.","a":"Beschäftigt, abgelenkt, plant immer schon das Nächste.","u":"Impulsiv, maßlos, flieht um jeden Preis vor dem Schmerz."},"actions":["Bleib fünf Minuten bei einem unangenehmen Gefühl, ohne es zu reparieren oder zu fliehen.","Beende ein angefangenes Projekt, bevor du ein neues beginnst.","Schreib jeden Abend drei Dinge auf, für die du heute dankbar bist."]},"8":{"name":"Der Herausforderer","tag":"Selbstbewusst, entschlossen, beschützend","summary":"Dich treibt der Wunsch an, dich zu schützen und die Kontrolle über dein Leben zu behalten. Du bist stark, direkt und bereit zu handeln. Darunter liegt eine zarte Seite, die du selten zeigst.","desire":"Sich zu schützen und den eigenen Weg zu bestimmen","fear":"Verletzt, kontrolliert oder verraten zu werden","passion":"Wollust (Intensität)","fixation":"Rache","virtue":"Unschuld","idea":"Heilige Wahrheit","childMsg":"„Es ist nicht in Ordnung, verletzlich zu sein oder jemandem zu vertrauen.“","lostMsg":"„Du wirst nicht verraten.“","figure":"der nährenden Bezugsperson","rel":"Ablehnung","famNote":"Zärtlichkeit und Vertrauen kamen nicht von der nährenden Bezugsperson; das Kind schloss, dass Verletzlichkeit gefährlich ist, und übernahm selbst die Rolle des Beschützers.","wake":"Das Gefühl, drücken und kämpfen zu müssen, damit etwas passiert.","flag":"„Die Leute wenden sich gegen mich; sie werden sich rächen.“","grace":"„Ich habe die Kraft, es zu tun.“","growth":"Richtung gesunde Zwei: Du nutzt deine Stärke, um für andere zu sorgen, und lässt dein Herz führen.","stress":"Richtung durchschnittliche Fünf: Du ziehst dich zurück, wirst verschlossen und planst, statt zu handeln.","levels":{"h":"Großherzig, beschützend, stark und weichherzig.","a":"Dominierend, drängend, braucht Kontrolle.","u":"Rücksichtslos, einschüchternd, vertraut niemandem."},"actions":["Bitte diese Woche einmal um Hilfe und nimm sie an, ohne die Führung zu übernehmen.","Wenn du den Drang zu drücken spürst, halte drei Atemzüge inne und frage, was du gerade schützt.","Zeig einem Menschen deine weichere Seite: Sag ihm, was er dir bedeutet."]},"9":{"name":"Der Friedensstifter","tag":"Empfänglich, beruhigend, bequem","summary":"Dich treibt der Wunsch nach innerem und äußerem Frieden an. Du siehst alle Seiten, beruhigst andere und hältst Dinge zusammen. Die Gefahr ist, dich selbst und deine eigene Stimme zu vergessen.","desire":"Innere Stabilität und Seelenfrieden","fear":"Verlust, Trennung und Konflikt","passion":"Trägheit (Selbstvergessenheit)","fixation":"Bequemlichkeit","virtue":"Rechtes Handeln","idea":"Heilige Liebe","childMsg":"„Es ist nicht in Ordnung, dich durchzusetzen.“","lostMsg":"„Deine Anwesenheit zählt.“","figure":"beiden Elternteilen","rel":"Bindung","famNote":"Das Kind war an beide Eltern gebunden und machte sich unsichtbar, um den Frieden zu bewahren.","wake":"Sich anderen anpassen, um den Frieden zu wahren.","flag":"„Sie werden mich zwingen, mich der Realität zu stellen und meine Probleme zu lösen.“","grace":"„Ich kann mich anpassen.“","growth":"Richtung gesunde Drei: Du investierst Energie in dich selbst, setzt Ziele und handelst.","stress":"Richtung durchschnittliche Sechs: Du wirst ängstlich, besorgt und reaktiv.","levels":{"h":"Präsent, geerdet, ein echter Friedensstifter, der auch seine Stimme erhebt.","a":"Anpassend, ausweichend, betäubt sich mit Routinen.","u":"Abgekoppelt, stur verschlossen, sich selbst verloren."},"actions":["Benenne jeden Morgen eine Sache, die du heute für dich willst.","Sag diese Woche einmal freundlich und klar „Ich sehe das anders“.","Erledige die wichtigste Aufgabe zuerst, vor den bequemen."]}},"WINGS":{"1w9":"Ruhig, idealistisch und zurückhaltend; Prinzipien werden still gelebt.","1w2":"Ein warmherziger, überzeugender Fürsprecher, der seine Prinzipien nutzt, um Menschen zu helfen.","2w1":"Dienstorientiert und pflichtbewusst; hilft leise und gewissenhaft.","2w3":"Kontaktfreudig und charmant; ein großzügiger, sichtbarer Gastgeber.","3w2":"Gewinnend und charmant; Erfolg durch Beziehungen.","3w4":"Professionell, fokussiert und privater; Erfolg durch exzellente Arbeit.","4w3":"Ausdrucksstark, ehrgeizig und imagebewusst.","4w5":"Introspektiv, unkonventionell und zurückgezogen.","5w4":"Fantasievoll, unabhängig, ein künstlerischer Denker.","5w6":"Analytisch und praktisch; ein Problemlöser, der Systeme schätzt.","6w5":"Vorsichtig, wissbegierig und unabhängig.","6w7":"Freundlich und verspielt; findet Sicherheit in Gesellschaft.","7w6":"Gesellig, loyal und lebensfroh.","7w8":"Mutig, praktisch und durchsetzungsstark.","8w7":"Ein unabhängiger Freigeist: schnell, raumgreifend, abenteuerlustig.","8w9":"Ruhige Stärke: gelassen, beschützend, langsam im Zorn.","9w8":"Geerdet und entspannt, kann aber fest bleiben.","9w1":"Sanft, ordentlich und idealistisch."},"INST_NAME":{"sp":"Selbsterhaltung","so":"Sozial","sx":"Eins-zu-eins"},"ITEMS":{"1":["Ich bemerke sofort, wenn etwas nicht richtig gemacht wird.","Ich setze mir hohe Maßstäbe und fühle mich unwohl, wenn ich sie nicht erreiche.","Meistens gibt es einen richtigen Weg, etwas zu tun, und ich will ihn finden.","Ich habe einen starken inneren Kritiker, der kommentiert, was ich tue.","Ich kann schwer entspannen, bevor meine Pflichten erledigt sind.","Es ärgert mich, wenn Leute schlampen oder Regeln missachten.","Ich halte meinen Ärger im Zaum, aber er zeigt sich als Anspannung oder Groll.","Fair und ethisch zu sein ist mir wichtiger, als gemocht zu werden.","Oft habe ich das Gefühl, ich sollte meine Zeit sinnvoller nutzen.","Fehler zu machen stört mich mehr, als es andere zu stören scheint."],"2":["Ich spüre schnell, was andere brauchen, oft bevor sie es sagen.","Ich fühle mich gut, wenn ich gebraucht und geschätzt werde.","Es fällt mir leichter, Hilfe zu geben, als um Hilfe zu bitten.","Ich stecke viel Energie hinein, dass Menschen sich umsorgt fühlen.","Es verletzt mich, wenn mein Einsatz für andere unbemerkt bleibt.","Es fällt mir schwer, Nein zu sagen, wenn mich jemand braucht.","Ich bin mir nicht immer sicher, was ich selbst brauche.","Wärme, Nähe und Zuneigung stehen im Zentrum meines Lebens.","Manchmal gebe ich mehr, als ich eigentlich will, und bin dann gekränkt.","Ich mag es, die Person zu sein, an die sich andere wenden."],"3":["Ich will unbedingt erfolgreich sein und als fähig gelten.","Ich passe ganz natürlich an, wie ich mich präsentiere, um einen guten Eindruck zu machen.","Ich setze mir Ziele und bin unruhig, bis ich sie erreiche.","Produktiv und effizient zu sein ist ein großer Teil meines Selbstwerts.","Wenn eine Aufgabe ansteht, stelle ich meine Gefühle zurück.","Ich merke, was andere bewundern, und kann genau das werden.","Misserfolg zu akzeptieren fällt mir sehr schwer.","Anerkennung für meine Leistungen motiviert mich stark.","Manchmal frage ich mich, wer ich bin, wenn ich gerade nichts leiste.","Ich will in dem, was ich tue, der oder die Beste sein, oder zumindest unter den Besten."],"4":["Ich fühle mich oft anders als andere, als ob etwas an mir nicht verstanden wird.","Meine Gefühle sind intensiv, und ich verbringe viel Zeit mit ihnen.","Ich sehne mich nach etwas, das in meinem Leben zu fehlen scheint.","Echtheit und Selbstausdruck sind mir enorm wichtig.","Ich vergleiche mich mit anderen und habe das Gefühl, mir fehlt, was sie haben.","Mich ziehen Schönheit, Kunst, Sinn und Tiefe an.","Das gewöhnliche Alltagsleben kann sich flach und unbefriedigend anfühlen.","Meine Stimmungen wechseln und bestimmen, was ich an einem Tag schaffe.","Ich bin empfindlich gegenüber Ablehnung und ziehe mich zurück, wenn ich mich missverstanden fühle.","Melancholie ist mir vertraut, manchmal sogar tröstlich."],"5":["Ich brauche viel Zeit allein, um aufzutanken und nachzudenken.","Ich will verstehen, wie etwas funktioniert, bevor ich handle.","Ich schütze meine Zeit, meine Energie und meine Privatsphäre sorgfältig.","Zu viele Anforderungen oder soziale Erwartungen erschöpfen mich schnell.","Ich beobachte lieber, als mitzumachen.","Wissen und Kompetenz geben mir ein Gefühl von Sicherheit.","Ich behalte meine Gefühle für mich und verarbeite sie später allein.","Ich kann mit sehr wenig leben, solange ich unabhängig bleibe.","Ich bin lieber gut informiert, bevor ich mich äußere.","Ich kann mich stundenlang in ein Thema vertiefen und alles andere vergessen."],"6":["Ich denke oft darüber nach, was schiefgehen könnte und wie ich mich vorbereite.","Loyalität und Vertrauen sind mir sehr wichtig.","Ich hinterfrage Dinge und suche nach versteckten Absichten.","Mit klaren Regeln, einer verlässlichen Gruppe oder einem vertrauten Menschen fühle ich mich sicherer.","Manchmal zweifle ich an meinem Urteil und hole die Meinung anderer ein.","Ich kann zwischen Vertrauen und Zweifel gegenüber derselben Person oder Autorität hin und her schwanken.","Wenn ich entschieden habe, dass jemand es verdient, bin ich tief verbunden und verantwortungsvoll.","Angst ist in meinem Alltag ein häufiger Begleiter.","Wenn ich Angst habe, gehe ich manchmal direkt auf die Angst zu, um zu beweisen, dass ich damit umgehen kann.","Ich bin wachsam für Risiken, die andere zu übersehen scheinen."],"7":["Ich liebe neue Erfahrungen, Ideen und Möglichkeiten.","Ich halte mir Optionen offen und lege mich ungern fest.","Wenn es schmerzhaft oder langweilig wird, lenke ich meine Aufmerksamkeit auf etwas Positiveres.","Ich habe viele Pläne und Projekte gleichzeitig am Laufen.","Mein Kopf springt schnell von einer Idee zur nächsten.","Ich bin optimistisch und finde fast überall die gute Seite.","Grenzen und Einschränkungen frustrieren mich.","Ich bin schnell begeistert, aber mein Interesse lässt nach, wenn das Neue verflogen ist.","Ich plane schon das nächste schöne Erlebnis, während ich das jetzige noch genieße.","Ich verweile lieber nicht bei Traurigkeit oder schweren Gefühlen."],"8":["Ich bin direkt und sage, was ich denke, auch wenn es Reibung erzeugt.","Ich übernehme ganz natürlich die Führung, wenn eine Situation sie braucht.","Ich hasse es, kontrolliert zu werden oder jemandem ausgeliefert zu sein.","Ich beschütze die Menschen, die mir wichtig sind, mit aller Kraft.","Ich zeige selten Verletzlichkeit oder Schwäche.","Ich respektiere Menschen, die standhaft bleiben und dagegenhalten.","Ich habe viel Energie und handle lieber, als zu warten.","Ungerechtigkeit macht mich wütend, und ich will mich ihr stellen.","Ich verlasse mich lieber auf mich selbst, als von anderen abhängig zu sein.","Meine Intensität kann für manche Menschen zu viel sein."],"9":["Frieden und Harmonie um mich herum sind mir sehr wichtig.","Ich kann jeden Standpunkt nachvollziehen, manchmal leichter als meinen eigenen.","Ich passe mich oft anderen an, um Konflikte zu vermeiden.","Ich schiebe Wichtiges auf und mache stattdessen leichtere, angenehmere Dinge.","Es kann mir schwerfallen zu wissen, was ich wirklich will.","Ich bleibe ruhig und ausgeglichen, wenn andere sich aufregen.","Unter Druck leiste ich lieber leisen Widerstand, als offen zu streiten.","Ich mag Routinen und vertraute Annehmlichkeiten.","Manchmal habe ich das Gefühl, meine Anwesenheit oder Meinung zählt nicht viel.","Ich übernehme leicht die Pläne und Stimmungen der Menschen, die mir nahestehen."]},"MOT":{"1":["Im Innersten will ich gut, richtig und integer sein.","Meine tiefste Sorge ist, falsch, verdorben oder schlecht zu sein.","Meine Aufmerksamkeit geht zuerst zu dem, was korrigiert oder verbessert werden muss."],"2":["Im Innersten will ich geliebt und gewollt werden.","Meine tiefste Sorge ist, ungewollt oder der Liebe unwürdig zu sein.","Meine Aufmerksamkeit geht zuerst zu den Bedürfnissen und Gefühlen anderer."],"3":["Im Innersten will ich wertvoll sein und bewundert werden.","Meine tiefste Sorge ist, wertlos oder ein Versager zu sein.","Meine Aufmerksamkeit geht zuerst zu Zielen, Ergebnissen und meiner Wirkung."],"4":["Im Innersten will ich mein wahres Selbst finden und ausdrücken.","Meine tiefste Sorge ist, keine echte Identität oder Bedeutung zu haben.","Meine Aufmerksamkeit geht zuerst zu dem, was fehlt, und zu meinen inneren Gefühlen."],"5":["Im Innersten will ich fähig sein und verstehen.","Meine tiefste Sorge ist, nutzlos, hilflos oder überfordert zu sein.","Meine Aufmerksamkeit geht zuerst dahin, Dinge zu verstehen und meine Ressourcen zu schützen."],"6":["Im Innersten will ich Sicherheit und Halt, auf die ich mich verlassen kann.","Meine tiefste Sorge ist, ohne Halt oder Orientierung dazustehen.","Meine Aufmerksamkeit geht zuerst zu Risiken, Zweifeln und der Frage, wem man trauen kann."],"7":["Im Innersten will ich glücklich, frei und erfüllt sein.","Meine tiefste Sorge ist, in Schmerz oder Mangel gefangen zu sein.","Meine Aufmerksamkeit geht zuerst zu spannenden Möglichkeiten und dem, was als Nächstes kommt."],"8":["Im Innersten will ich mich schützen und über mein eigenes Leben bestimmen.","Meine tiefste Sorge ist, verletzt, kontrolliert oder verraten zu werden.","Meine Aufmerksamkeit geht zuerst zur Macht: Wer ist stark, wer hat die Kontrolle?"],"9":["Im Innersten will ich inneren und äußeren Frieden.","Meine tiefste Sorge sind Konflikt, Verlust und Trennung.","Meine Aufmerksamkeit geht zuerst dahin, alles ruhig zu halten und alle zusammenzuhalten."]},"INST":{"sp":["Ich achte sehr auf meine Gesundheit, Energie, Ernährung und meinen Schlaf.","Finanzielle und materielle Sicherheit hat für mich höchste Priorität.","Bevor irgendetwas anderes kommt, mache ich mein Zuhause gemütlich und sicher.","Ich bereite mich lange im Voraus auf praktische Bedürfnisse vor.","Unter Stress prüfe ich zuerst, ob meine Grundbedürfnisse gedeckt sind.","Ich bevorzuge wenige stabile Routinen statt ständiger sozialer Aktivität."],"so":["Ich bin mir sehr bewusst, wo ich in einer Gruppe stehe.","Meine Rolle und mein Beitrag zu einer Gemeinschaft oder Sache sind mir wichtig.","Ich verfolge ganz natürlich die Beziehungen und Dynamiken zwischen Menschen.","Zu Gruppen und Netzwerken zu gehören ist mir wichtig.","Ich denke darüber nach, wie mein Handeln Menschen über meinen engen Kreis hinaus betrifft.","Ich fühle mich unwohl, wenn ich die sozialen Regeln einer Situation nicht kenne."],"sx":["Ich spüre sehr schnell, ob die Chemie mit jemandem stimmt oder nicht.","Ich suche tiefe, intensive Eins-zu-eins-Verbindungen.","Mich zieht an, was oder wer mich fasziniert, auch wenn es riskant ist.","Beziehungen ohne Funken lassen mich unbefriedigt.","Ich stecke viel Energie in die Person oder Leidenschaft, auf die ich mich konzentriere.","Ich will ganz mit dem verschmelzen, was ich liebe."]},"HORN":{"A":"Ich bin unabhängig und durchsetzungsstark. Ich verfolge, was ich will, ergreife die Initiative und erwarte, Dinge geschehen zu lassen.","B":"Ich bin ruhig und zurückhaltend. Ich bin gern allein, trete aus dem Rampenlicht zurück und lebe viel in meiner inneren Welt.","C":"Ich bin verantwortungsvoll und pflichtbewusst. Ich versuche, das Erwartete und Richtige zu tun, und stelle Pflichten oft vor meine eigenen Wünsche."},"HARM":{"X":"Wenn Probleme auftauchen, sehe ich die gute Seite, bleibe positiv und versuche, die Stimmung um mich herum gut zu halten.","Y":"Wenn Probleme auftauchen, reagiere ich stark. Ich brauche, dass andere sehen, wie es mir geht, und wünsche mir ehrliche, emotionale Reaktionen.","Z":"Wenn Probleme auftauchen, stelle ich Gefühle zurück, bleibe logisch und konzentriere mich darauf, das Problem kompetent zu lösen."},"LEVEL":{"1":{"h":["Ich habe Unvollkommenheit, meine eigene und die anderer, gelassen angenommen.","Ich fühlte mich ausgeglichen und konnte Dinge sein lassen."],"a":["Ich war angespannt, weil ich alles korrekt und unter Kontrolle halten wollte.","Ich war kritisch oder ungeduldig mit Menschen, die Dinge anders machen."],"u":["Ich spürte Groll und harte Urteile, die ich nicht abstellen konnte.","Mein innerer Kritiker war unerbittlich, und ich fühlte mich starr und wütend."]},"2":{"h":["Ich habe frei gegeben, ohne etwas zurückzuerwarten.","Ich habe auch gut für meine eigenen Bedürfnisse gesorgt."],"a":["Ich habe mich sehr bemüht, anderen zu gefallen oder unentbehrlich zu sein.","Ich fühlte mich für alles, was ich für andere tue, nicht gewürdigt."],"u":["Ich hatte das Gefühl, andere schulden mir etwas, und habe Schuld oder Druck eingesetzt, um Zuwendung zu bekommen.","Ich fühlte mich ausgenutzt und ausgelaugt, konnte aber nicht aufhören, zu viel zu geben."]},"3":{"h":["Ich fühlte mich ganz ich selbst, ohne jemanden beeindrucken zu müssen.","Ich habe meine Arbeit um ihrer selbst willen genossen und Anerkennung großzügig geteilt."],"a":["Ich habe mir viele Gedanken darüber gemacht, wie ich wirke oder welchen Status ich habe.","Ich habe mich zu Leistung angetrieben und war unruhig, wenn ich nichts erreichte."],"u":["Ich fühlte mich hinter meinem Image leer und bin dem ausgewichen.","Ich habe die Wahrheit verbogen oder Abkürzungen genommen, um den Schein zu wahren."]},"4":{"h":["Meine Gefühle flossen in kreatives oder sinnvolles Handeln.","Ich war im Reinen damit, wer ich bin, und verbunden mit dem gewöhnlichen Leben."],"a":["Ich habe viel Zeit in Stimmungen, Fantasien oder Sehnsucht verbracht.","Ich fühlte mich anders, missverstanden oder neidisch auf andere."],"u":["Ich fühlte mich wertlos und habe mich völlig von Menschen zurückgezogen.","Schwere Gefühle von Verzweiflung oder Selbstverachtung bestimmten meine Tage."]},"5":{"h":["Ich bin der Welt mit Neugier und Selbstvertrauen begegnet.","Ich habe mein Wissen geteilt und mich dazugehörig gefühlt."],"a":["Ich habe mich in meinen eigenen Raum zurückgezogen und Menschen auf Abstand gehalten.","Ich habe mehr gedacht und geplant als gehandelt."],"u":["Ich habe mich abgeschottet; die Welt fühlte sich aufdringlich oder feindlich an.","Ich habe Schlaf, Essen oder Kontakt vernachlässigt, weil ich in meinem Kopf versunken war."]},"6":{"h":["Ich habe mir selbst vertraut und mutig gehandelt.","Ich fühlte mich stabil und konnte mit Menschen entspannen."],"a":["Ich habe mir Sorgen gemacht und „Was wäre, wenn“-Szenarien durchgespielt.","Ich schwankte zwischen dem Suchen nach Bestätigung und dem Widerstand gegen Autoritäten."],"u":["Ich fühlte mich ängstlich und misstrauisch, als ob Menschen gegen mich wären.","Die Angst ließ mich um mich schlagen oder erstarren, und ich konnte mich nicht beruhigen."]},"7":{"h":["Ich fühlte mich zutiefst zufrieden und dankbar für das, was ich habe.","Ich konnte bei einer Sache bleiben, und auch bei schwierigen Gefühlen."],"a":["Ich habe mich beschäftigt gehalten und bin zwischen Aktivitäten und Plänen gesprungen.","Ich bin unangenehmen Gefühlen ausgewichen, indem ich das Nächste geplant habe."],"u":["Ich fühlte mich impulsiv und zerstreut, und die Dinge sind außer Kontrolle geraten.","Ich habe versucht, dem Schmerz durch Exzesse zu entkommen (Geld ausgeben, Feiern, Substanzen)."]},"8":{"h":["Ich habe meine Stärke genutzt, um andere mit weichem Herzen zu schützen und zu unterstützen.","Ich konnte Verletzlichkeit zeigen und mir von anderen helfen lassen."],"a":["Ich habe Menschen gedrängt und unter Druck gesetzt, damit Dinge erledigt werden.","Ich hatte das Gefühl, die Kontrolle behalten zu müssen, damit mich niemand ausnutzt."],"u":["Ich hatte das Gefühl, andere sind gegen mich, und wollte es ihnen heimzahlen.","Ich habe eingeschüchtert oder gedroht und hatte das Gefühl, niemandem trauen zu können."]},"9":{"h":["Ich fühlte mich präsent und engagiert und habe mich für das eingesetzt, was ich will.","Ich habe bei dem gehandelt, was mir wirklich wichtig ist."],"a":["Ich habe mich anderen angepasst und Konflikte vermieden.","Ich habe Wichtiges aufgeschoben und mich mit Routinen oder Ablenkungen betäubt."],"u":["Ich fühlte mich abgekoppelt, als ob das Leben an mir vorbeizieht.","Ich habe mich stur verschlossen und mich geweigert, mich mit Problemen zu befassen."]}},"LEVEL_GEN":{"h":["Insgesamt fühlte ich mich ruhig und präsent."],"a":["Ich habe automatisch reagiert, wie auf Autopilot."],"u":["Ich fühlte mich überfordert oder kurz vor dem Zusammenbruch."]},"DIR":{"1":{"g":["Ich habe mir erlaubt, das Leben spontan zu genießen und Spaß zu haben.","Ich fühlte mich leichter und weniger belastet von „Ich sollte“."],"s":["Ich fühlte mich launisch, unverstanden und habe mich selbst bemitleidet.","Ich wollte meinen Pflichten entfliehen."]},"2":{"g":["Ich habe ehrlich Kontakt zu meinen eigenen Gefühlen und Bedürfnissen gesucht.","Ich habe Zeit für meine eigenen kreativen oder persönlichen Interessen genutzt."],"s":["Ich wurde fordernd oder aggressiv, wenn Menschen nicht reagiert haben.","Ich habe versucht, andere zu kontrollieren, um zu bekommen, was mir meiner Meinung nach zusteht."]},"3":{"g":["Ich habe mich für ein Team oder eine Sache eingesetzt, die über meinen eigenen Erfolg hinausgeht.","Ich habe andere meine echten Gefühle und Zweifel sehen lassen."],"s":["Ich fühlte mich abgestumpft, unmotiviert und unbeteiligt.","Ich habe mich treiben lassen, aufgeschoben und meinen üblichen Antrieb verloren."]},"4":{"g":["Ich habe diszipliniert und sachlich nach meinen Prinzipien gehandelt.","Ich habe praktische Arbeit zu Ende gebracht, auch wenn mir nicht danach war."],"s":["Ich habe mich an Menschen geklammert und gebraucht, gebraucht zu werden.","Ich habe mich zu sehr in das Leben anderer eingemischt, um mich nah zu fühlen."]},"5":{"g":["Ich habe entschlossen gehandelt und meinen eigenen Fähigkeiten vertraut.","Ich fühlte mich in meinem Körper geerdet und selbstsicher in der Welt."],"s":["Ich habe meine Aufmerksamkeit auf viele Ablenkungen verstreut.","Ich fühlte mich rastlos und überdreht und bin von einer Sache zur nächsten gesprungen."]},"6":{"g":["Ich fühlte mich entspannt, vertrauensvoll und im Frieden.","Ich habe Dinge angenommen, wie sie sind, ohne zu viel nachzudenken."],"s":["Ich habe versucht, Menschen zu beeindrucken oder meinen Wert durch Leistung zu beweisen.","Ich wurde wettbewerbsorientiert und auf mein Image fixiert."]},"7":{"g":["Ich bin mit ruhiger Konzentration tief in ein Thema eingetaucht.","Ich habe Stille und Zeit allein zum Nachdenken genossen."],"s":["Ich wurde kritisch, ungeduldig und perfektionistisch.","Ich habe anderen Vorträge gehalten, wie man Dinge richtig macht."]},"8":{"g":["Ich habe Zärtlichkeit gezeigt und mich offen um andere gekümmert.","Ich habe mein Herz führen lassen statt meines Bedürfnisses nach Kontrolle."],"s":["Ich habe mich zurückgezogen, wurde verschlossen und habe mich nicht in die Karten schauen lassen.","Ich habe mich ins Denken und Planen zurückgezogen, statt zu handeln."]},"9":{"g":["Ich habe mir Ziele gesetzt und Energie in mich selbst investiert.","Ich habe die Initiative ergriffen und mich energiegeladen und produktiv gefühlt."],"s":["Ich fühlte mich ängstlich, besorgt und misstrauisch.","Ich habe Bestätigung gesucht und war bei Entscheidungen unsicher."]}},"FIG_OPTS":["Meine Mutter","Mein Vater","Beide Eltern","Eine andere Person (Großeltern, Geschwister, Betreuungsperson)","Eigentlich niemand"],"REL_OPTS":[["Bindung","Ich fühlte mich nah und versuchte, so zu sein, wie sie es wollten."],["Frustration","Sie waren da, aber ich bekam nicht genug von dem, was ich brauchte."],["Ablehnung","Ich fühlte mich nicht so gewollt, wie ich war; also hielt ich Abstand oder versuchte, mir ihre Liebe zu verdienen."]],"CONF_LABEL":{"High":"Klarer Vorsprung","Moderate":"Wahrscheinlich","Low":"Knappe Sache"},"DEEP":{"1":{"world":"Du erlebst das Leben als etwas, das verbessert werden will. Deine Aufmerksamkeit geht automatisch zur Lücke zwischen dem, wie es ist, und dem, wie es sein sollte, und du fühlst dich persönlich verantwortlich, sie zu schließen. Darunter liegt der Wunsch, gut und über jede Kritik erhaben zu sein.","gifts":"Integrität, Urteilsvermögen und Verlässlichkeit. Du hältst Wort, bemerkst, was anderen entgeht, und arbeitest hart daran, Dinge richtig zu machen. In deiner besten Form bist du weise und fair, ein moralischer Kompass, dem Menschen vertrauen.","blind":"Dein innerer Kritiker schweigt selten. Wut, die du für „nicht nett“ hältst, wird zurückgehalten und sickert als Groll, Starrheit oder belehrender Ton heraus. Du verwechselst womöglich deine eigenen Maßstäbe mit objektiver Wahrheit.","rel":"In Beziehungen bist du treu und verlässlich, doch Nahestehende können sich beurteilt fühlen. Im Beruf hebst du Qualität und Fairness; die Gefahr ist Mikromanagement, weil „es sonst nicht richtig gemacht wird“."},"2":{"world":"Du erlebst das Leben über Beziehungen. Du spürst fast sofort, was andere fühlen und brauchen, und gehst auf sie zu. Darunter liegt der Wunsch, geliebt zu werden, und der Glaube, dass man sich Liebe durch Hilfsbereitschaft verdienen muss.","gifts":"Wärme, Großzügigkeit und emotionale Intelligenz. Du gibst Menschen das Gefühl, gesehen und umsorgt zu sein, und baust Brücken zwischen ihnen. In deiner besten Form liebst du frei, ohne Buch zu führen.","blind":"Deine eigenen Bedürfnisse verschwinden aus dem Blick und kehren als Kränkung oder Groll zurück, wenn deine Fürsorge nicht erwidert wird. Stolz zeigt sich als „Ich brauche nichts“. Helfen kann zu stiller Kontrolle werden.","rel":"In Beziehungen bist du hingebungsvoll und aufmerksam, gibst aber womöglich, um zu bekommen. Im Beruf bist du das Herz des Teams; die Gefahr ist, zu allem Ja zu sagen und auszubrennen."},"3":{"world":"Du erlebst das Leben als eine Reihe von Zielen. Du erkennst, was um dich herum geschätzt wird, und wirst schnell gut darin. Darunter liegt der Wunsch, wertvoll zu sein, und die Angst, ohne Leistung nichts wert zu sein.","gifts":"Energie, Anpassungsfähigkeit und die Fähigkeit, Dinge umzusetzen. Du motivierst andere, präsentierst Ideen brillant und machst aus Plänen Ergebnisse. In deiner besten Form bist du authentisch, und dein Erfolg inspiriert andere zu wachsen.","blind":"Hinter der Rolle, die du spielst, kannst du den Kontakt zu deinen eigenen Gefühlen verlieren. Effizienz verdrängt Tiefe, und das Image kann sich echter anfühlen als der Mensch.","rel":"In Beziehungen bist du aufmerksam und unterhaltsam, bleibst aber womöglich beschäftigt statt intim zu werden. Im Beruf bist du ein natürlicher Performer und Leader; die Gefahr ist Überarbeitung und den eigenen Wert nur an Ergebnissen zu messen."},"4":{"world":"Du erlebst das Leben über Gefühl und Bedeutung. Du bist eingestimmt auf das, was fehlt, was schön und was echt ist. Darunter liegt der Wunsch, dein wahres Selbst zu finden, und das Gefühl, dass dir etwas Wesentliches fehlt.","gifts":"Tiefe, Kreativität und emotionale Ehrlichkeit. Du kannst bei Schmerz bleiben, ohne wegzuschauen, und hilfst anderen, sich verstanden zu fühlen. In deiner besten Form verwandelst du Erfahrung in Kunst und Mitgefühl.","blind":"Neid und Vergleich lassen das Leben anderer voller erscheinen. Du hältst womöglich an Stimmungen fest und ziehst dich zurück, wenn du dich missverstanden fühlst, und wartest darauf, gefunden zu werden, statt auf andere zuzugehen.","rel":"In Beziehungen sehnst du dich nach tiefer Verbindung und schwankst womöglich zwischen Idealisieren und Rückzug. Im Beruf bringst du Originalität und Sinn; die Gefahr ist, auf die richtige Stimmung zu warten, bevor du handelst."},"5":{"world":"Du erlebst das Leben vom Beobachterplatz aus. Du musst verstehen, bevor du dich einlässt, und schützt Zeit und Energie vor Vereinnahmung. Darunter liegt der Wunsch, fähig zu sein, und die Angst, überfordert oder nutzlos zu sein.","gifts":"Einsicht, Objektivität und unabhängiges Denken. Du siehst Muster, die anderen entgehen, und bleibst in der Krise ruhig. In deiner besten Form bist du ein Visionär, der sein Wissen großzügig teilt.","blind":"Du lebst womöglich im Kopf, auf Abstand zu Körper, Gefühlen und Menschen. Zeit, Energie und Emotionen zurückzuhalten kann dazu führen, dass du dich auf ein Leben vorbereitest, das du nie ganz betrittst.","rel":"In Beziehungen bist du treu und respektierst Grenzen, kannst aber distanziert wirken. Im Beruf bist du Experte und Stratege; die Gefahr ist, dich zurückzuziehen und dich zu übervorbereiten, statt zu handeln."},"6":{"world":"Du erlebst das Leben als etwas, auf das man sich vorbereiten muss. Du scannst Risiken, prüfst, wem und was man trauen kann, und suchst festen Boden. Darunter liegt der Wunsch nach Sicherheit und Halt und die Angst, ohne sie dazustehen.","gifts":"Loyalität, Verantwortungsbewusstsein und Weitsicht. Du bist ein verbindlicher Freund und Teamplayer und erkennst Probleme, bevor sie entstehen. In deiner besten Form bist du mutig und stabil, eine Quelle von Vertrauen für andere.","blind":"Zweifel und Sorgen können dein Denken bestimmen. Du schwankst womöglich zwischen dem Suchen nach Bestätigung und der Rebellion gegen Autoritäten. Manche Sechsen gehen direkt auf die Angst zu; das kann eher wie Kühnheit als wie Angst aussehen.","rel":"In Beziehungen bist du tief verbunden und beschützend, stellst Vertrauen aber womöglich immer wieder auf die Probe. Im Beruf bist du verlässlich und ein hervorragender Problemlöser; die Gefahr ist Grübeln und das Schlimmste zu erwarten."},"7":{"world":"Du erlebst das Leben als voller Möglichkeiten. Dein Kopf arbeitet schnell, verknüpft Ideen und plant das nächste gute Erlebnis. Darunter liegt der Wunsch, erfüllt zu sein, und die Angst, in Schmerz oder Mangel gefangen zu sein.","gifts":"Optimismus, Neugier und Vielseitigkeit. Du bringst Energie, Humor und neue Ideen mit und hebst die Stimmung anderer. In deiner besten Form bist du geerdet und dankbar, und deine Freude ist tief statt rastlos.","blind":"Du entkommst Unbehagen womöglich, indem du beschäftigt bleibst, alles positiv umdeutest oder zum nächsten Plan springst. Verbindlichkeit und Tiefe leiden, und schwierige Gefühle bleiben unverarbeitet.","rel":"In Beziehungen bist du unterhaltsam und großzügig, weichst aber womöglich schweren Gesprächen aus. Im Beruf bist du Visionär und Netzwerker; die Gefahr ist, vieles anzufangen und wenig zu beenden."},"8":{"world":"Du erlebst das Leben als Kräftemessen. Du erkennst, wer die Macht hat, schützt dein Revier und handelst direkt. Darunter liegt der Wunsch, dich zu schützen und die Kontrolle zu behalten, und die Angst, verletzt oder kontrolliert zu werden.","gifts":"Mut, Entschlossenheit und Schutzinstinkt. Du stellst dich vor die Schwachen, übernimmst in der Krise die Führung und sagst, was andere nicht sagen. In deiner besten Form bist du großherzig und nutzt deine Stärke, um andere zu stärken.","blind":"Du versteckst Verletzlichkeit womöglich hinter Härte, drückst zu sehr und hältst Weichheit für Schwäche. Deine Intensität kann Menschen überwältigen, und du verwechselst womöglich Kontrolle mit Sicherheit.","rel":"In Beziehungen bist du treu und beschützend, dominierst aber womöglich und zeigst Zärtlichkeit schwer. Im Beruf bist du ein natürlicher Leader, der Dinge in Bewegung bringt; die Gefahr ist, andere zu überrollen und niemandem zu trauen."},"9":{"world":"Du erlebst das Leben über den Wunsch nach Harmonie. Du siehst alle Seiten, verschmilzt mit den Menschen und Routinen um dich herum und glättest Konflikte. Darunter liegt der Wunsch nach Frieden und die Angst vor Verlust und Trennung.","gifts":"Akzeptanz, Geduld und eine beruhigende Präsenz. Du vermittelst, beziehst alle ein und lässt Menschen sich wohlfühlen. In deiner besten Form bist du ganz präsent und setzt dich kraftvoll für das ein, was zählt.","blind":"Du vergisst womöglich dich selbst: deine Prioritäten, deine Meinungen, deine Wut. Aufschieben und bequeme Routinen halten alles ruhig, und Widerstand zeigt sich als stiller Starrsinn.","rel":"In Beziehungen bist du unkompliziert und unterstützend, passt dich aber womöglich an, statt dich zu zeigen. Im Beruf bist du ein großartiger Teambuilder; die Gefahr ist, Entscheidungen zu meiden, bis Probleme wachsen."}},"WING_LONG":{"1w9":"Der Neuner-Flügel mildert deine Intensität und bringt Abstand. Du lebst Prinzipien leise, ziehst Vernunft der Konfrontation vor und wirkst womöglich kühl oder philosophisch. Wut wird noch stärker zurückgehalten. Du kämpfst eher für Ideale als für Menschen und ziehst dich bei Frust womöglich in Ordnung und Einsamkeit zurück.","1w2":"Der Zweier-Flügel bringt Wärme und Menschenenergie. Du nutzt deine Prinzipien, um Menschen zu helfen, und willst ihr Leben direkt verbessern. Du bist ausdrucksstärker, überzeugender und handlungsorientierter als eine 1w9 und sprichst Kritik eher aus. Die Gefahr ist Moralisieren und das Gefühl, nicht gewürdigt zu werden.","2w1":"Der Einser-Flügel bringt Gewissen und Zurückhaltung. Du hilfst aus Pflichtgefühl und dem Sinn für das Richtige, oft leise und im Hintergrund. Du bist ernster und selbstkritischer als eine 2w3 und gibst eigene Bedürfnisse womöglich schwer zu, weil sie sich egoistisch anfühlen.","2w3":"Der Dreier-Flügel bringt Ehrgeiz und gesellschaftlichen Schliff. Du knüpfst leicht Kontakte, wirst gern gemocht und gibst Menschen das Gefühl, besonders zu sein. Du bist imagebewusster und energiegeladener als eine 2w1. Die Gefahr ist, Anerkennung über Charme zu suchen und gekränkt zu sein, wenn du nicht der Liebling bist.","3w2":"Der Zweier-Flügel bringt Wärme. Du erreichst Erfolg über Beziehungen, inspirierst Menschen und willst ebenso gemocht wie wirksam sein. Du liest einen Raum mühelos. Die Gefahr ist, dich zu verbiegen, um zu gefallen, und Bewunderung mit Liebe zu verwechseln.","3w4":"Der Vierer-Flügel bringt Tiefe und den Wunsch nach Echtheit. Dein Erfolg soll etwas bedeuten und zeigen, wer du wirklich bist. Du bist privater und ernster als eine 3w2 und kannst selbstkritisch werden, wenn Image und innere Gefühle nicht zusammenpassen.","4w3":"Der Dreier-Flügel bringt Antrieb und soziales Gespür. Du willst, dass deine Einzigartigkeit gesehen und geschätzt wird, und kannst Gefühl in ausgefeilte, öffentliche Arbeit verwandeln. Die Gefahr ist, dich mit dem Erfolg anderer zu vergleichen und zwischen Stolz und Scham zu schwanken.","4w5":"Der Fünfer-Flügel bringt Intellekt und Privatsphäre. Du erkundest deine innere Welt über Ideen, Kunst oder Spiritualität und brauchst viel Alleinsein. Du bist stiller und unkonventioneller als eine 4w3 und ziehst dich zurück, wenn du verletzt bist.","5w4":"Der Vierer-Flügel bringt Gefühl und Fantasie. Du verbindest scharfe Beobachtung mit einer künstlerischen, manchmal ungewöhnlichen inneren Welt. Du bist emotionaler und individueller als eine 5w6. Die Gefahr ist, in privaten Welten zu leben, die andere nicht erreichen.","5w6":"Der Sechser-Flügel bringt Praxisnähe und Loyalität. Du magst Systeme und Belege und wendest Wissen auf echte Probleme an, oft in einem Team, dem du vertraust. Du bist skeptischer und organisierter als eine 5w4. Die Gefahr ist Angst und Übervorbereitung, bevor du handelst.","6w5":"Der Fünfer-Flügel bringt Unabhängigkeit und Ernsthaftigkeit. Du stützt dich auf Wissen und Analyse, um dich sicher zu fühlen, und bist Anliegen und Prinzipien treu. Du bist zurückhaltender und eigenständiger als eine 6w7 und kannst unter Stress misstrauisch oder starr werden.","6w7":"Der Siebener-Flügel bringt Geselligkeit und Humor. Du findest Sicherheit bei Menschen und in Aktivität und bist warm, einnehmend und unterstützend. Du bist kontaktfreudiger als eine 6w5. Die Gefahr ist, ständig Bestätigung zu suchen und Angst durch Beschäftigung zu vermeiden.","7w6":"Der Sechser-Flügel bringt Wärme und Verbindlichkeit. Du bist verspielt und witzig und bringst gern Menschen zusammen, mit einem leicht ängstlichen Unterton. Du bist beziehungsorientierter als eine 7w8. Die Gefahr ist verstreute Energie trotz deiner Loyalität.","7w8":"Der Achter-Flügel bringt Kraft und Praxisnähe. Du verfolgst, was du willst, setzt Dinge um und genießt Macht und materiellen Erfolg. Du bist getriebener und direkter als eine 7w6. Die Gefahr ist Ungeduld, Maßlosigkeit und auf dem Weg zum Nächsten Menschen zu überrollen.","8w7":"Der Siebener-Flügel bringt Tempo, Appetit und Begeisterung. Du bist raumgreifend, abenteuerlustig und unternehmerisch, verfolgst große Ziele mit hoher Energie und genießt die Fahrt. Du bist geselliger, impulsiver und risikofreudiger als eine 8w9. Die Gefahr ist Maßlosigkeit, Ungeduld und über die Grenzen anderer hinwegzugehen.","8w9":"Der Neuner-Flügel bringt Beständigkeit und Geduld. Du bist beschützend, geerdet und langsamer im Zorn, mit einer stillen Autorität, der Menschen vertrauen. Du bist empfänglicher und familienorientierter als eine 8w7; doch wenn deine Wut kommt, kann sie unverrückbar sein.","9w8":"Der Achter-Flügel bringt Durchsetzungskraft und Bodenständigkeit. Du bist praktisch, gesellig und kannst fest bleiben, wenn man dich drängt. Du bist direkter als eine 9w1. Die Gefahr ist das Schwanken zwischen Anpassung und sturen Ausbrüchen.","9w1":"Der Einser-Flügel bringt Prinzipien und Struktur. Du bist freundlich, gewissenhaft und zu Sinn und ruhigen Routinen hingezogen. Du bist zurückhaltender und beherrschter als eine 9w8. Die Gefahr ist, Wut hinunterzuschlucken und dich in eine idealisierte innere Ruhe zurückzuziehen."},"SUB_LONG":{"1":{"sp":"Der praktische Perfektionist. Dein Drang, es richtig zu machen, richtet sich auf Sicherheit, Gesundheit, Geld und Ordnung. Im Kern warmherzig, aber du kannst dich um Details sorgen und sie kontrollieren.","so":"Der Kreuzritter. Du richtest deine Maßstäbe auf die Gruppe: Regeln, Institutionen und Anliegen. Ein natürlicher Lehrer und Vorbild; die Gefahr ist Starrheit und ein Gefühl der Überlegenheit.","sx":"Der Reformer des geliebten Menschen. Deine Ideale richten sich auf deine engsten Beziehungen; du willst, dass die Menschen, die du liebst, ihr Bestes leben, und kannst darin eifrig sein."},"2":{"sp":"Der Fürsorgliche, der auch Fürsorge braucht. Du hilfst auf praktische Weise und bist womöglich schüchterner und charmanter als andere Zweien; still hoffst du, dass auch für dich gesorgt wird.","so":"Der Botschafter. Du gibst Gruppen und einflussreichen Menschen und bist gern im Zentrum des Netzwerks. Die Gefahr ist, zu geben, um Position und Bewunderung zu gewinnen.","sx":"Der hingebungsvolle Liebende. Du suchst intensive Nähe zu besonderen Menschen und gibst alles, um sie zu gewinnen und zu halten. Die Gefahr ist Besitzergreifen und dich selbst zu verlieren."},"3":{"sp":"Der Workaholic. Du suchst Sicherheit durch harte Arbeit und Kompetenz und bist weniger auffällig als andere Dreien: Du willst gut sein, nicht nur gut aussehen. Die Gefahr ist, nie aufzuhören.","so":"Der Statussucher. Du willst Anerkennung und Prestige in deiner Gruppe und weißt genau, wie Erfolg dort aussieht. Die Gefahr ist, Titel über Substanz zu stellen.","sx":"Der Charismatische. Du steckst deine Energie darein, attraktiv zu sein und eine besondere Person oder ein Team zu unterstützen. Die Gefahr ist, dich im Begehrtwerden zu verlieren."},"4":{"sp":"Der Standhafte. Du erträgst Schmerz still und verwandelst ihn in Stärke und Kreativität, ohne ihn zu dramatisieren. Die Gefahr ist, dich zu sehr anzutreiben.","so":"Der Außenseiter. Du vergleichst dich mit anderen und fühlst dich nicht ganz zugehörig, was Scham und Empfindsamkeit mit sich bringt. Zutiefst empathisch; die Gefahr ist, im Leiden stecken zu bleiben.","sx":"Der intensive Konkurrent. Neid richtet sich nach außen: Du willst gesehen werden und kannst in nahen Beziehungen leidenschaftlich, fordernd und konkurrierend sein."},"5":{"sp":"Der Burgbauer. Du schützt Privatsphäre und Grenzen, hältst deine Bedürfnisse minimal und sicherst dir einen sicheren Rückzugsort. Die Gefahr ist Isolation.","so":"Der Spezialist. Du findest Zugehörigkeit über Wissen und Ideale und verbindest dich mit Menschen aus deinem Fachgebiet. Die Gefahr ist, durch Ideen statt durch Erfahrung zu leben.","sx":"Der Vertraute. Hinter deiner Zurückhaltung suchst du den einen Menschen, dem du deine innere Welt ganz anvertrauen kannst. Die Gefahr ist Nähe nach dem Alles-oder-nichts-Prinzip."},"6":{"sp":"Der Warmherzige. Du suchst Sicherheit über Zuhause, Familie und verlässliche Verbündete; freundlich, vorsichtig und beschützend. Die Gefahr ist Angst und Abhängigkeit.","so":"Der Pflichtbewusste. Du findest Sicherheit in Regeln, Rollen und den Richtlinien der Gruppe; loyal und verantwortungsvoll. Die Gefahr ist, dich zu sehr auf Autoritäten zu stützen.","sx":"Der Starke. Du begegnest der Angst frontal, mutig und sogar einschüchternd (kontraphobisch). Die Gefahr ist, Gefahr zu provozieren, um zu beweisen, dass du keine Angst hast."},"7":{"sp":"Der Genießer. Du sicherst dir Vergnügen, Komfort und Gelegenheiten über Netzwerke und kluge Planung. Die Gefahr ist Eigennutz und Maßlosigkeit.","so":"Der Verzichtende. Du gibst einen Teil deines eigenen Vergnügens auf, um einer Gruppe oder einem Ideal zu dienen. Idealistisch und fürsorglich; die Gefahr ist versteckter Groll.","sx":"Der Abenteurer. Neue Menschen, Ideen und Romantik faszinieren dich, und du siehst die Welt durch die rosarote Brille. Die Gefahr ist Rastlosigkeit."},"8":{"sp":"Der Überlebenskünstler. Du sicherst, was du und die Deinen brauchen, direkt und ohne Umschweife. Die Gefahr ist, das Leben als Revierkampf zu sehen.","so":"Der Gruppenführer. Du schützt und verteidigst dein Team oder deine Gemeinschaft und kämpfst gegen Ungerechtigkeit. Die Gefahr ist, die Gruppe zu kontrollieren, die du schützt.","sx":"Der Befehlshaber. Du willst totale Verbindung und Loyalität und bringst intensive Leidenschaft in Beziehungen. Die Gefahr ist Dominanz."},"9":{"sp":"Der Komfortsuchende. Du findest Frieden in Routinen, Essen, Hobbys und kleinen Freuden. Die Gefahr ist, dich zu betäuben.","so":"Der Mitmachende. Du gehst in Gruppen auf, arbeitest viel für sie und hältst alle zusammen. Die Gefahr ist, deine eigene Agenda zu verlieren.","sx":"Der Verschmelzende. Du findest Identität in der Einheit mit einem Menschen und übernimmst dessen Interessen und Stimmungen. Die Gefahr ist, im anderen zu verschwinden."}},"LVL":{"1":[["Der weise Realist","Annahme"],["Der vernünftige Mensch","Gewissen und Ehrlichkeit"],["Der prinzipientreue Lehrer","Verantwortung"],["Der idealistische Reformer","Idealismus"],["Der ordnungsliebende Mensch","Starrheit"],["Der urteilende Perfektionist","Perfektionismus"],["Der intolerante Menschenfeind","Intoleranz"],["Der zwanghafte Heuchler","Besessenheit"],["Der strafende Rächer","Bestrafung"]],"2":[["Der selbstlose Altruist","bedingungslose Liebe"],["Der fürsorgliche Mensch","Empathie"],["Der nährende Helfer","Großzügigkeit"],["Der überschwängliche Freund","Gefallenwollen"],["Der vereinnahmende Vertraute","Aufdringlichkeit"],["Der selbstgerechte Heilige","Selbstaufopferung"],["Der eigennützige Manipulator","Manipulation"],["Der nötigende Beherrscher","Zwang"],["Das psychosomatische Opfer","Opferhaltung"]],"3":[["Der authentische Mensch","Innenorientierung"],["Der selbstsichere Mensch","Anpassungsfähigkeit"],["Das herausragende Vorbild","Exzellenz"],["Der ehrgeizige Statussucher","Leistungsdrang"],["Der imagebewusste Pragmatiker","Image"],["Der selbstdarstellende Narzisst","Konkurrenz"],["Der unehrliche Opportunist","Täuschung"],["Der böswillige Betrüger","Ausbeutung"],["Der rachsüchtige Saboteur","Rachsucht"]],"4":[["Der inspirierte Schöpfer","das Leben umarmen"],["Der selbstbewusste Intuitive","Feinfühligkeit"],["Der sich offenbarende Mensch","Kreativität"],["Der fantasievolle Ästhet","Fantasie"],["Der selbstversunkene Romantiker","Launenhaftigkeit"],["Die selbstverliebte Ausnahme","Selbstverwöhnung"],["Der entfremdete Depressive","Entfremdung"],["Der seelisch Gequälte","Selbsthass"],["Der Selbstzerstörerische","Selbstzerstörung"]],"5":[["Der bahnbrechende Visionär","Verstehen"],["Der scharfsinnige Beobachter","Neugier"],["Der fokussierte Innovator","Innovation"],["Der fleißige Experte","Konzeptbildung"],["Der intensive Theoretiker","Beschäftigung mit Ideen"],["Der provokante Zyniker","Provokation"],["Der isolierte Nihilist","Leere"],["Der verängstigte Fremde","Wahn"],["Der implodierende Einsiedler","Selbstauslöschung"]],"6":[["Der tapfere Held","Vertrauen in sich selbst"],["Der gewinnende Freund","Wärme und Charme"],["Der engagierte Arbeiter","Kooperation"],["Der pflichtbewusste Loyale","Selbstzweifel"],["Der ambivalente Pessimist","Abwehrhaltung"],["Der autoritäre Rebell","Schuldzuweisung"],["Der überreagierende Abhängige","Minderwertigkeit"],["Der paranoide Hysteriker","Paranoia"],["Der selbstschädigende Masochist","Selbstsabotage"]],"7":[["Der verzückte Genießer","Dankbarkeit"],["Der freigeistige Optimist","Begeisterung"],["Der vielseitig Erfolgreiche","Produktivität"],["Der erfahrene Lebemensch","Habgier"],["Der hyperaktive Extravertierte","Impulsivität"],["Der maßlose Hedonist","Exzess"],["Der impulsive Eskapist","Zerstreuung"],["Der manisch Getriebene","Zwang"],["Der Panische","Panik"]],"8":[["Das großmütige Herz","Mitgefühl"],["Der selbstbewusste Mensch","Stärke"],["Der konstruktive Anführer","Schutz"],["Der unternehmungslustige Abenteurer","Pragmatismus"],["Der dominierende Machtmensch","Druck und Kontrolle"],["Der konfrontative Gegner","Streitlust"],["Der rücksichtslose Gesetzlose","Rücksichtslosigkeit"],["Der allmächtige Größenwahnsinnige","Wut"],["Der gewalttätige Zerstörer","Zerstörung"]],"9":[["Der in sich ruhende Wegweiser","persönliche Freiheit"],["Der empfängliche Mensch","Ganzheit"],["Der unterstützende Friedensstifter","Akzeptanz"],["Der angepasste Rollenspieler","Selbstverleugnung"],["Der unbeteiligte Mitläufer","Passivität"],["Der resignierte Fatalist","Fatalismus"],["Der verleugnende Fußabtreter","Vernachlässigung"],["Der abgespaltene Automat","Dissoziation"],["Das selbstaufgebende Gespenst","Selbstaufgabe"]]},"L1TXT":{"1":"Weise, annehmend und gelassen. Du unterscheidest Richtig von Falsch, ohne jemanden zu verurteilen, und lebst deine Prinzipien mit Wärme und Demut.","2":"Bedingungslos liebend und demütig. Du gibst frei, freust dich am Glück anderer und sorgst auch für dich selbst.","3":"Authentisch und selbstannehmend. Du brauchst keine Bewunderung mehr; dein Wert ist einfach da, und deine Leistungen dienen etwas Größerem.","4":"Inspiriert und im Frieden mit dem Leben. Gefühle sind ehrlich, definieren dich aber nicht mehr; du verwandelst Erfahrung in etwas, das andere berührt.","5":"Ein klarsichtiger Visionär. Ganz in der Welt engagiert, siehst du, wie die Dinge wirklich sind, und teilst es frei.","6":"Mutig und selbstvertrauend. Gegründet in innerem Glauben bist du loyal und stabil, ohne äußere Garantien zu brauchen.","7":"Zutiefst dankbar und freudig. Ganz präsent genießt du, was da ist, statt dem Nächsten nachzujagen.","8":"Großmütig und großherzig. Deine Stärke dient anderen; du kannst sanft und verletzlich sein und Kontrolle loslassen.","9":"Ganz präsent und in dir ruhend. Friedvoll und doch engagiert setzt du dich kraftvoll für das ein, was zählt, und erinnerst dich an dich selbst."},"L1WIS":{"1":"Annahme","2":"Selbstliebe","3":"du selbst sein","4":"Vergebung","5":"Verstehen","6":"Mut","7":"Dankbarkeit","8":"Hingabe","9":"Selbsterinnerung"},"L9TXT":{"1":"Selbstgerecht und strafend: verzehrt von den Fehlern anderer und zu harten Strafen fähig, gegen andere oder gegen sich selbst.","2":"Fühlt sich als Opfer, die Not zeigt sich im Körper; Liebe ist zu einer Forderung an andere geworden.","3":"Rachsüchtig gegenüber jedem, der die Lücke hinter dem Image aufdeckt; der Schein wird um jeden Preis geschützt.","4":"Überwältigt von Selbsthass und Verzweiflung, ganz gegen sich selbst gewendet.","5":"Abgeschnitten von Wirklichkeit und Menschen, nach innen in die Leere stürzend.","6":"Paranoid und selbstschädigend; die Angst ist zur Selbstsabotage geworden.","7":"Flucht funktioniert nicht mehr; Panik und Zusammenbruch übernehmen.","8":"Zerstörerische Wut: lieber alles niederreißen, als kontrolliert zu werden.","9":"Abgespalten und sich selbst aufgegeben, abwesend im eigenen Leben."},"BANDS":[["Gesund","1–3","Frei und präsent. Die Gaben des Typs fließen: Befreiung (1), tiefe innere Kapazität (2), echter Beitrag für andere (3)."],["Durchschnittlich","4–6","Wo die meisten von uns die meiste Zeit leben. Das Ego übernimmt: Fixierung und Ungleichgewicht (4), andere steuern und kontrollieren (5), Überkompensation und Übertreibung (6)."],["Ungesund","7–9","Akuter oder chronischer Stress: Überlebensmodus (7), Besessenheit und Wahn (8), zerstörerischer Zusammenbruch (9). Braucht meist Unterstützung von außen."]],"S":{"langName":"Deutsch","langLabel":"Sprache","footer":"Eine Landkarte zur Selbstreflexion, keine psychologische Diagnose.","steps":["Start","Grundtyp","Selbstbeschreibung","Entscheidungsfragen","Flügel","Instinkte","Gerade jetzt","Richtung","Familie (optional)","Dein Ergebnis"],"stepOf":"Schritt {n} von {m}","next":"Weiter","back":"Zurück","start":"Test starten","seeResult":"Mein Ergebnis anzeigen","choose":"Bitte wählen…","introEyebrow":"Pilotversion","introTitle":"Entdecke deinen Typ und wo du heute damit stehst","introText":"Dieser Test schaut auf mehr als deinen Typ. Er schätzt auch deinen Flügel, deinen instinktiven Fokus, wie es dir gerade geht, in welche Richtung du dich bewegst und wie dein frühes Familienleben dich geprägt haben könnte. Am Ende bekommst du ein persönliches Profil mit ersten Schritten.","introList":["Etwa 20 Minuten. Antworte ehrlich und zügig; es gibt keine richtigen Antworten.","Die ersten Teile fragen, wie du <b>den größten Teil deines Erwachsenenlebens</b> warst. Spätere Teile fragen nach <b>den letzten 4 Wochen</b>.","Am Ende gibst du deine E-Mail-Adresse ein und bekommst dein Profil zugeschickt. Deine Antworten zur Familie verlassen nie dein Gerät.","Dies ist ein Werkzeug zur Selbstreflexion, keine Diagnose."],"nameLabel":"Dein Vorname oder ein Spitzname (optional)","consent":"Mir ist klar, dass dies ein Pilot zur Selbstreflexion ist und keine psychologische Untersuchung.","p1Prompt":"Wie sehr traf das den größten Teil deines Erwachsenenlebens auf dich zu?","lik":["Gar nicht","Ein wenig","Teilweise","Überwiegend","Voll und ganz"],"freq":["Nie","Selten","Manchmal","Oft","Sehr oft"],"groupTitle":"Welche Beschreibung passt am besten zu dir?","groupSub":"Wähle die, die über dein Leben hinweg am ehesten zutrifft, auch wenn keine perfekt passt.","groupTitle2":"Und wie gehst du normalerweise mit Problemen um?","tieTitle":"Was trifft eher auf dich zu?","tieSub":"Diese Paare helfen, deine stärksten Kandidaten zu unterscheiden. Wähle die Aussage, die im Innersten eher stimmt, auch wenn beide passen.","wingTitle":"Noch eine Nuance","wingSub":"Menschen mit deinem führenden Muster tendieren meist zu einer von zwei Färbungen. Welche klingt mehr nach dir?","instPrompt":"Wohin geht deine Energie ganz natürlich zuerst?","nowTitle":"Wie ging es dir in den letzten 4 Wochen?","nowSub":"Dieser Teil betrifft deinen aktuellen Zustand, der sich mit der Zeit verändert.","dirTitle":"Wie oft hast du in den letzten 4 Wochen…","famTitle":"Deine frühe Familie (optional)","famSub":"Diese Fragen helfen, dein Muster mit deiner Kindheit zu verbinden. Deine Antworten bleiben nur auf diesem Bildschirm und werden nie an jemanden gesendet. Überspringe, was du nicht beantworten möchtest.","famQ1":"Wer hat dir als Kind am meisten Trost, Wärme und Fürsorge gegeben?","famQ2":"Wer hat dir am meisten Struktur, Schutz und Orientierung gegeben?","famRel":"Was trifft auf deine Beziehung zu dieser Person am ehesten zu?","famNote":"Wenn diese Fragen etwas Schmerzhaftes berühren, ist es völlig in Ordnung, hier aufzuhören und zu überspringen. Ein Gespräch mit einer Vertrauensperson oder einer Fachperson kann helfen.","readMore":"Mehr lesen","profYour":"Dein Enneagramm-360-Profil","profNamed":"Enneagramm-360-Profil von {name}","fTypeWing":"Typ + Flügel","fInst":"Instinkte","fNow":"Gerade jetzt","fSure":"Wie sicher","levelBand":"Stufe {l} · {band}","bandNames":{"Healthy":"Gesund","Average":"Durchschnittlich","Unhealthy":"Ungesund"},"bandLower":{"Healthy":"gesunden","Average":"durchschnittlichen","Unhealthy":"ungesunden"},"gridNote":"Deine beiden Selbstbeschreibungen wiesen auf Typ {g}, deine ausführlichen Antworten auf Typ {t}. Es lohnt sich, beide zu lesen.","moreType":"Mehr über Typ {t}","hWorld":"Wie du die Welt siehst","hGifts":"Deine Gaben","hBlind":"Deine blinden Flecken","hRel":"In Beziehungen und im Beruf","kDesire":"Grundwunsch","kFear":"Grundangst","kPassion":"Leidenschaft","kVirtue":"Tugend, in die du hineinwächst","m360Eyebrow":"Das 360-Modell","m360Title":"Deine Position in drei Dimensionen","m360Text":"Die meisten Tests bleiben beim Kreis stehen. Enneagramm 360 liest dich in drei Dimensionen: <b>welches Muster</b> (dein Typ auf dem Symbol), <b>wie tief</b> (deine Stufe; die Schichten von frei oben bis festgefahren unten) und <b>wohin du dich bewegst</b> (Wachstum oder Stress). Deine Säule steht auf Punkt {t}; der leuchtende Ring markiert Stufe {l}.","more3d":"Warum die Stufen es 3D machen","m3dP1":"Das Symbol allein ist flach: Es sagt dir, in welchem der neun Muster du lebst. Die Stufen fügen Tiefe hinzu. Zwei Menschen desselben Typs können je nach Stufe völlig verschieden wirken: Eine gesunde Acht ist eine großherzige Beschützerin, eine ungesunde Acht ein Tyrann. Gleicher Typ, anderes Stockwerk.","m3dP2":"Die Stufen messen, wie präsent und frei wir sind. Je tiefer wir rutschen, desto mehr identifizieren wir uns mit den automatischen Gewohnheiten des Egos und desto weniger Wahl haben wir. Stufen bewegen sich im Laufe eines Tages und über die Jahre, und bewusste Praxis bringt dich nach oben. Darum ist dein Ergebnis eine <b>Position</b>, kein Etikett.","legFree":"am freiesten","legStuck":"am festgefahrensten","legYou":"du","wingEyebrow":"Dein Flügel","wingStrength":"Flügelstärke: {s}","wingStr":{"strong":"stark","moderate":"mittel","light":"leicht"},"moreWing":"Mehr über {wt}","wingP1":"Dein Grundtyp ist {t}. Der Flügel ist einer seiner beiden Nachbarn auf dem Kreis, {a} oder {b}, und färbt, wie sich dein Typ zeigt. Er ändert nicht dein Grundmotiv, sondern den Stil.","wingOther":"Der andere Flügel wäre {ow}: {txt}","moveEyebrow":"Bewegung","moveTitle":"Wohin du in Wachstum und unter Stress gehst","keyGrowth":"Wachstum → {g}","keyStress":"Stress → {s}","dirGrowth":"Gerade tendierst du Richtung <b class=\"gcol\">Wachstum</b>: Du leihst dir die gesunden Qualitäten von Typ {g}.","dirStress":"Gerade tendierst du Richtung <b class=\"scol\">Stress</b>: Du rutschst in die durchschnittlichen Gewohnheiten von Typ {s}.","dirMixed":"Gerade zeigst du Anzeichen für <b>beide</b> Richtungen.","moreMove":"Mehr über deine Pfeile","moveP1":"Jeder Typ hat zwei Pfeile. Wenn du dich sicher fühlst und wächst, übernimmst du ganz natürlich die <b class=\"gcol\">gesunden</b> Qualitäten eines Typs; unter Druck lebst du die <b class=\"scol\">durchschnittlichen</b> Gewohnheiten eines anderen aus. Du wirst nicht dieser Typ; du leihst dir etwas von ihm.","boxGrowth":"Wachstum: {t} → {g}","boxStress":"Stress: {t} → {s}","moveKenan":"Kenan Koldays Faustregel: Die Bewegung in Richtung Stress ist eine Art, Druck abzulassen, wie bei einem Dampfkochtopf. Sie bringt vorübergehend Erleichterung, löst aber nichts. Wachstum ist eine Wahl, die du immer wieder triffst.","lvEyebrow":"Gerade jetzt","lvTitle":"Stufe {l}: {role}","lvText":"Deine Antworten für die letzten 4 Wochen sehen dich auf Stufe {l} von 9, im <b>{band}</b> Bereich. Das Thema dieser Stufe für Typ {t} ist <b>{theme}</b>.","youNow":"Du jetzt","extreme":"Extrem","bestTitle":"Stufe 1 · in seiner besten Form","worstTitle":"Stufe 9 · in seiner schlimmsten Form","wisdom":"Die Weisheit, die sie öffnet: {w}.","extremesNote":"Stufen 1 und 9 sind Extreme. Wenige Menschen leben dort; sie zeigen die volle Bandbreite des Typs.","careNote":"Einige deiner Antworten deuten darauf hin, dass die letzten Wochen schwer waren. Sei bitte freundlich zu dir und überlege, mit einer Vertrauensperson oder einer Fachperson zu sprechen. Du musst das nicht allein durchstehen.","moreLevels":"Mehr über die Stufen","bandRange":"Stufen {r}","signals":"Signale für Typ {t}","kWake":"Weckruf","kWakeNote":"(der Rutsch von 3 auf 4: erstes Zeichen des Autopiloten)","kFlag":"Warnsignal","kFlagNote":"(die Angst beim Schritt von 6 auf 7)","kGrace":"Rettende Eigenschaft","levelsNote":"Wenn du deinen Weckruf bemerkst: wahrnehmen, innehalten und das Gegenteil tun. Dies ist eine Momentaufnahme der letzten 4 Wochen, kein fester Zustand.","instEyebrow":"Instinkte","instTitle":"{iname} {t}: {head}","ord":["1.","2.","3."],"moreInst":"Was die Instinkt-Reihenfolge bedeutet","instP1":"Jeder Mensch hat drei Überlebensinstinkte: <b>Selbsterhaltung (SP)</b>, mit Fokus auf Sicherheit, Gesundheit, Komfort und Ressourcen; <b>Sozial (SO)</b>, mit Fokus auf Zugehörigkeit, Rolle und Gruppe; und <b>Eins-zu-eins (SX)</b>, mit Fokus auf intensive Verbindung, Chemie und Faszination.","instP2":"Wir nutzen alle drei, aber in einer festen Reihenfolge. Der <b>erste</b> ist, wohin deine Aufmerksamkeit automatisch geht. Der <b>zweite</b> unterstützt ihn. Der <b>dritte</b> ist dein blinder Fleck: Er wird vernachlässigt und verursacht oft Probleme, die du nicht kommen siehst. Bei dir ist das: {blind}.","instP3":"Dein Typ zusammen mit deinem ersten Instinkt ergibt deinen <b>Subtyp</b>, einen von 27. Die drei Varianten von Typ {t}:","subYou":"(du)","sureEyebrow":"Wie sicher ist das?","confHead":"Deine Antworten gaben <b>Typ {t} {a} Punkte</b> und dem Zweitplatzierten, <b>Typ {s}, {b} Punkte</b>: ein Abstand von <b>{g}</b>.","confHigh":"Das ist ein großer Abstand. Deine Antworten weisen durchgehend auf Typ {t}, du kannst dieses Profil also mit Vertrauen lesen.","confMod":"Typ {t} liegt vorn, aber Typ {s} ist nicht weit dahinter. Lies auch über Typ {s}: Wenn er deine inneren Beweggründe besser beschreibt, vertraue dem mehr als dem Test.","confLow":"Das ist zu knapp, als dass der Test zuverlässig unterscheiden könnte. Vergleiche die beiden unten: Der Typ, der erklärt, <i>warum</i> du Dinge tust, nicht nur was du tust, ist meist deiner.","moreSure":"Typ {t} und Typ {s} vergleichen, alle Werte sehen","typeN":"Typ {n}","cmpWant":"Im Innersten will ich","cmpFear":"Meine tiefste Angst","cmpStress":"Unter Druck…","allScores":"Alle neun Werte","pointsNote":"Die Punkte ergeben sich daraus, wie stark du den Aussagen jedes Typs zugestimmt hast (0–100), plus Boni aus deinen Selbstbeschreibungen und Entscheidungsfragen.","rootsEyebrow":"Wurzeln","rootsTitle":"Dein Familienmuster","rootsText":"In der Enneagramm-Tradition formt sich Typ {t} oft um die Beziehung zu <b>{fig}</b>, mit einem Gefühl von <b>{rel}</b>.","kAbsorbed":"Die aufgenommene Botschaft","kNeeded":"Die gebrauchte Botschaft","rootsNote":"Das Modell beschreibt Tendenzen; deine eigene Geschichte kann abweichen, und genau dieser Unterschied ist es wert, erkundet zu werden.","famSkipped":"Du hast die Familienfragen übersprungen.","famMine":"<b>Deine Antworten:</b> Trost und Fürsorge kamen vor allem von: {f1} ({r1}); Struktur und Schutz vor allem von: {f2} ({r2}). Vergleiche das mit dem Muster oben.","noAnswer":"keine Antwort","practiceEyebrow":"Praxis","practiceTitle":"Deine ersten drei Schritte","practiceNote":"Probiere sie 66 Tage lang aus. Was durch Wiederholung geschrieben wurde, wird durch Wiederholung gelöscht.","teaserEyebrow":"Im vollständigen Profil","teaserTitle":"Tiefer gehen","teaserList":["Alle neun Stufen von Typ {t}, und was dich von einer zur nächsten bringt","Dein Subtyp in der Tiefe, und wie er sich in Liebe, Arbeit und Geld zeigt","Dein Typ mit jedem anderen Typ: Beziehungen und Konflikte","Ein 66-Tage-Heilungsweg, aufgebaut auf deiner Stufe und Richtung","Eine Familiensitzung: dein Muster neben dem deiner Eltern und Kinder"],"fbEyebrow":"Pilot","fbTitle":"Hilf, den Test zu verbessern","qGuess":"Welchen Typ hast du vor heute bei dir vermutet?","optDontKnow":"Wusste ich nicht","qRheti":"Falls du den RHETI-Test (Riso-Hudson) gemacht hast, welchen Typ hat er ergeben?","optNotTaken":"Nicht gemacht","qAcc":"Wie zutreffend fühlt sich dieses Profil an?","accOpts":["1 · Gar nicht","2","3 · Teilweise","4","5 · Volltreffer"],"qComment":"Hat sich etwas falsch angefühlt, oder besonders zutreffend?","restart":"Neu beginnen","sharedEyebrow":"Gespeichertes Profil","sharedTitle":"Profil von {name}","sharedTitleAnon":"Ein geteiltes Profil","sharedMeta":"Eigene Vermutung: {gs} · RHETI: {rh} · Treffer: {acc}","takeTest":"Mach den Test selbst","heroEyebrow":"Enneagramm 360 · Pilot","heroTitle":["Erkenne dein Muster.","Sieh deine Tiefe.","Wähle deine Richtung."],"heroSub":"Ein Test zur Selbstentdeckung, der nicht nur zeigt, wer du bist, sondern auch, wo du heute damit stehst und wohin du von hier aus gehen kannst.","heroMeta":"Etwa 20 Minuten · Kostenlos · Privat","apEyebrow":"Der Ansatz","apTitle":"Eine Landkarte für neun Arten, Mensch zu sein","apText":"Das Enneagramm ist eine uralte Landkarte der menschlichen Natur. Sein Symbol, ein Kreis mit einem Dreieck und einer sechszackigen Figur, beschreibt neun Muster von Aufmerksamkeit und Motivation. Wir alle tragen die neun Möglichkeiten in uns, doch früh im Leben stützen wir uns auf eine davon, um uns sicher und geliebt zu fühlen. Dieses Muster wird zu unserer Persönlichkeit: zu unseren Gaben, aber auch zu den Gewohnheiten, die uns festhalten.","apPillars":[["Neun Muster","Neun Grundmotive, jedes mit eigenem Wunsch, eigener Angst und eigenem Blick auf die Welt."],["Drei Zentren","Bauch, Herz und Kopf: drei Intelligenzen und drei Arten, auf das Leben zu reagieren."],["Alte Wurzeln, lebendige Praxis","Verwurzelt in jahrhundertealten Weisheitstraditionen, vertieft durch die moderne Psychologie."]],"dfEyebrow":"Was es anders macht","dfTitle":"Keine Schublade. Ein Spiegel, der sich bewegt.","dfText":"Die meisten Persönlichkeitstests sortieren dein Verhalten in Kategorien. Das Enneagramm geht darunter: zu dem, warum du tust, was du tust.","dfOthers":"Die meisten Persönlichkeitstests","dfEnn":"Das Enneagramm","dfRows":[["Was du tust","Warum du es tust"],["Ein festes Etikett","Ein Muster, das sich mit Stress und Wachstum verändert"],["Deine Stärken","Deine Gaben und deine blinden Flecken"],["Eine Beschreibung","Ein Weg des Wachstums"]],"tyEyebrow":"Die Neun kennenlernen","tyTitle":"Welcher kommt dir unangenehm bekannt vor?","tyHint":"Tippe auf eine Zahl.","z3Eyebrow":"Warum 360","z3Title":"Die meisten Enneagramm-Tests bleiben beim Kreis stehen","z3Text":"Sie nennen dir deinen Typ, vielleicht deinen Flügel. Enneagramm 360 liest dich in drei Dimensionen, denn zwei Menschen desselben Typs können sehr verschiedene Leben führen.","z3Dims":[["Muster","Dein Typ, dein Flügel und dein instinktiver Subtyp: die Form deiner Persönlichkeit."],["Tiefe","Deine aktuelle Gesundheitsstufe, von frei und präsent bis festgefahren im Autopiloten."],["Bewegung","Die Richtung, in die du dich gerade bewegst: zum Wachstum oder zum Stress."]],"z3TblA":"Typischer Test","z3TblB":"Enneagramm 360","z3Partial":"manchmal","z3Rows":["Grundtyp","Flügel","Instinktiver Subtyp","Aktuelle Gesundheitsstufe","Aktuelle Richtung","Familiäre Wurzeln","Wie sicher das Ergebnis ist","Erste Schritte zum Wachsen"],"hwEyebrow":"So funktioniert es","hwTitle":"Drei Schritte, etwa 20 Minuten","hwSteps":[["Ehrlich antworten","Etwa 135 kurze Aussagen. Es gibt keine richtigen Antworten, nur wahre."],["Dein 360-Profil sehen","Dein Typ, deine Tiefe und deine Richtung, mit Grafiken und klaren Erklärungen."],["Mit der Praxis beginnen","Drei konkrete erste Schritte für die nächsten 66 Tage."]],"ftEyebrow":"Weitergehen","ftTitle":"Das ist erst die erste Schicht","ftTiers":[["Entdecken","Dein vollständiges 360-Profil: Typ, Flügel, Subtyp, aktuelle Stufe, Richtung, familiäre Wurzeln und drei erste Schritte.","Kostenlos · jetzt"],["Tiefenprofil","Mehr als die Momentaufnahme: ein längerer Test, alle neun Stufen deines Typs und was dich zwischen ihnen bewegt, dein Subtyp in Liebe, Arbeit und Geld und deine Beziehung zu jedem anderen Typ.","Demnächst"],["Heilungsweg","Eine begleitete 66-Tage-Praxis, aufgebaut auf deiner Stufe und Richtung, mit wöchentlichen Check-ins und einem Wiederholungstest, der zeigt, wie du dich bewegt hast.","Demnächst"],["Begleitet","Einzel- und Familiensitzungen, um mit deinem Muster im echten Leben zu arbeiten.","Demnächst"]],"fqEyebrow":"Häufig gestellte Fragen","fqItems":[["Ist das eine Diagnose?","Nein. Es ist eine Landkarte zur Selbstreflexion. Sie beschreibt Tendenzen, keine Störungen."],["Kann sich mein Typ ändern?","Dein Grundtyp bleibt ein Leben lang gleich. Was sich ändert, sind deine Stufe und deine Richtung, und genau dort geschieht Wachstum."],["Was passiert mit meinen Antworten?","Dein Ergebnis wird nur an deine E-Mail-Adresse geschickt und in Anils privater Pilotliste gespeichert. Deine einzelnen Antworten und deine Familienantworten verlassen nie dein Gerät."]],"endTitle":"Bereit, dein Muster zu sehen?","gateEyebrow":"Fast geschafft","gateTitle":"Wohin sollen wir dein Profil schicken?","gateText":"Dein Profil öffnet sich auf dem nächsten Bildschirm und wird dir gleichzeitig per E-Mail geschickt, damit du jederzeit darauf zurückkommen kannst.","emailLabel":"Deine E-Mail-Adresse","consentProfile":"Schick mir mein Enneagramm-360-Profil per E-Mail. Ich bin einverstanden, dass mein Ergebnis und meine E-Mail-Adresse für diesen Pilot gespeichert werden, wie in der <a href=\"privacy.html\" target=\"_blank\" rel=\"noopener\">Datenschutzerklärung</a> beschrieben.","consentNews":"Halte mich auch über Enneagramm 360 auf dem Laufenden (optional, jederzeit abbestellbar).","gateBtn":"Profil anzeigen und zuschicken","gateInvalid":"Bitte gib eine gültige E-Mail-Adresse ein.","gateNeedConsent":"Bitte setze das erste Häkchen, damit wir dir dein Profil schicken können.","sending":"Wird gesendet…","sentOk":"Dein Profil ist unterwegs an {email}. Falls du es nicht siehst, schau im Spam-Ordner nach.","sentNews":"Bitte bestätige dein Newsletter-Abo über den Link in dieser E-Mail.","sentFail":"Wir konnten die E-Mail gerade nicht senden. Dein Profil steht unten; mach bitte einen Screenshot oder versuche es später noch einmal.","fbBtn":"Feedback senden","fbSent":"Danke, dein Feedback wurde gesendet.","fbFail":"Das Feedback konnte nicht gesendet werden. Bitte versuche es noch einmal.","privacyLink":"Datenschutz","subWorking":"Einen Moment…","subConfirmed":"Danke, dein Abo ist bestätigt.","subConfirmedSub":"Du erhältst gelegentlich Neuigkeiten zu Enneagramm 360. Abmelden kannst du dich jederzeit über den Link in jeder E-Mail.","subUnsub":"Du wurdest abgemeldet und erhältst keine weiteren E-Mails.","subInvalid":"Dieser Link ist nicht mehr gültig.","subFail":"Etwas ist schiefgelaufen. Bitte versuche den Link in ein paar Minuten noch einmal."}},"ro":{"T":{"1":{"name":"Reformatorul","tag":"Principial, hotărât, stăpân pe sine","summary":"Te conduce o dorință profundă de a fi bun și de a trăi cu integritate. Vezi clar cum ar putea fi lucrurile mai bune și îți impui standarde înalte. Criticul tău interior te ține pe drumul cel bun, dar rareori te lasă să te odihnești.","desire":"Să fii bun, corect și întreg","fear":"Să fii greșit, corupt sau rău","passion":"Mânie (ținută în frâu, ca resentiment)","fixation":"Resentiment","virtue":"Seninătate","idea":"Perfecțiunea Sfântă","childMsg":"„Nu e în regulă să greșești.”","lostMsg":"„Ești bun.”","figure":"figurii protectoare","rel":"frustrare","famNote":"Figura protectoare a fost insuficientă în îndrumare sau prea aspră, așa că copilul și-a construit un judecător interior sever care să facă această treabă.","wake":"Să simți obligația personală de a repara totul singur.","flag":"„Idealurile mele sunt greșite și nimic din ce fac nu funcționează.”","grace":"„Nimic nu e imposibil pentru mine.”","growth":"Spre Șapte sănătos: te relaxezi, te bucuri de viață și descoperi că bucuria este un răspuns legitim la faptul că ești viu.","stress":"Spre Patru mediu: te simți neînțeles, schimbător și vrei să fugi de responsabilități.","levels":{"h":"Înțelept, cu discernământ, acceptant; principii purtate cu căldură.","a":"Ordonat, critic, tensionat; încearcă să țină totul corect.","u":"Rigid, aspru, pedepsitor cu sine și cu ceilalți."},"actions":["Când îți auzi criticul interior, oprește-te și întreabă: standardul acesta e al meu sau l-am preluat de undeva?","Săptămâna aceasta lasă intenționat un lucru mic imperfect și observă ce se întâmplă de fapt.","Programează o oră de plăcere pură, fără niciun scop, la fel de serios cum îți programezi munca."]},"2":{"name":"Ajutorul","tag":"Generos, cald, dornic să mulțumească","summary":"Te conduce dorința de a fi iubit și de a conta în viața oamenilor. Simți cu mare finețe nevoile celorlalți și dai cu generozitate, în timp ce propriile nevoi rămân adesea în plan secund.","desire":"Să fii iubit și dorit","fear":"Să fii nedorit sau nedemn de iubire","passion":"Mândrie","fixation":"Lingușire","virtue":"Smerenie","idea":"Voința Sfântă","childMsg":"„Nu e în regulă să ai propriile nevoi.”","lostMsg":"„Ești dorit.”","figure":"figurii protectoare","rel":"respingere","famNote":"Iubirea figurii protectoare nu a părut dată necondiționat, așa că copilul a învățat că iubirea trebuie câștigată fiind util.","wake":"Să simți că trebuie să câștigi oamenii mergând tu spre ei.","flag":"„Îi îndepărtez pe oamenii pe care îi iubesc.”","grace":"„Pot influența lucrurile ca să obțin ce îmi trebuie.”","growth":"Spre Patru sănătos: îți întâlnești onest propriile sentimente, inclusiv pe cele dificile, și te accepți așa cum ești.","stress":"Spre Opt mediu: devii pretențios și controlant când grija ta nu e răsplătită.","levels":{"h":"Altruist, empatic, are grijă și de sine, nu doar de ceilalți.","a":"Dornic să mulțumească, intruziv, așteaptă în tăcere ceva înapoi.","u":"Manipulator, revendicativ, folosește vinovăția sau presiunea."},"actions":["Înainte să ajuți, întreabă-te: de ce am eu nevoie acum?","Cere cuiva ajutorul pentru un lucru mic și lasă-l să dea.","Observă săptămâna aceasta un moment de resentiment și numește nevoia din spatele lui."]},"3":{"name":"Realizatorul","tag":"Adaptabil, ambițios, atent la imagine","summary":"Te conduce dorința de a fi valoros și admirat. Îți stabilești obiective, te adaptezi rapid și livrezi rezultate. Riscul este să pierzi legătura cu cine ești dincolo de realizările tale.","desire":"Să fii valoros și demn de prețuire","fear":"Să fii fără valoare sau un eșec","passion":"Înșelăciune (autoamăgire)","fixation":"Vanitate","virtue":"Sinceritate (autenticitate)","idea":"Legea Sfântă / Speranța","childMsg":"„Nu e în regulă să ai propriile sentimente și propria identitate.”","lostMsg":"„Ești iubit pentru cine ești.”","figure":"figurii care oferă grijă","rel":"atașament","famNote":"Copilul a fost atașat de figura care îi oferea grijă, a simțit ce prețuia aceasta și a devenit exact asta; lauda venea pentru ce făcea, nu pentru cine era.","wake":"Să te epuizezi pentru statut, poziție și atenție.","flag":"„Eșuez; sunt gol și fals.”","grace":"„Pot influența rezultatul.”","growth":"Spre Șase sănătos: te angajezi pentru ceva mai mare decât propriul succes și îi lași pe oameni să-ți vadă sentimentele reale.","stress":"Spre Nouă mediu: te retragi, îți pierzi elanul și amorțești.","levels":{"h":"Autentic, ghidat din interior, un model inspirațional.","a":"Concentrat pe performanță, își gestionează imaginea, competitiv.","u":"Înșelător, oportunist, disperat să păstreze aparențele."},"actions":["O dată pe zi, întreabă-te: ce simt de fapt, în afară de ce trebuie făcut?","Împărtășește o îndoială sau un eșec cu cineva de încredere, fără înfrumusețări.","Fă săptămâna aceasta ceva doar pentru că îți place, fără public."]},"4":{"name":"Individualistul","tag":"Expresiv, sensibil, centrat pe sine","summary":"Te conduce dorința de a-ți găsi și exprima sinele adevărat. Simți profund, prețuiești autenticitatea și frumusețea și adesea ai senzația că lipsește ceva esențial.","desire":"Să fii tu însuți și să-ți găsești semnificația","fear":"Să nu ai identitate sau semnificație personală","passion":"Invidie","fixation":"Melancolie","virtue":"Echilibru (ecuanimitate)","idea":"Originea Sfântă","childMsg":"„Nu e în regulă să fii prea funcțional sau prea fericit.”","lostMsg":"„Ești văzut așa cum ești.”","figure":"ambilor părinți","rel":"frustrare","famNote":"Copilul nu s-a simțit cu adevărat văzut de niciunul dintre părinți și a tras concluzia că trebuie să-i lipsească ceva.","wake":"Să te agăți de sentimente și să le amplifici prin fantezie.","flag":"„Îmi distrug viața și îmi irosesc șansele.”","grace":"„Sunt conștient.”","growth":"Spre Unu sănătos: acționezi după principii, duci lucrurile la capăt și transformi sentimentul în muncă disciplinată.","stress":"Spre Doi mediu: te agăți de oameni și ai nevoie să fii necesar.","levels":{"h":"Creativ, onest cu sentimentele, plin de compasiune.","a":"Schimbător, nostalgic, se compară, retras în fantezie.","u":"Disperat, se respinge pe sine, înstrăinat."},"actions":["Când te compari cu cineva, notează trei lucruri pe care le ai tu.","Termină săptămâna aceasta o sarcină creativă sau practică, indiferent de dispoziție.","Exersează în fiecare seară recunoștința pentru un moment obișnuit."]},"5":{"name":"Investigatorul","tag":"Perspicace, independent, discret","summary":"Te conduce dorința de a fi capabil și de a înțelege. Observi, analizezi și îți protejezi timpul și energia. Riscul este să trăiești în minte și să rămâi la distanță de viață.","desire":"Să fii capabil și competent","fear":"Să fii inutil, neajutorat sau incapabil","passion":"Avariție (reținere)","fixation":"Zgârcenie","virtue":"Detașare","idea":"Omnisciența Sfântă","childMsg":"„Nu e în regulă să te simți confortabil în lume.”","lostMsg":"„Nevoile tale nu sunt o problemă.”","figure":"ambilor părinți","rel":"respingere","famNote":"Părinții au părut fie intruzivi, fie indisponibili, așa că copilul și-a micșorat nevoile și s-a retras în minte.","wake":"Să te retragi din realitate în concepte și lumi mentale.","flag":"„Nu-mi voi găsi niciodată locul în lume sau printre oameni.”","grace":"„Pot găsi răspunsurile.”","growth":"Spre Opt sănătos: acționezi hotărât și ai încredere că poți face față problemelor pe măsură ce apar.","stress":"Spre Șapte mediu: te împrăștii în distrageri și neliniște.","levels":{"h":"Vizionar, pătrunzător, implicat și generos cu cunoașterea.","a":"Detașat, analitic, își drămuiește timpul și energia.","u":"Izolat, nihilist, rupt de nevoi și de oameni."},"actions":["Acționează o dată săptămâna aceasta înainte să te simți complet pregătit.","Împărtășește ceva ce știi cu cineva căruia i-ar folosi.","Observă-ți corpul de trei ori pe zi: foame, oboseală, tensiune."]},"6":{"name":"Loialul","tag":"Devotat, responsabil, anxios","summary":"Te conduce dorința de siguranță și sprijin. Ești loial, atent la riscuri și bun la anticiparea problemelor. Îndoiala și anxietatea îți pot face greu să ai încredere în tine.","desire":"Să ai siguranță și sprijin","fear":"Să rămâi fără sprijin sau îndrumare","passion":"Frică (anxietate)","fixation":"Lașitate / îndoială","virtue":"Curaj","idea":"Credința Sfântă","childMsg":"„Nu e în regulă să ai încredere în tine.”","lostMsg":"„Ești în siguranță.”","figure":"figurii protectoare","rel":"atașament","famNote":"Copilul s-a atașat de figura protectoare și a făcut din aprobarea acesteia sursa siguranței.","wake":"Să depinzi de ceva din afara ta pentru îndrumare.","flag":"„Faptele mele mi-au pus siguranța în pericol.”","grace":"„Sunt responsabil.”","growth":"Spre Nouă sănătos: te relaxezi, ai încredere și devii mai deschis și mai receptiv.","stress":"Spre Trei mediu: devii competitiv și preocupat de imagine ca să-ți dovedești valoarea.","levels":{"h":"Curajos, încrezător, devotat; o prezență stabilizatoare.","a":"Îngrijorat, nesigur, oscilând între dependență și sfidare.","u":"Suspicios, panicat, atacă sau se prăbușește."},"actions":["Când începe un „ce-ar fi dacă”, notează-l și adaugă un „ce-ar fi dacă iese bine”.","Ia săptămâna aceasta o decizie fără să ceri părerea nimănui.","Încheie fiecare zi numind un lucru care a mers bine."]},"7":{"name":"Entuziastul","tag":"Spontan, versatil, împrăștiat","summary":"Te conduce dorința de a fi fericit, liber și împlinit. Ești curios, rapid și plin de planuri. Riscul este să fugi de durere și să nu rămâi niciodată destul cât să mergi în profunzime.","desire":"Să fii mulțumit și împlinit","fear":"Să fii prins în durere sau lipsuri","passion":"Lăcomie (de experiențe)","fixation":"Planificare","virtue":"Sobrietate (cumpătare)","idea":"Planul Sfânt / Înțelepciunea","childMsg":"„Nu e în regulă să depinzi de cineva pentru ceva.”","lostMsg":"„Se va avea grijă de tine.”","figure":"figurii care oferă grijă","rel":"frustrare","famNote":"Copilul a simțit că nu primește destulă grijă de la figura care trebuia să i-o ofere și a decis să se îngrijească singur.","wake":"Să crezi că în altă parte e mereu ceva mai bun.","flag":"„Activitățile mele nu-mi aduc decât durere și nefericire.”","grace":"„Am experiență.”","growth":"Spre Cinci sănătos: mergi în profunzime, te concentrezi și te bucuri de liniște.","stress":"Spre Unu mediu: devii critic, nerăbdător și perfecționist.","levels":{"h":"Recunoscător, plin de bucurie, concentrat, profund împlinit.","a":"Ocupat, distras, mereu planificând următorul lucru.","u":"Impulsiv, excesiv, fuge de durere cu orice preț."},"actions":["Rămâi cinci minute cu un sentiment neplăcut, fără să-l repari sau să fugi de el.","Termină un proiect început înainte să începi unul nou.","Notează în fiecare seară trei lucruri pentru care ești recunoscător azi."]},"8":{"name":"Provocatorul","tag":"Sigur pe sine, hotărât, protector","summary":"Te conduce dorința de a te proteja și de a păstra controlul asupra vieții tale. Ești puternic, direct și gata de acțiune. Dedesubt există o latură tandră pe care o arăți rar.","desire":"Să te protejezi și să-ți hotărăști singur drumul","fear":"Să fii rănit, controlat sau trădat","passion":"Poftă (intensitate)","fixation":"Răzbunare","virtue":"Inocență","idea":"Adevărul Sfânt","childMsg":"„Nu e în regulă să fii vulnerabil sau să ai încredere în cineva.”","lostMsg":"„Nu vei fi trădat.”","figure":"figurii care oferă grijă","rel":"respingere","famNote":"Tandrețea și încrederea nu au venit de la figura care trebuia să ofere grijă, așa că copilul a concluzionat că vulnerabilitatea e periculoasă și și-a asumat singur rolul de protector.","wake":"Să simți că trebuie să împingi și să lupți ca lucrurile să se întâmple.","flag":"„Oamenii se întorc împotriva mea; se vor răzbuna.”","grace":"„Am puterea să o fac.”","growth":"Spre Doi sănătos: îți folosești forța ca să ai grijă de ceilalți și îți lași inima să conducă.","stress":"Spre Cinci mediu: te retragi, devii secretos și plănuiești în loc să acționezi.","levels":{"h":"Mărinimos, protector, puternic și cu inimă blândă.","a":"Dominant, insistent, are nevoie de control.","u":"Nemilos, intimidant, nu are încredere în nimeni."},"actions":["Cere ajutor o dată săptămâna aceasta și acceptă-l fără să preiei controlul.","Când simți impulsul de a împinge, oprește-te trei respirații și întreabă ce protejezi.","Arată cuiva latura ta mai blândă: spune-i ce înseamnă pentru tine."]},"9":{"name":"Împăciuitorul","tag":"Receptiv, liniștitor, comod","summary":"Te conduce dorința de pace interioară și exterioară. Vezi toate părțile, îi liniștești pe ceilalți și ții lucrurile laolaltă. Riscul este să te uiți pe tine și propria voce.","desire":"Stabilitate interioară și liniște sufletească","fear":"Pierdere, despărțire și conflict","passion":"Lene (uitare de sine)","fixation":"Indolență","virtue":"Acțiunea potrivită","idea":"Iubirea Sfântă","childMsg":"„Nu e în regulă să te afirmi.”","lostMsg":"„Prezența ta contează.”","figure":"ambilor părinți","rel":"atașament","famNote":"Copilul a fost atașat de ambii părinți și s-a făcut invizibil ca să păstreze pacea.","wake":"Să te acomodezi celorlalți ca
